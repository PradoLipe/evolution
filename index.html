<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0e">
    <title>EVOLUTION V46 - LAYOUT APROVADO</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap');
        
        :root {
            --primary: #00d1b2;
            --danger: #ff3860;
            --success: #48c774;
            --bg: #0a0a0e;
            --card: #16161d;
            --text: #ffffff;
            --text-dim: #8e8e93;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 480px; margin: 0 auto; }

        /* LOGIN */
        .login-box { background: var(--card); padding: 40px; border-radius: 20px; text-align: center; margin-top: 15vh; border: 1px solid var(--border); }
        .pin-input { width: 100%; padding: 15px; text-align: center; letter-spacing: 10px; font-size: 20px; background: #000; border: 1px solid var(--border); color: var(--primary); border-radius: 10px; margin: 20px 0; }

        /* DASHBOARD */
        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .dash-card { background: var(--card); padding: 15px; border-radius: 15px; border-left: 4px solid var(--primary); }
        .dash-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; }
        .dash-val { font-size: 1.1rem; font-weight: 800; font-family: 'Space Mono'; }

        /* SECTIONS */
        .section { background: var(--card); border-radius: 15px; padding: 20px; margin-bottom: 15px; border: 1px solid var(--border); }
        .section-title { font-size: 12px; font-weight: 800; color: var(--primary); margin-bottom: 15px; text-transform: uppercase; }

        /* INPUTS */
        label { display: block; font-size: 10px; color: var(--text-dim); margin-bottom: 5px; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; background: #000; border: 1px solid var(--border); border-radius: 8px; color: #fff; margin-bottom: 15px; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        /* BUTTONS */
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .btn-primary { background: var(--primary); color: #000; }
        .btn-success { background: var(--success); color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }

        /* HISTORICO */
        .hist-item { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .navio-name { font-weight: 800; font-size: 14px; }
        .pendente { color: var(--danger); }
        .pago { color: var(--success); }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container" id="loginScreen">
        <div class="login-box">
            <h1 style="letter-spacing:5px; color:var(--primary)">EVOLUTION</h1>
            <p style="font-size:10px; color:var(--text-dim)">VERSAO V46 PRO</p>
            <input type="password" id="pin" class="pin-input" maxlength="6" placeholder="******">
            <button class="btn btn-primary" onclick="app.login()">ACESSAR</button>
        </div>
    </div>

    <div class="container hidden" id="mainPanel">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <h2 id="userName" style="font-size:14px;">...</h2>
            <button onclick="app.logout()" style="background:none; border:none; color:var(--danger); font-size:10px;">SAIR</button>
        </div>

        <div class="dash-grid">
            <div class="dash-card"><span class="dash-label">Líquido</span><div class="dash-val" id="totalLiq">R$ 0,00</div></div>
            <div class="dash-card" style="border-color:var(--danger)"><span class="dash-label">Pendente</span><div class="dash-val" id="totalPend">R$ 0,00</div></div>
        </div>

        <div class="section">
            <div class="section-title">RELATORIO WHATSAPP</div>
            <input type="text" id="waNavio" placeholder="NOME DO NAVIO" style="text-transform:uppercase;">
            <div class="row">
                <input type="date" id="waData">
                <select id="waTurno">
                    <option value="07x15">07x15</option>
                    <option value="15x23" selected>15x23</option>
                    <option value="23x07">23x07</option>
                </select>
            </div>
            <div class="row">
                <input type="number" id="waP1" placeholder="QTD 15-19">
                <input type="number" id="waP2" placeholder="QTD 19-23">
            </div>
            <button class="btn btn-success" onclick="app.copyWhatsApp()">COPIAR PARA WHATSAPP</button>
        </div>

        <div class="section">
            <div class="section-title">NOVA PRODUCAO</div>
            <input type="text" id="fNavio" placeholder="NAVIO" style="text-transform:uppercase;">
            <div class="row">
                <select id="fTipo">
                    <option value="normal">NORMAL</option>
                    <option value="feriado">FERIADO</option>
                </select>
                <input type="number" id="fValor" placeholder="VALOR LIQUIDO">
            </div>
            <button class="btn btn-primary" onclick="app.saveFinance()">SALVAR NO HISTORICO</button>
        </div>

        <div class="section">
            <div class="section-title">HISTORICO</div>
            <div id="histList"></div>
            <button class="btn" style="background:#222; margin-top:10px; color:#fff;" onclick="app.exportJSON()">EXPORTAR BACKUP</button>
        </div>
    </div>

    <script>
        const USERS = {"002451": "FELIPE PRADO", "7806": "EDILSON JR", "1980": "ANDERSON PRADO"};

        class Evolution {
            constructor() {
                this.data = JSON.parse(localStorage.getItem('evo_db')) || [];
                this.user = null;
                this.init();
            }

            init() {
                const hoje = new Date().toISOString().split('T')[0];
                document.getElementById('waData').value = hoje;
            }

            login() {
                const pin = document.getElementById('pin').value;
                if (USERS[pin]) {
                    this.user = USERS[pin];
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('mainPanel').classList.remove('hidden');
                    document.getElementById('userName').textContent = this.user;
                    this.render();
                } else {
                    alert('PIN INCORRETO');
                }
            }

            copyWhatsApp() {
                const navio = document.getElementById('waNavio').value.toUpperCase();
                const data = new Date(document.getElementById('waData').value).toLocaleDateString('pt-BR');
                const turno = document.getElementById('waTurno').value;
                const p1 = document.getElementById('waP1').value || 0;
                const p2 = document.getElementById('waP2').value || 0;
                const total = parseInt(p1) + parseInt(p2);

                const texto = `*${navio}*\nData: ${data} - ${turno}\nTerno: 1°\n15x19: ${p1}\n19x23: ${p2}\nTOTAL: ${total}\n${this.user}.`;
                
                navigator.clipboard.writeText(texto).then(() => alert('RELATORIO COPIADO'));
            }

            saveFinance() {
                const navio = document.getElementById('fNavio').value.toUpperCase();
                const valor = parseFloat(document.getElementById('fValor').value) || 0;
                if (!navio || valor <= 0) return;

                this.data.unshift({
                    id: Date.now(),
                    navio,
                    valor: Math.round(valor * 100),
                    pago: false,
                    data: new Date().toLocaleDateString('pt-BR')
                });

                this.save();
                this.render();
                document.getElementById('fNavio').value = '';
                document.getElementById('fValor').value = '';
            }

            togglePago(id) {
                const item = this.data.find(x => x.id === id);
                if (item) item.pago = !item.pago;
                this.save();
                this.render();
            }

            delete(id) {
                if(confirm('EXCLUIR?')) {
                    this.data = this.data.filter(x => x.id !== id);
                    this.save();
                    this.render();
                }
            }

            save() { localStorage.setItem('evo_db', JSON.stringify(this.data)); }

            render() {
                let liq = 0, pend = 0;
                const list = document.getElementById('histList');
                list.innerHTML = '';

                this.data.forEach(item => {
                    const v = item.valor / 100;
                    liq += v;
                    if (!item.pago) pend
