<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SISTEMA EVOLUTION - V31</title>
    <style>
        :root { --primary: #00d1b2; --accent: #ffdd57; --danger: #ff3860; --bg: #0a0a0a; --card: #1a1a1a; --input: #262626; }
        * { -webkit-user-select: none; user-select: none; box-sizing: border-box; }
        input, select { user-select: text; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; padding: 10px; display: flex; justify-content: center; margin: 0; }
        .container { max-width: 480px; width: 100%; background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid #333; }
        h2 { text-align: center; color: var(--primary); text-transform: uppercase; letter-spacing: 2px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #aaa; font-size: 10px; text-transform: uppercase; }
        input, select { width: 100%; padding: 14px; margin-top: 5px; border: 1px solid #333; background: var(--input); color: white; border-radius: 10px; font-size: 16px; outline: none; }
        button { width: 100%; padding: 16px; margin-top: 12px; border: none; border-radius: 10px; font-size: 13px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        .btn-main { background: var(--primary); color: #000; }
        .btn-whatsapp { background: #48c774; color: #000; }
        .btn-calc { background: var(--accent); color: #000; }
        .section-card { background: #222; padding: 18px; border-radius: 15px; border: 1px solid #333; margin-top: 20px; display: none; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
        th { color: var(--primary); padding: 10px 5px; text-align: left; border-bottom: 2px solid #333; }
        td { padding: 12px 5px; border-bottom: 1px solid #222; }
        .val-liquido-hist { font-size: 14px; color: var(--accent); font-weight: bold; }
        .resumo-financeiro { background: #000; padding: 20px; border-radius: 15px; margin-top: 20px; border: 1px solid var(--accent); text-align: center; }
        .copyright { text-align: center; font-size: 9px; color: #555; margin-top: 25px; }
    </style>
</head>
<body>

<div class="container" id="login-screen">
    <h2>SISTEMA EVOLUTION</h2>
    <label>CHAVE DE ACESSO</label>
    <input type="tel" id="senhaInput" placeholder="000000" style="-webkit-text-security: disc;">
    <button class="btn-main" onclick="login()">ACESSAR PAINEL</button>
    <div class="copyright">© 2026 FELIPE PRADO</div>
</div>

<div class="container" id="main-panel" style="display: none;">
    <h2 id="saudacao">PAINEL</h2>

    <div id="relatorio-box">
        <label>Data:</label><input type="date" id="dataTurno">
        <label>Navio:</label><input type="text" id="navioRel" placeholder="NOME DO NAVIO">
        <label>Número do Terno:</label><input type="number" id="ternoRelInput" placeholder="Ex: 1">
        <label>Turno:</label>
        <select id="turnoRel" onchange="salvarTurno('rel', this.value)">
            <option value="">Selecione</option>
            <option value="07x15">07x15</option>
            <option value="15x23">15x23</option>
            <option value="23x07">23x07</option>
        </select>
        <div id="camposRel"></div>
        <button class="btn-whatsapp" onclick="gerarRel()">GERAR TEXTO WHATSAPP</button>
        <div id="relatorioArea" style="display:none; margin-top:15px; padding:12px; background:#000; color:var(--primary); border-radius:8px; border:1px solid var(--primary); white-space:pre-line; font-size:12px; font-family: monospace;"></div>
        <button id="btnCopiar" onclick="copiar()" style="display:none; background:#3273dc; color:white;">COPIAR MENSAGEM</button>
    </div>

    <button class="btn-calc" onclick="abrirCalc()">📊 CALCULADORA E LANÇAMENTO</button>
    
    <div class="section-card" id="calcSection">
        <h3>💰 Novo Lançamento</h3>
        <label>Navio:</label><input type="text" id="navioCalc">
        <label>Dia:</label><select id="tipoDia"><option value="n">NORMAL</option><option value="f">DOMINGO/FERIADO</option></select>
        <label>Turno:</label>
        <select id="turnoCalc" onchange="salvarTurno('calc', this.value)">
            <option value="07x15">07x15</option>
            <option value="15x23">15x23</option>
            <option value="23x07">23x07</option>
        </select>
        <div id="camposCalc"></div>
        <label>Conferentes:</label><select id="nConf"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option></select>
        <button class="btn-main" onclick="calcularESalvar()">SALVAR NO HISTÓRICO</button>
    </div>

    <div class="history-section">
        <h3>📅 Histórico</h3>
        <table id="tabelaHistorico">
            <thead><tr><th>DATA</th><th>NAVIO</th><th>VALOR</th><th></th></tr></thead>
            <tbody></tbody>
        </table>
        <div class="resumo-financeiro">
            TOTAL LÍQUIDO: <span id="totalAcumulado" style="color:var(--accent); font-weight:bold;">R$ 0,00</span>
        </div>
    </div>
</div>

<script>
    const USERS = {"002451":"FELIPE PRADO","1980":"ANDERSON PRADO","2026":"FABRICIO DIAS","302466":"RODRIGO COSTA","3373":"RICARDO PRADO"};
    let logado = "", userKey = "";

    function login() {
        userKey = document.getElementById('senhaInput').value.trim();
        if (USERS[userKey]) { entrar(); } else { alert("Chave inválida."); }
    }

    function entrar() {
        logado = USERS[userKey];
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-panel').style.display = 'block';
        document.getElementById('saudacao').innerText = "OLÁ, " + logado;
        
        const hoje = new Date().toISOString().split('T')[0];
        document.getElementById('dataTurno').value = hoje;
        
        document.getElementById('turnoRel').value = localStorage.getItem('last_rel_' + logado) || "";
        document.getElementById('turnoCalc').value = localStorage.getItem('last_calc_' + logado) || "15x23";
        
        ajustarRel(); ajustarCalc(); carregarHistorico();
    }

    function salvarTurno(tipo, valor) {
        localStorage.setItem('last_' + tipo + '_' + logado, valor);
        if(tipo === 'rel') ajustarRel(); else ajustarCalc();
    }

    function ajustarRel() {
        const t = document.getElementById('turnoRel').value;
        const div = document.getElementById('camposRel');
        div.innerHTML = (t === "15x23") ? '<label>Prod 15x19:</label><input type="number" id="p1"><label>Prod 20x23:</label><input type="number" id="p2">' : (t===""?"":'<label>Produção:</label><input type="number" id="pGeral">');
    }

    function gerarRel() {
        const tur = document.getElementById('turnoRel').value; if(!tur) return;
        const navio = (document.getElementById('navioRel').value || "S/N").toUpperCase();
        const numT = document.getElementById('ternoRelInput').value;
