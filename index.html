<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SISTEMA EVOLUTION - V15</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; padding: 10px; display: flex; justify-content: center; margin: 0; }
        .container { max-width: 450px; width: 100%; background: #1a1a1a; padding: 15px; border-radius: 15px; border: 1px solid #444; box-sizing: border-box; }
        h2 { text-align: center; color: #00d1b2; text-transform: uppercase; margin-bottom: 20px; font-size: 18px; }
        label { display: block; margin-top: 12px; font-weight: bold; color: #00d1b2; font-size: 11px; text-transform: uppercase; }
        
        /* Campos de Input Maiores para facilitar edição */
        input, select { width: 100%; padding: 14px; margin-top: 5px; border: 1px solid #333; background: #262626; color: white; border-radius: 8px; box-sizing: border-box; font-size: 16px; outline: none; display: block; }
        input:focus { border-color: #00d1b2; background: #333; }

        button { width: 100%; padding: 15px; margin-top: 10px; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        .btn-acessar { background: #00d1b2; color: #000; }
        .btn-gerar { background: #48c774; color: #000; }
        
        .calc-section { display: none; margin-top: 20px; padding: 15px; background: #222; border: 1px solid #ffdd57; border-radius: 12px; }
        #resCalc { display:none; margin-top:15px; text-align: center; border-top: 1px solid #444; padding-top: 10px; }
        
        /* HISTÓRICO AJUSTADO V15 */
        .history-section { margin-top: 30px; border-top: 2px solid #333; padding-top: 20px; width: 100%; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; table-layout: fixed; }
        th { background: #333; color: #00d1b2; padding: 8px 4px; text-align: left; }
        td { padding: 12px 4px; border-bottom: 1px solid #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        /* BOTÕES NA TABELA */
        .action-cell { display: flex; gap: 4px; align-items: center; justify-content: flex-start; }
        .btn-pay { background: #48c774; color: #000; padding: 8px 4px; border-radius: 4px; border: 1px solid #fff; font-weight: bold; font-size: 9px; flex: 2; text-align: center; text-decoration: none; }
        .btn-del { background: #ff3860; color: #fff; padding: 8px 4px; border-radius: 4px; border: 1px solid #fff; font-weight: bold; font-size: 10px; flex: 1; text-align: center; }
        .status-pago { color: #48c774; font-weight: bold; font-size: 9px; flex: 2; text-align: center; border: 1px dashed #48c774; padding: 7px 2px; border-radius: 4px; }
        
        .val-bruto { color: #aaa; font-size: 9px; display: block; }
        .val-liquido { color: #ffdd57; font-weight: bold; font-size: 11px; display: block; }
        .resumo-box { background: #000; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid #ffdd57; }
    </style>
</head>
<body>

<div class="container" id="login-screen">
    <h2>SISTEMA EVOLUTION</h2>
    <input type="tel" id="senhaInput" placeholder="Chave de Acesso" style="-webkit-text-security: disc;">
    <button class="btn-acessar" onclick="login()">ENTRAR</button>
</div>

<div class="container" id="main-panel" style="display: none;">
    <h2 id="saudacao">PAINEL</h2>
    
    <label>DATA:</label>
    <input type="date" id="dataTurno">
    
    <label>NAVIO:</label>
    <input type="text" id="navio" placeholder="NOME DO NAVIO" autocomplete="off">
    
    <label>TERNO:</label>
    <input type="text" id="ternoInput" placeholder="Ex: 1º TERNO">
    
    <label>TURNO WHATSAPP:</label>
    <select id="turnoRel" onchange="ajustarRel()">
        <option value="">Selecione o Turno</option>
        <option value="07x15">07x15</option>
        <option value="15x23">15x23</option>
        <option value="23x07">23x07</option>
    </select>
    <div id="camposRel"></div>
    <button class="btn-gerar" onclick="gerarRel()">GERAR TEXTO WHATSAPP</button>
    <div id="relatorioArea" style="display:none; margin-top:15px; padding:10px; background:#000; color:#00ffca; border:1px solid #00d1b2; font-family:monospace; font-size:11px; white-space:pre-line;"></div>
    <button id="btnCopiar" onclick="copiar()" style="display:none; background:#3273dc; color:white;">COPIAR MENSAGEM</button>

    <hr style="border:0; border-top:1px solid #444; margin:25px 0;">

    <button class="btn-acessar" style="background:#ffdd57; color:#000;" onclick="document.getElementById('calcSection').style.display='block'">📊 CALCULADORA E SALVAR</button>
    
    <div class="calc-section" id="calcSection">
        <label>DIA:</label>
        <select id="tipoDia"><option value="n">NORMAL</option><option value="f">DOMINGO/FERIADO</option></select>
        <label>TURNO CÁLCULO:</label>
        <select id="turnoCalc" onchange="ajustarCalc()">
            <option value="07x15">07x15</option><option value="15x23" selected>15x23</option><option value="23x07">23x07</option>
        </select>
        <div id="camposCalc"></div>
        <label>CONFERENTES:</label>
        <select id="nConf"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option></select>
        <button class="btn-gerar" style="background:#ffdd57; color:black;" onclick="calcularESalvar()">CALCULAR E SALVAR</button>
        <div id="resCalc">
            <div id="resBruto" style="color:#aaa; font-size:13px;"></div>
            <div id="resLiquido" style="color: #ffdd57; font-size: 19px; font-weight: bold;"></div>
        </div>
    </div>

    <div class="history-section">
        <h3 style="font-size: 14px; color: #00d1b2;">MEU HISTÓRICO</h3>
        <table id="tabelaHistorico">
            <thead>
                <tr>
                    <th style="width: 18%;">DATA</th>
                    <th style="width: 27%;">NAVIO</th>
                    <th style="width: 25%;">VALOR</th>
                    <th style="width: 30%;">AÇÃO</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <div class="resumo-box">
            <div style="font-size: 12px;">TOTAL LÍQUIDO: <span id="totalAcumulado" style="float:right;">R$ 0,00</span></div>
            <div style="font-size: 14px; margin-top:8px; font-weight:bold; color:#ffdd57;">A RECEBER: <span id="totalPendente" style="float:right;">R$ 0,00</span></div>
        </div>
        <button style="background:#ff3860; color:white; font-size:10px; width:auto; margin-top: 15px;" onclick="limparHistorico()">APAGAR TUDO</button>
    </div>
</div>

<script>
    const USERS = {"002451": "FELIPE PRADO", "1980": "ANDERSON PRADO", "2026": "FABRICIO DIAS", "302466": "RODRIGO COSTA"};
    let logado = "";
    document.getElementById('dataTurno').value = new Date().toISOString().split('T')[0];

    function login() {
        const s = document.getElementById('senhaInput').value.trim();
        if (USERS[s]) {
            logado = USERS[s];
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-panel').style.display = 'block';
            document.getElementById('saudacao').innerText = "OLÁ, " + logado;
            ajustarCalc(); carregarHistorico();
        } else { alert("Senha incorreta."); }
    }

    function ajustarRel() {
        const t = document.getElementById('turnoRel').value;
        const div = document.getElementById('camposRel');
        div.innerHTML = (t === "15x23") ? '<label>PROD 15x19:</label><input type="number" id="p1"><label>PROD 20x23:</label><input type="number" id="p2">' : (t===""?"":'<label>PRODUÇÃO TOTAL:</label><input type="number" id="pGeral">');
    }

    function gerarRel() {
        const tur = document.getElementById('turnoRel').value;
        if(!tur) return alert("Selecione o turno!");
        const n = (document.getElementById('navio').value || "S/N").toUpperCase();
        const terno = (document.getElementById('ternoInput').value || "S/T").toUpperCase();
        const d = document.getElementById('dataTurno').value.split('-').reverse().join('/');
        let p = "", tot = 0;
        if(tur === "15x23") {
            const v1 = parseInt(document.getElementById('p1').value) || 0;
            const v2 = parseInt(document.getElementById('p2').value) || 0;
            p = `15x19: ${v1}\n20x23: ${v2}`; tot = v1 + v2;
        } else {
            tot = parseInt(document.getElementById('pGeral').value) || 0;
            p = `PRODUÇÃO: ${tot}`;
        }
        document.getElementById('relatorioArea').innerText = `NAVIO: ${n}\nDATA: ${d}\nTERNO: ${terno}\nTURNO: ${tur}\n${p}\nTOTAL: ${tot}\nCONF: ${logado}`;
        document.getElementById('relatorioArea').style.display = 'block';
        document.getElementById('btnCopiar').style.display = 'block';
    }

    function ajustarCalc() {
        const t = document.getElementById('turnoCalc').value;
        document.getElementById('camposCalc').innerHTML = (t === "15x23") ? `<label>PROD 15x19:</label><input type="number" id="t1"><label>PROD 20x23:</label><input type="number" id="t2">` : `<label>PROD TOTAL:</label><input type="number" id="tGeral">`;
    }

    function calcularESalvar() {
        const data = document.getElementById('dataTurno').value.split('-').reverse().join('/');
        const navio = (document.getElementById('navio').value || "S/N").toUpperCase();
        const tur = document.getElementById('turnoCalc').value;
        const tipo = document.getElementById('tipoDia').value;
        const n = parseInt(document.getElementById('nConf').value);
        let brutoTotal = 0;
        if(tur === "15x23") {
            const v1 = parseInt(document.getElementById('t1').value) || 0;
            const v2 = parseInt(document.getElementById('t2').value) || 0;
            brutoTotal = (tipo === 'f') ? (v1 * 8.61) + (v2 * 10.32) : (v1 * 5.73) + (v2 * 6.88);
        } else {
            const prod = parseInt(document.getElementById('tGeral').value) || 0;
            const taxa = (tur === "07x15") ? (tipo === 'f' ? 8.61 : 5.73) : 6.88;
            brutoTotal = prod * taxa;
        }
        const brutoIndiv = brutoTotal / n;
        const liquido = brutoIndiv * 0.82;
        
        document.getElementById('resBruto').innerText = "BRUTO: R$ " + brutoIndiv.toFixed(2);
        document.getElementById('resLiquido').innerText = "LÍQUIDO: R$ " + liquido.toFixed(2);
        document.getElementById('resCalc').style.display = 'block';

        let hist = JSON.parse(localStorage.getItem('hist_' + logado)) || [];
        hist.push({ id: Date.now(), data, navio, bruto: brutoIndiv, liquido, pago: false });
        localStorage.setItem('hist_' + logado, JSON.stringify(hist));
        carregarHistorico();
    }

    function carregarHistorico() {
        const lista = JSON.parse(localStorage.getItem('hist_' + logado)) || [];
        const corpo = document.querySelector('#tabelaHistorico tbody');
        corpo.innerHTML = ""; let totalMes = 0, pendente = 0;
        lista.forEach(item => {
            totalMes += item.liquido; if(!item.pago) pendente += item.liquido;
            const statusHtml = item.pago ? `<span class="status-pago" onclick="alternarPago(${item.id})">PAGO</span>` : `<button class="btn-pay" onclick="alternarPago(${item.id})">PAGAR</button>`;
            corpo.innerHTML += `<tr>
                <td>${item.data.substring(0,5)}</td>
                <td>${item.navio}</td>
                <td><span class="val-bruto">B:${item.bruto.toFixed(2)}</span><span class="val-liquido">L:${item.liquido.toFixed(2)}</span></td>
                <td><div class="action-cell">${statusHtml}<button class="btn-del" onclick="excluirItem(${item.id})">X</button></div></td>
            </tr>`;
        });
        document.getElementById('totalAcumulado').innerText = "R$ " + totalMes.toFixed(2);
        document.getElementById('totalPendente').innerText = "R$ " + pendente.toFixed(2);
    }

    function alternarPago(id) {
        let hist = JSON.parse(localStorage.getItem('hist_' + logado));
        hist = hist.map(item => item.id === id ? {...item, pago: !item.pago} : item);
        localStorage.setItem('hist_' + logado, JSON.stringify(hist)); carregarHistorico();
    }

    function excluirItem(id) {
        if(confirm("Apagar este serviço?")) {
            let hist = JSON.parse(localStorage.getItem('hist_' + logado));
            hist = hist.filter(item => item.id !== id);
            localStorage.setItem('hist_' + logado, JSON.stringify(hist)); carregarHistorico();
        }
    }

    function copiar() { navigator.clipboard.writeText(document.getElementById('relatorioArea').innerText); alert("Copiado!"); }
    function limparHistorico() { if(confirm("Deseja mesmo limpar todo o histórico?")) { localStorage.removeItem('hist_' + logado); carregarHistorico(); } }
</script>
</body>
</html>
