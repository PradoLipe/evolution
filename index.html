<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVOLUTION - V40</title>
    <style>
        :root { 
            --primary: #00d1b2; 
            --accent: #ffd700; 
            --danger: #ff3860;
            --success: #48c774;
            --info: #209cee;
            --bg: #0f0f13; 
            --card: #1a1a20;
            --input: #25252a;
            --text: #ffffff;
            --text-dim: #a0a0a5;
            --border: rgba(255,255,255,0.05);
        }

        [data-theme="light"] {
            --bg: #f4f4f9;
            --card: #ffffff;
            --input: #ececef;
            --text: #1c1c1e;
            --text-dim: #6e6e73;
            --border: rgba(0,0,0,0.05);
        }
        
        * { -webkit-user-select: none; user-select: none; box-sizing: border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
        input, select { user-select: text; }
        
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            padding: 15px; 
            min-height: 100vh;
            display: flex; 
            justify-content: center;
        }
        
        .container { max-width: 480px; width: 100%; position: relative; }
        
        /* HEADER */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .config-btn {
            background: var(--card);
            border: 1px solid var(--border);
            width: 40px; height: 40px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 18px;
        }

        /* DASHBOARD SUPERIOR */
        .dash-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            margin-bottom: 25px; 
        }
        .dash-item { 
            background: var(--card); 
            padding: 15px; 
            border-radius: 16px; 
            border: 1px solid var(--border);
        }
        .dash-label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; display: block; }
        .dash-val { font-size: 1.1rem; font-weight: 800; }
        
        .val-bruto-top { color: var(--info); }
        .val-liq-top { color: var(--accent); }
        .val-pend-top { color: var(--danger); }
        .val-rec-top { color: var(--success); }

        /* SEÇÕES */
        .section-card { 
            background: var(--card); 
            padding: 20px; 
            border-radius: 20px; 
            margin-bottom: 15px;
            border: 1px solid var(--border);
        }

        h3 { font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }

        /* LISTA DE HISTÓRICO */
        .hist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .hist-info { flex: 1; }
        .hist-name { font-weight: 700; font-size: 0.9rem; display: block; }
        .hist-meta { font-size: 0.7rem; color: var(--text-dim); }

        .hist-values { text-align: right; margin-right: 12px; }
        .val-liq { color: var(--accent); font-weight: 800; font-size: 0.95rem; display: block; }
        .val-bruto { color: var(--text-dim); font-size: 0.7rem; text-decoration: line-through; }

        /* BOTÕES E INPUTS */
        button { border-radius: 12px; font-weight: 700; border: none; cursor: pointer; padding: 14px; font-size: 0.8rem; transition: 0.2s; }
        button:active { transform: scale(0.97); }
        .btn-main { background: var(--primary); color: #000; width: 100%; }
        .btn-whatsapp { background: #25d366; color: #fff; width: 100%; margin-top: 15px; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); width: 100%; }
        
        input, select { 
            width: 100%; padding: 14px; background: var(--input); border: 1px solid transparent; 
            border-radius: 12px; color: var(--text); font-size: 0.95rem; margin-top: 8px;
        }
        input:focus { border-color: var(--primary); outline: none; }

        .badge { font-size: 0.65rem; padding: 3px 8px; border-radius: 6px; font-weight: 800; cursor: pointer; }
        .badge-pend { background: rgba(255,56,96,0.15); color: var(--danger); border: 1px solid var(--danger); }
        .badge-ok { background: rgba(72,199,116,0.15); color: var(--success); border: 1px solid var(--success); }

        .hidden { display: none !important; }
        
        /* MODAL */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: var(--card); padding: 25px; border-radius: 20px; width: 100%; max-width: 380px; }

        .toast { position: fixed; bottom: 20px; background: var(--primary); color: #000; padding: 10px 20px; border-radius: 50px; font-weight: 700; z-index: 2000; transform: translateY(100px); transition: 0.3s; }
        .toast.show { transform: translateY(0); }
    </style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="modal" id="modalConfig">
    <div class="modal-content">
        <h3 style="color:var(--text); font-size: 1.1rem;">Ajustes e Backup</h3>
        <label>Tema do Aplicativo</label>
        <select id="themeSelect" onchange="mudarTema(this.value)">
            <option value="dark">🌙 Modo Escuro</option>
            <option value="light">☀️ Modo Claro</option>
        </select>
        <div style="margin-top: 20px; display: grid; gap: 10px;">
            <button class="btn-outline" onclick="exportarBackupJSON()">📤 Gerar Arquivo de Backup</button>
            <button class="btn-outline" onclick="$('importFile').click()">📥 Importar de outro celular</button>
            <button class="btn-outline" onclick="exportarCSV()">📄 Baixar Excel (CSV)</button>
            <button class="btn-main" onclick="mostrarPix()" style="background: var(--accent);">☕ Apoiar Desenvolvedor</button>
            <button class="btn-outline" style="color: var(--danger); border-color: var(--danger);" onclick="limparTodos()">🗑️ Resetar Tudo</button>
        </div>
        <input type="file" id="importFile" class="hidden" accept=".json" onchange="importarBackupJSON(event)">
        <button class="btn-main" style="margin-top: 20px;" onclick="fecharConfig()">Voltar</button>
    </div>
</div>

<div class="container" id="login-screen">
    <div style="text-align:center; margin-top: 35vh;">
        <h2 style="font-size: 2.2rem; color: var(--primary); letter-spacing: 4px;">EVOLUTION</h2>
        <input type="tel" id="senhaInput" placeholder="Sua Senha" style="text-align:center; -webkit-text-security: disc;" maxlength="6">
        <button class="btn-main" style="margin-top: 15px;" onclick="login()">ENTRAR</button>
    </div>
</div>

<div class="container hidden" id="main-panel">
    <div class="app-header">
        <div>
            <span id="saudacao" style="font-size: 0.6rem; color: var(--text-dim); letter-spacing: 1px;">PAINEL LOGADO</span>
            <h2 id="userName" style="font-size: 1.2rem;">CARREGANDO...</h2>
        </div>
        <div class="config-btn" onclick="abrirConfig()">⚙️</div>
    </div>

    <div class="dash-grid">
        <div class="dash-item"><span class="dash-label">Bruto</span><span class="dash-val val-bruto-top" id="dashTotalBruto">R$ 0</span></div>
        <div class="dash-item"><span class="dash-label">Líquido</span><span class="dash-val val-liq-top" id="dashTotalLiquido">R$ 0</span></div>
        <div class="dash-item"><span class="dash-label">A Receber</span><span class="dash-val val-pend-top" id="dashPendente">R$ 0</span></div>
        <div class="dash-item"><span class="dash-label">Recebido</span><span class="dash-val val-rec-top" id="dashRecebido">R$ 0</span></div>
    </div>

    <div class="section-card">
        <h3 onclick="toggleSection('rel-box')" style="cursor:pointer">📄 Gerador de Relatório <span style="font-size:10px">▼</span></h3>
        <div id="rel-box" class="hidden">
            <input type="text" id="navioRel" placeholder="Nome do Navio" list="listaNavios">
            <datalist id="listaNavios"></datalist>
            <div style="display:flex; gap:8px;">
                <input type="number" id="ternoRelInput" placeholder="Terno">
                <select id="turnoRel" onchange="ajustarRel()">
                    <option value="">Turno</option>
                    <option value="07x15">07x15</option>
                    <option value="15x23">15x23</option>
                    <option value="23x07">23x07</option>
                </select>
            </div>
            <div id="camposRel"></div>
            <button class="btn-whatsapp" onclick="gerarRel()">GERAR TEXTO WHATSAPP</button>
            <div id="relatorioArea" class="hidden" style="background:#000; color:var(--primary); padding:15px; border-radius:12px; margin-top:15px; font-family:monospace; font-size:11px; white-space:pre-wrap; border: 1px solid #333;"></div>
            <button id="btnCopiar" class="btn-main hidden" style="margin-top: 10px; background: var(--info); color:#fff;" onclick="copiar()">COPIAR RELATÓRIO</button>
        </div>
    </div>

    <div class="section-card">
        <h3>💰 Novo Lançamento</h3>
        <input type="text" id="navioCalc" placeholder="Nome do Navio" list="listaNavios">
        <div style="display:flex; gap:8px;">
            <select id="tipoDia"><option value="n">Dia Normal</option><option value="f">Feriado/Dom</option></select>
            <select id="turnoCalc" onchange="ajustarCalc()">
                <option value="07x15">07x15</option>
                <option value="15x23" selected>15x23</option>
                <option value="23x07">23x07</option>
            </select>
        </div>
        <div id="camposCalc"></div>
        <div style="display:flex; align-items:center; gap:10px; margin-top:10px;">
            <span style="font-size: 0.7rem; color: var(--text-dim);">Conf:</span>
            <select id="nConf" style="margin-top:0; padding:8px;"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option></select>
        </div>
        <button class="btn-main" style="margin-top: 15px;" onclick="calcularESalvar()">SALVAR SERVIÇO</button>
    </div>

    <div class="section-card">
        <h3>📅 Histórico</h3>
        <div id="listaHist"></div>
    </div>
</div>

<div class="modal" id="modalPix">
    <div class="modal-content" style="text-align:center;">
        <div style="font-size: 3rem; margin-bottom: 10px;">☕</div>
        <h4 style="margin-bottom: 10px;">Apoie o Projeto</h4>
        <p style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 20px;">Ajude o desenvolvedor a manter o sistema sempre atualizado!</p>
        <div style="background: var(--input); padding: 15px; border-radius: 12px; margin-bottom: 20px;" onclick="copiarChavePix()">
            <span style="font-size: 0.6rem; color: var(--text-dim); display:block;">CLIQUE PARA COPIAR</span>
            <span style="font-size: 1.2rem; font-weight: 800; color: var(--accent);">92994821868</span>
        </div>
        <button class="btn-main" onclick="fecharModalPix()">Fechar</button>
    </div>
</div>

<script>
    const USERS = {"002451": "FELIPE PRADO", "7806": "EdilsonRj", "1980": "ANDERSON PRADO", "2026": "FABRICIO DIAS", "302466": "RODRIGO COSTA", "3373": "RICARDO PRADO", "2912": "JOHNY"};
    let logado = "", todosDados = [];
    const $ = id => document.getElementById(id);

    function toast(msg) {
        const t = $('toast'); t.textContent = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    function login() {
        const key = $('senhaInput').value;
        if(USERS[key]) {
            logado = USERS[key];
            $('userName').textContent = logado;
            $('login-screen').classList.add('hidden');
            $('main-panel').classList.remove('hidden');
            carregarSistema();
        } else toast("Chave Inválida");
    }

    function carregarSistema() {
        todosDados = JSON.parse(localStorage.getItem('hist_' + logado)) || [];
        ajustarCalc();
        renderizarHist();
        atualizarDash();
        carregarNavios();
        const tema = localStorage.getItem('theme_' + logado) || 'dark';
        document.documentElement.setAttribute('data-theme', tema);
    }

    function toggleSection(id) { $(id).classList.toggle('hidden'); }
    function abrirConfig() { $('modalConfig').style.display = 'flex'; }
    function fecharConfig() { $('modalConfig').style.display = 'none'; }
    function mudarTema(t) { document.documentElement.setAttribute('data-theme', t); localStorage.setItem('theme_' + logado, t); }
    function mostrarPix() { $('modalPix').style.display = 'flex'; }
    function fecharModalPix() { $('modalPix').style.display = 'none'; }
    function copiarChavePix() { navigator.clipboard.writeText('92994821868'); toast("Chave Pix Copiada!"); }

    function ajustarRel() {
        const t = $('turnoRel').value;
        $('camposRel').innerHTML = t === "15x23" ? '<input type="number" id="p1" placeholder="Prod 15h-19h"><input type="number" id="p2" placeholder="Prod 20h-23h">' : (t ? '<input type="number" id="pGeral" placeholder="Produção Total">' : '');
    }

    function gerarRel() {
        const tur = $('turnoRel').value;
        if(!tur) return toast("Selecione o turno");
        const navio = ($('navioRel').value || "NAVIO").toUpperCase();
        const terno = $('ternoRelInput').value ? $('ternoRelInput').value + "°" : "S/T";
        const data = new Date().toLocaleDateString('pt-BR');
        let prodStr = "", total = 0;

        if(tur === "15x23") {
            const v1 = parseInt($('p1').value)||0; const v2 = parseInt($('p2').value)||0;
            prodStr = `15x19: ${v1}\n20x23: ${v2}`; total = v1+v2;
        } else {
            total = parseInt($('pGeral').value)||0;
            prodStr = `PRODUÇÃO: ${total}`;
        }

        const texto = `* Relatório de Produção *\n\nNavio: ${navio}\nData: ${data}\nTerno: ${terno}\nTurno: ${tur}\n\n${prodStr}\nTotal: ${total}\n\nConferente: ${logado}`;
        $('relatorioArea').textContent = texto;
        $('relatorioArea').classList.remove('hidden');
        $('btnCopiar').classList.remove('hidden');
        salvarNavio(navio);
    }

    function copiar() { navigator.clipboard.writeText($('relatorioArea').textContent); toast("Texto Copiado!"); }

    function ajustarCalc() {
        const t = $('turnoCalc').value;
        $('camposCalc').innerHTML = t === "15x23" ? '<input type="number" id="t1" placeholder="Prod 15h-19h"><input type="number" id="t2" placeholder="Prod 20h-23h">' : '<input type="number" id="tGeral" placeholder="Produção Total">';
    }

    function calcularESalvar() {
        const navio = ($('navioCalc').value || "S/N").toUpperCase();
        const tur = $('turnoCalc').value;
        const tipo = $('tipoDia').value;
        const n = parseInt($('nConf').value);
        let brutoTotal = 0;

        if(tur === "15x23") {
            const v1 = parseInt($('t1').value)||0; const v2 = parseInt($('t2').value)||0;
            brutoTotal = (tipo === 'f') ? (v1 * 8.61) + (v2 * 10.32) : (v1 * 5.73) + (v2 * 6.88);
        } else {
            const prod = parseInt($('tGeral').value)||0;
            const taxa = (tur === "07x15") ? (tipo === 'f' ? 8.61 : 5.73) : 6.88;
            brutoTotal = prod * taxa;
        }

        const brutoInd = brutoTotal / n;
        const liqInd = brutoInd * 0.82;
        
        const registro = {
            id: Date.now(),
            data: new Date().toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'}),
            navio,
            bruto: brutoInd,
            liquido: liqInd,
            pago: false
        };

        todosDados.unshift(registro);
        localStorage.setItem('hist_' + logado, JSON.stringify(todosDados));
        renderizarHist();
        atualizarDash();
        salvarNavio(navio);
        toast("Serviço Salvo!");
    }

    function renderizarHist() {
        const container = $('listaHist');
        container.innerHTML = todosDados.length ? '' : '<p style="text-align:center; color:var(--text-dim); padding:20px; font-size:0.8rem;">Nenhum registro</p>';
        
        todosDados.forEach(item => {
            const div = document.createElement('div');
            div.className = 'hist-item';
            div.innerHTML = `
                <div class="hist-info">
                    <span class="hist-name">${item.navio}</span>
                    <span class="hist-meta">${item.data} • <span class="badge ${item.pago?'badge-ok':'badge-pend'}" onclick="alternarStatus(${item.id})">${item.pago?'PAGO':'PENDENTE'}</span></span>
                </div>
                <div class="hist-values">
                    <span class="val-liq">R$ ${item.liquido.toFixed(2)}</span>
                    <span class="val-bruto">R$ ${item.bruto.toFixed(2)}</span>
                </div>
                <button style="background:none; color:var(--danger); font-size:1.1rem; padding:5px;" onclick="excluirItem(${item.id})">×</button>
            `;
            container.appendChild(div);
        });
    }

    function alternarStatus(id) {
        const idx = todosDados.findIndex(i => i.id === id);
        todosDados[idx].pago = !todosDados[idx].pago;
        localStorage.setItem('hist_' + logado, JSON.stringify(todosDados));
        renderizarHist();
        atualizarDash();
    }

    function atualizarDash() {
        const brutoT = todosDados.reduce((a,b) => a + b.bruto, 0);
        const liqT = todosDados.reduce((a,b) => a + b.liquido, 0);
        const pendT = todosDados.filter(i => !i.pago).reduce((a,b) => a + b.liquido, 0);
        const recT = todosDados.filter(i => i.pago).reduce((a,b) => a + b.liquido, 0);

        $('dashTotalBruto').textContent = "R$ " + brutoT.toFixed(0);
        $('dashTotalLiquido').textContent = "R$ " + liqT.toFixed(0);
        $('dashPendente').textContent = "R$ " + pendT.toFixed(0);
        $('dashRecebido').textContent = "R$ " + recT.toFixed(0);
    }

    function excluirItem(id) {
        if(confirm("Excluir este serviço?")) {
            todosDados = todosDados.filter(i => i.id !== id);
            localStorage.setItem('hist_' + logado, JSON.stringify(todosDados));
            renderizarHist();
            atualizarDash();
        }
    }

    function salvarNavio(n) {
        let ns = JSON.parse(localStorage.getItem('navios_'+logado))||[];
        if(!ns.includes(n)){ ns.push(n); localStorage.setItem('navios_'+logado, JSON.stringify(ns)); carregarNavios(); }
    }
    function carregarNavios() {
        const ns = JSON.parse(localStorage.getItem('navios_'+logado))||[];
        $('listaNavios').innerHTML = ns.map(n => `<option value="${n}">`).join('');
    }

    function exportarBackupJSON() {
        const b = new Blob([JSON.stringify({hist: todosDados, navios: JSON.parse(localStorage.getItem('navios_'+logado))})], {type:'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `backup_evolution.json`; a.click();
    }
    
    function exportarCSV() {
        let csv = 'Data,Navio,Liquido,Status\n';
        todosDados.forEach(i => csv += `${i.data},${i.navio},${i.liquido.toFixed(2)},${i.pago?'Pago':'Pendente'}\n`);
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'})); a.download = `evolution.csv`; a.click();
    }
</script>
</body>
</html>
