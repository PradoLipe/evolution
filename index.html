<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVOLUTION - V47 PREMIUM</title>
    <style>
        :root { 
            --primary: #00d1b2; --accent: #ffd700; --danger: #ff3860; --success: #48c774;
            --info: #209cee; --bg: #0a0a0e; --card: #16161d; --input: #202026;
            --text: #ffffff; --text-dim: #8e8e93; --border: rgba(255,255,255,0.08);
        }
        [data-theme="light"] {
            --bg: #f4f4f9; --card: #ffffff; --input: #ececef; --text: #1c1c1e; --text-dim: #6e6e73; --border: rgba(0,0,0,0.1);
        }
        * { -webkit-user-select: none; user-select: none; box-sizing: border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
        input, select, textarea { user-select: text; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; transition: 0.3s; }
        .container { max-width: 480px; width: 100%; padding: 20px; position: relative; display: flex; flex-direction: column; }
        
        /* DASHBOARD & CARDS */
        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .dash-item { background: var(--card); padding: 18px; border-radius: 20px; border: 1px solid var(--border); }
        .section-card { background: var(--card); padding: 22px; border-radius: 24px; margin-bottom: 15px; border: 1px solid var(--border); }
        h3 { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; display: flex; justify-content: space-between; }

        /* INPUTS */
        input, select { width: 100%; padding: 16px; background: var(--input); border: 1px solid var(--border); border-radius: 15px; color: var(--text); font-size: 1rem; margin-top: 10px; }
        .btn-main { background: var(--primary); color: #000; width: 100%; margin-top: 15px; border-radius: 15px; font-weight: 800; padding: 16px; border:none; cursor:pointer; text-transform: uppercase; }
        
        /* MODAIS */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: var(--card); border: 1px solid var(--border); padding: 30px; border-radius: 30px; text-align: center; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }

        .toast { position: fixed; bottom: 30px; background: var(--primary); color: #000; padding: 12px 25px; border-radius: 50px; font-weight: 800; z-index: 2000; display: none; }
        .hidden { display: none !important; }
        .hist-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border); }
    </style>
</head>
<body data-theme="dark">

<div class="toast" id="toast"></div>

<div class="modal" id="modalConfig">
    <div class="modal-content">
        <h3 style="color:var(--primary); margin-bottom:20px;">Configurações</h3>
        
        <button class="btn-main" onclick="mostrarPix()" style="background:var(--accent); margin-top:0;">☕ Apoiar o Desenvolvedor</button>
        <button class="btn-main" onclick="toggleTheme()" style="background:var(--info); color:white;">🌓 Alternar Tema (Claro/Escuro)</button>
        
        <div style="margin-top:25px; border-top:1px solid var(--border); padding-top:20px;">
            <p style="font-size:0.7rem; color:var(--text-dim); margin-bottom:10px;">DADOS E BACKUP</p>
            <button class="btn-main" onclick="exportarExcel()" style="background:var(--success); color:white; margin-top:5px;">📊 Baixar Planilha Excel (.csv)</button>
            <button class="btn-main" onclick="exportarJSON()" style="background:var(--input); color:var(--text); border:1px solid var(--border);">📤 Exportar Código de Backup</button>
            <button class="btn-main" onclick="importarJSON()" style="background:var(--input); color:var(--text); border:1px solid var(--border);">📥 Importar Código de Backup</button>
        </div>

        <button onclick="fecharModal('modalConfig')" style="background:none; border:none; color:var(--danger); margin-top:25px; font-weight:bold;">FECHAR</button>
    </div>
</div>

<div class="modal" id="modalPix">
    <div class="modal-content" onclick="copiarChavePix()">
        <div style="font-size: 3rem;">☕</div>
        <h3 id="msgComedia" style="margin:15px 0; font-size:1rem;"></h3>
        <div style="background:#000; padding:20px; border-radius:18px; border:1px dashed var(--accent);">
            <span style="font-size: 1.2rem; font-weight: 900; color: var(--accent);">92994821868</span>
            <span style="display:block; font-size:0.7rem; color:var(--text-dim); margin-top:5px;">Felipe Prado • Clique para copiar</span>
        </div>
        <button onclick="event.stopPropagation(); fecharModal('modalPix')" style="background:none; border:none; color:var(--text-dim); margin-top:15px;">Agora não</button>
    </div>
</div>

<div class="container" id="login-screen">
    <div style="text-align:center; margin-top: 15vh;">
        <h1 style="font-size:2.5rem; letter-spacing:8px; color:var(--primary);">EVOLUTION</h1>
        <input type="tel" id="senhaInput" placeholder="CHAVE DE ACESSO" style="text-align:center; -webkit-text-security:disc;">
        <button class="btn-main" onclick="login()">ACESSAR</button>
    </div>
</div>

<div class="container hidden" id="main-panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 25px;">
        <h2 id="userName" style="font-size:1.2rem;">...</h2>
        <div style="background:var(--card); padding:10px; border-radius:12px; border:1px solid var(--border); cursor:pointer;" onclick="abrirModal('modalConfig')">⚙️</div>
    </div>

    <div class="dash-grid">
        <div class="dash-item"><span style="font-size:9px; color:var(--text-dim);">BRUTO</span><div id="dashTotalBruto" style="font-weight:800; color:var(--info);">R$ 0,00</div></div>
        <div class="dash-item"><span style="font-size:9px; color:var(--text-dim);">LÍQUIDO</span><div id="dashTotalLiquido" style="font-weight:800; color:var(--accent);">R$ 0,00</div></div>
    </div>

    <div class="section-card">
        <h3>💰 Lançar Produção</h3>
        <input type="date" id="dataCalc">
        <input type="text" id="navioCalc" placeholder="Navio">
        <select id="turnoCalc" onchange="ajustarCalc()"><option value="07x15">07x15</option><option value="15x23" selected>15x23</option><option value="23x07">23x07</option></select>
        <div id="camposCalc"></div>
        <button class="btn-main" onclick="calcularESalvar()">SALVAR SERVIÇO</button>
    </div>

    <div class="section-card">
        <h3>📅 Histórico</h3>
        <div id="listaHist"></div>
    </div>
</div>

<script>
    const USERS = {"002451": "FELIPE PRADO", "7806": "EdilsonRj", "1980": "ANDERSON PRADO", "2026": "FABRICIO DIAS", "302466": "RODRIGO COSTA", "3373": "RICARDO PRADO", "2912": "JOHNY"};
    const frasesPix = ["O dev precisa pagar a internet! 🌐", "A Enel não perdoa, ajuda o dev! ⚡", "Um café = Uma nova função! ☕"];
    let logado = "", todosDados = [];
    const $ = id => document.getElementById(id);

    function fMoeda(v) { return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
    function toast(m){ const t=$('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',3000); }
    function abrirModal(id) { $(id).style.display = 'flex'; }
    function fecharModal(id) { $(id).style.display = 'none'; }

    function login() {
        const key = $('senhaInput').value;
        if(USERS[key]) {
            logado = USERS[key];
            $('userName').textContent = logado;
            $('login-screen').classList.add('hidden');
            $('main-panel').classList.remove('hidden');
            carregarSistema();
        } else alert("Erro!");
    }

    function carregarSistema() {
        todosDados = JSON.parse(localStorage.getItem('hist_' + logado)) || [];
        renderizarHist(); atualizarDash(); ajustarCalc();
        $('dataCalc').value = new Date().toISOString().split('T')[0];
    }

    // --- CONFIGURAÇÕES ---
    function toggleTheme() {
        const b = document.body;
        const novo = b.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        b.setAttribute('data-theme', novo);
        toast("Tema alterado!");
    }

    function exportarExcel() {
        if(todosDados.length === 0) return toast("Histórico vazio!");
        let csv = "Data,Navio,Bruto,Liquido,Status\n";
        todosDados.forEach(i => {
            csv += `${i.data},${i.navio},${i.bruto.toFixed(2)},${i.liquido.toFixed(2)},${i.pago?'Pago':'Pendente'}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.setAttribute('href', url);
        a.setAttribute('download', `Producao_${logado}.csv`);
        a.click();
        toast("Planilha gerada!");
    }

    function exportarJSON() {
        const data = localStorage.getItem('hist_' + logado);
        navigator.clipboard.writeText(data);
        alert("Código de Backup copiado! Guarde em local seguro.");
    }

    function importarJSON() {
        const codigo = prompt("Cole o código de backup aqui:");
        if(codigo) {
            try {
                JSON.parse(codigo);
                localStorage.setItem('hist_' + logado, codigo);
                carregarSistema();
                toast("Dados importados!");
            } catch(e) { alert("Código inválido!"); }
        }
    }

    function mostrarPix() { 
        $('msgComedia').textContent = frasesPix[Math.floor(Math.random()*frasesPix.length)];
        abrirModal('modalPix'); 
    }
    function copiarChavePix() { navigator.clipboard.writeText('92994821868'); toast("Chave Copiada! ☕"); fecharModal('modalPix'); }

    // --- LÓGICA DE CÁLCULO (RESUMIDA) ---
    function ajustarCalc() {
        const t = $('turnoCalc').value;
        $('camposCalc').innerHTML = t === "15x23" ? '<input type="number" id="t1" placeholder="15h-19h"><input type="number" id="t2" placeholder="20h-23h">' : '<input type="number" id="tGeral" placeholder="Produção Total">';
    }
    function calcularESalvar() {
        const tur = $('turnoCalc').value;
        let b = 0;
        if(tur === "15x23") { b = ((parseInt($('t1').value)||0)*5.73) + ((parseInt($('t2').value)||0)*6.88); }
        else { b = (parseInt($('tGeral').value)||0) * 5.73; }
        todosDados.unshift({ id: Date.now(), data: $('dataCalc').value.split('-').reverse().join('/').substring(0,5), navio: ($('navioCalc').value||"S/N").toUpperCase(), bruto: b/3, liquido: (b/3)*0.82, pago: false });
        localStorage.setItem('hist_'+logado, JSON.stringify(todosDados));
        renderizarHist(); atualizarDash(); toast("Salvo!");
    }
    function renderizarHist() {
        const c = $('listaHist'); c.innerHTML = '';
        todosDados.forEach(i => {
            const d = document.createElement('div'); d.className='hist-item';
            d.innerHTML = `<div><b>${i.navio}</b><br><small>${i.data}</small></div><div style="text-align:right"><b>${fMoeda(i.liquido)}</b></div>`;
            c.appendChild(d);
        });
    }
    function atualizarDash() {
        const b = todosDados.reduce((a,x)=>a+x.bruto,0);
        const l = todosDados.reduce((a,x)=>a+x.liquido,0);
        $('dashTotalBruto').textContent = fMoeda(b);
        $('dashTotalLiquido').textContent = fMoeda(l);
    }
</script>
</body>
</html>
