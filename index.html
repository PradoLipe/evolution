<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVOLUTION - PREMIUM V28 RESTORED</title>
    <style>
        :root { 
            --primary: #00d1b2; --accent: #ffd700; --danger: #ff3860; 
            --bg: #0a0a0f; --card: #16161d; --input: #1c1c24; --text: #ffffff;
        }
        * { box-sizing: border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; padding: 15px; }
        .container { max-width: 450px; width: 100%; }

        /* O LAYOUT QUE VOCÊ ELOGIOU (BORDAS ESPELHADAS) */
        .premium-card { 
            background: var(--card); 
            border-radius: 22px; 
            padding: 22px; 
            margin-bottom: 18px; 
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        
        .glow-cyan { border: 1.5px solid var(--primary); box-shadow: 0 0 20px rgba(0, 209, 178, 0.15); }
        .glow-gold { border: 1.5px solid var(--accent); box-shadow: 0 0 20px rgba(255, 215, 0, 0.15); }

        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .dash-label { font-size: 10px; color: #8e8e93; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }
        .dash-val { font-size: 1.3rem; font-weight: 900; margin-top: 5px; }

        input, select { 
            width: 100%; padding: 16px; background: var(--input); 
            border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; 
            color: var(--text); font-size: 1rem; margin-top: 10px;
        }
        
        .btn-premium { 
            background: var(--primary); color: #000; width: 100%; 
            margin-top: 20px; border-radius: 15px; font-weight: 900; 
            padding: 18px; border:none; text-transform: uppercase; cursor: pointer;
        }

        .hist-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .h-main { font-size: 1.05rem; font-weight: 800; text-transform: uppercase; }
        .h-sub { font-size: 0.8rem; color: #8e8e93; margin-top: 5px; }
        .h-val-primary { color: var(--accent); font-weight: 900; font-size: 1.2rem; text-align: right; }
        .h-val-sub { font-size: 0.75rem; color: #555; text-align: right; }
        
        .badge-status { font-size: 9px; padding: 3px 8px; border-radius: 6px; font-weight: 900; border: 1px solid var(--danger); color: var(--danger); }
        .del-icon { color: var(--danger); font-size: 1.6rem; margin-left: 15px; cursor: pointer; opacity: 0.5; }

        .footer-rights { text-align: center; font-size: 10px; color: #444; padding: 40px 0; letter-spacing: 3px; }
        .hidden { display: none !important; }
        
        /* MODAL CONFIG */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: var(--card); padding: 30px; border-radius: 30px; width: 100%; max-width: 400px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

<div class="modal" id="modalConf">
    <div class="modal-content">
        <h3 style="color:var(--primary); margin-bottom: 20px;">CONFIGURAÇÕES</h3>
        <button class="btn-premium" onclick="exportarExcel()" style="background:#48c774; color:#fff;">📊 BAIXAR EXCEL</button>
        <button class="btn-premium" onclick="copiarBackup()">📤 COPIAR BACKUP</button>
        <button class="btn-premium" onclick="importarBackup()">📥 RESTAURAR BACKUP</button>
        <button onclick="fecharModal()" style="background:none; border:none; color:var(--danger); margin-top:20px; font-weight:bold; cursor:pointer;">FECHAR</button>
    </div>
</div>

<div class="container" id="login-screen">
    <div style="text-align: center; margin-top: 15vh;">
        <h1 style="font-size: 2.5rem; letter-spacing: 10px; color: var(--primary); font-weight: 900;">EVOLUTION</h1>
        <input type="password" id="acesso" placeholder="••••••" style="text-align: center; font-size: 1.5rem;">
        <button class="btn-premium" onclick="fazerLogin()">ENTRAR</button>
    </div>
    <div class="footer-rights">© 2026 ALL RIGHTS RESERVED TO <br><b>FELIPE PRADO</b></div>
</div>

<div class="container hidden" id="app-panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 30px;">
        <h2 id="displayNome" style="font-weight:900; font-size: 1.5rem;"></h2>
        <div style="cursor:pointer; font-size: 1.5rem;" onclick="abrirModal()">⚙️</div>
    </div>

    <div class="dash-grid">
        <div class="premium-card glow-cyan" style="margin:0; padding:18px;">
            <span class="dash-label">Bruto Total</span>
            <div id="resBruto" class="dash-val" style="color:var(--primary)">R$ 0,00</div>
        </div>
        <div class="premium-card glow-gold" style="margin:0; padding:18px;">
            <span class="dash-label">Líquido</span>
            <div id="resLiq" class="dash-val" style="color:var(--accent)">R$ 0,00</div>
        </div>
    </div>

    <div class="premium-card">
        <h3 class="dash-label">💰 Lançar Produção</h3>
        <input type="date" id="inData">
        <input type="text" id="inNavio" placeholder="Nome do Navio">
        <input type="number" id="inProd" placeholder="Quantidade">
        <button class="btn-premium" onclick="adicionarServico()">SALVAR NO HISTÓRICO</button>
    </div>

    <div class="premium-card">
        <h3 class="dash-label">🗓️ Histórico</h3>
        <div id="render-lista"></div>
    </div>

    <div class="footer-rights">EVOLUTION PREMIUM • FELIPE PRADO</div>
</div>

<script>
    const ACESSOS = {"002451": "FELIPE PRADO", "7806": "EdilsonRj", "1980": "ANDERSON PRADO"};
    let logado = "", bancoDados = [];

    function fazerLogin() {
        const p = document.getElementById('acesso').value;
        if(ACESSOS[p]) {
            logado = ACESSOS[p];
            document.getElementById('displayNome').innerText = logado;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-panel').classList.remove('hidden');
            document.getElementById('inData').value = new Date().toISOString().split('T')[0];
            
            // CHAVE DE DADOS QUE VOCÊ USAVA NAS 23H
            bancoDados = JSON.parse(localStorage.getItem('hist_' + logado)) || [];
            atualizarTudo();
        } else alert("Senha incorreta!");
    }

    function adicionarServico() {
        const navio = document.getElementById('inNavio').value.toUpperCase() || "S/N";
        const prod = parseFloat(document.getElementById('inProd').value) || 0;
        const data = document.getElementById('inData').value.split('-').reverse().join('/').substring(0,5);
        const bruto = (prod * 5.73) / 3;
        const liq = bruto * 0.82;

        bancoDados.unshift({ id: Date.now(), navio: navio, data: data, bruto: bruto, liq: liq });
        localStorage.setItem('hist_' + logado, JSON.stringify(bancoDados));
        atualizarTudo();
    }

    function atualizarTudo() {
        const lista = document.getElementById('render-lista');
        lista.innerHTML = '';
        let totalB = 0, totalL = 0;

        bancoDados.forEach(item => {
            totalB += item.bruto; totalL += item.liq;
            lista.innerHTML += `
                <div class="hist-item">
                    <div>
                        <div class="h-main">${item.navio}</div>
                        <div class="h-sub">${item.data} • <span class="badge-status">PENDENTE</span></div>
                    </div>
                    <div style="display:flex; align-items:center;">
                        <div>
                            <div class="h-val-primary">R$ ${item.liq.toLocaleString('pt-BR',{minimumFractionDigits:2})}</div>
                            <div class="h-val-sub">BRUTO R$ ${item.bruto.toLocaleString('pt-BR',{minimumFractionDigits:2})}</div>
                        </div>
                        <div class="del-icon" onclick="deletar(${item.id})">×</div>
                    </div>
                </div>`;
        });
        document.getElementById('resBruto').innerText = "R$ " + totalB.toLocaleString('pt-BR',{minimumFractionDigits:2});
        document.getElementById('resLiq').innerText = "R$ " + totalL.toLocaleString('pt-BR',{minimumFractionDigits:2});
    }

    function deletar(id) {
        if(confirm("Excluir registro?")) {
            bancoDados = bancoDados.filter(x => x.id !== id);
            localStorage.setItem('hist_' + logado, JSON.stringify(bancoDados));
            atualizarTudo();
        }
    }

    // FUNÇÕES DA CATRACA
    function abrirModal() { document.getElementById('modalConf').style.display = 'flex'; }
    function fecharModal() { document.getElementById('modalConf').style.display = 'none'; }
    function copiarBackup() { navigator.clipboard.writeText(JSON.stringify(bancoDados)); alert("Backup copiado!"); }
    function importarBackup() { 
        const b = prompt("Cole o código de backup:"); 
        if(b) { bancoDados = JSON.parse(b); localStorage.setItem('hist_'+logado, b); atualizarTudo(); fecharModal(); } 
    }
    function exportarExcel() {
        let csv = "Data;Navio;Bruto;Liquido\n";
        bancoDados.forEach(i => { csv += `${i.data};${i.navio};${i.bruto.toFixed(2)};${i.liq.toFixed(2)}\n`; });
        const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Evolution_${logado}.csv`;
        link.click();
    }
</script>
</body>
</html>
