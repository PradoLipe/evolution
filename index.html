<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SISTEMA EVOLUTION - V20.0</title>
    <style>
        :root { --primary: #00d1b2; --accent: #ffdd57; --danger: #ff3860; --bg: #0d0d0d; --card-bg: #1a1a1a; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; padding: 10px; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 450px; width: 100%; background: var(--card-bg); padding: 25px; border-radius: 20px; border: 1px solid #333; box-sizing: border-box; margin-top: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: var(--primary); text-transform: uppercase; font-size: 18px; letter-spacing: 1px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: var(--primary); font-size: 10px; text-transform: uppercase; }
        input, select { width: 100%; padding: 14px; margin-top: 6px; border: 1px solid #333; background: #222; color: white; border-radius: 10px; box-sizing: border-box; font-size: 16px; outline: none; }
        button { width: 100%; padding: 16px; margin-top: 12px; border: none; border-radius: 10px; font-size: 13px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.3s; }
        .btn-gerar { background: #48c774; color: #000; }
        .btn-calc { background: var(--accent); color: #000; margin-top: 20px; }
        .res-area { display:none; margin-top:15px; padding:12px; background:#000; color:#00ffca; border:1px solid var(--primary); font-family:monospace; font-size:11px; white-space: pre-wrap; border-radius:8px; }
        .history { margin-top: 30px; border-top: 2px solid #333; padding-top: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        td { padding: 10px 5px; border-bottom: 1px solid #333; }
        .footer { margin-top: 25px; font-size: 9px; color: #666; text-align: center; display: block; }
    </style>
</head>
<body>

<div class="container" id="login-screen">
    <h2>SISTEMA EVOLUTION</h2>
    <p style="text-align:center; font-size:10px; color:var(--primary);">ACESSO RESTRITO</p>
    <label>CHAVE DE ACESSO:</label>
    <input type="tel" id="senhaInput" placeholder="Sua Chave" style="-webkit-text-security: disc;">
    <button style="background:var(--primary); color:#000;" onclick="login()">ENTRAR</button>
</div>

<div class="container" id="main-panel" style="display: none;">
    <h2 id="saudacao">PAINEL</h2>
    
    <label>NAVIO:</label>
    <input type="text" id="navioPrincipal" placeholder="NOME DO NAVIO">
    
    <label>DATA DO TURNO:</label>
    <input type="date" id="dataTurno">
    
    <button class="btn-gerar" onclick="gerarRel()">GERAR RELATÓRIO WHATSAPP</button>
    <div id="relArea" class="res-area"></div>
    <button id="btnCopiar" onclick="copiar()" style="display:none; background:#3273dc; color:#fff;">COPIAR MENSAGEM</button>

    <div style="border-top: 1px solid #333; margin-top: 25px;">
        <h2 style="font-size: 14px; margin-top: 20px; color: var(--accent);">📊 CALCULADORA DE TAXAS</h2>
        
        <label>PRODUÇÃO TOTAL:</label>
        <input type="number" id="prodCalc" placeholder="Quantidade">
        
        <label>TIPO DE DIA:</label>
        <select id="tipoDia"><option value="n">NORMAL</option><option value="f">DOMINGO/FERIADO</option></select>
        
        <label>TURNO:</label>
        <select id="turnoCalc">
            <option value="07x15">07x15</option>
            <option value="15x23" selected>15x23</option>
            <option value="23x07">23x07</option>
        </select>
        
        <button class="btn-calc" onclick="calcular()">CALCULAR E SALVAR NO HISTÓRICO</button>
        
        <div id="resCalc" style="display:none; text-align:center; margin-top:15px; background: #000; padding: 15px; border-radius: 10px; border: 1px solid var(--accent);">
            <div id="resLiquido" style="font-size:20px; color:var(--accent); font-weight:bold;"></div>
            <div style="font-size: 10px; color: #888; margin-top: 5px;">(Já calculado com 18% de desconto e divisão por 3)</div>
        </div>
    </div>

    <div class="history">
        <h3 style="font-size:12px; color:var(--primary); text-align:center;">ÚLTIMOS REGISTROS</h3>
        <table id="tabelaHist"><tbody></tbody></table>
        <button style="background:transparent; color:var(--danger); font-size:8px; border:none; margin-top:10px; width:100%;" onclick="limparHist()">LIMPAR HISTÓRICO LOCAL</button>
    </div>

    <span class="footer">© 2026 SISTEMA EVOLUTION - FELIPE PRADO</span>
</div>
