<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SISTEMA EVOLUTION - FINAL</title>
    <style>
        :root { --primary: #00d1b2; --accent: #ffdd57; --bg: #0d0d0d; --card-bg: #1a1a1a; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; padding: 10px; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 450px; width: 100%; background: var(--card-bg); padding: 25px; border-radius: 20px; border: 1px solid #333; box-sizing: border-box; margin-top: 10px; }
        h2 { text-align: center; color: var(--primary); text-transform: uppercase; font-size: 18px; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: var(--primary); font-size: 10px; text-transform: uppercase; }
        input, select { width: 100%; padding: 14px; margin-top: 6px; border: 1px solid #333; background: #222; color: white; border-radius: 10px; box-sizing: border-box; font-size: 16px; outline: none; }
        button { width: 100%; padding: 16px; margin-top: 12px; border: none; border-radius: 10px; font-size: 13px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        .btn-gerar { background: #48c774; color: #000; }
        .btn-calc { background: var(--accent); color: #000; }
        .res-area { display:none; margin-top:15px; padding:12px; background:#000; color:#00ffca; border:1px solid var(--primary); font-family:monospace; font-size:11px; white-space: pre-wrap; border-radius:8px; }
        #resCalc { display:none; text-align:center; margin-top:15px; background:#000; padding:15px; border:1px solid var(--accent); border-radius:10px; }
    </style>
</head>
<body>

<div class="container" id="login-screen">
    <h2>SISTEMA EVOLUTION</h2>
    <label>CHAVE DE ACESSO:</label>
    <input type="tel" id="senhaInput" placeholder="Sua Senha" style="-webkit-text-security: disc;">
    <button style="background:var(--primary); color:#000;" onclick="login()">ENTRAR</button>
</div>

<div class="container" id="main-panel" style="display: none;">
    <h2 id="saudacao">PAINEL</h2>
    
    <label>NAVIO:</label>
    <input type="text" id="navioPrincipal" placeholder="NOME DO NAVIO">
    
    <label>TURNO:</label>
    <select id="turnoSel">
        <option value="07x15">07x15</option>
        <option value="15x23" selected>15x23</option>
        <option value="23x07">23x07</option>
    </select>

    <label>PRODUÇÃO TOTAL:</label>
    <input type="number" id="prodInput" placeholder="Quantidade">

    <label>DIVISÃO (TERNO):</label>
    <select id="ternoSel">
        <option value="1">SOLO (1)</option>
        <option value="2">DUPLA (2)</option>
        <option value="3" selected>TRIO (3)</option>
    </select>

    <label>DIA:</label>
    <select id="tipoDia">
        <option value="n">NORMAL</option>
        <option value="f">DOMINGO/FERIADO</option>
    </select>
    
    <button class="btn-gerar" onclick="gerarRel()">GERAR RELATÓRIO</button>
    <div id="relArea" class="res-area"></div>
    <button id="btnCopiar" onclick="copiar()" style="display:none; background:#3273dc; color:#fff;">COPIAR MENSAGEM</button>

    <button class="btn-calc" style="margin-top: 25px;" onclick="calcular()">CALCULAR GANHO LÍQUIDO</button>
    <div id="resCalc">
        <div id="resLiquido" style="font-size:20px; color:var(--accent); font-weight:bold;"></div>
    </div>
</div>

<script>
    const USERS = { "002451": "FELIPE PRADO", "1980": "ANDERSON PRADO", "2026": "FABRICIO DIAS" };
    
    function login() {
        const s = document.getElementById('senhaInput').value;
        if (USERS[s]) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-panel').style.display = 'block';
            document.getElementById('saudacao').innerText = "OLÁ, " + USERS[s];
        } else { alert("Senha incorreta!"); }
    }

    function gerarRel() {
        const n = document.getElementById('navioPrincipal').value.toUpperCase();
        const p = document.getElementById('prodInput').value;
        const t = document.getElementById('turnoSel').value;
        const d = new Date().toLocaleDateString('pt-BR');
        
        const msg = `SISTEMA EVOLUTION\nNAVIO: ${n}\nDATA: ${d}\nTURNO: ${t}\nPRODUÇÃO: ${p}\n----------------`;
        document.getElementById('relArea').innerText = msg;
        document.getElementById('relArea').style.display = 'block';
        document.getElementById('btnCopiar').style.display = 'block';
    }

    function calcular() {
        const prod = parseFloat(document.getElementById('prodInput').value) || 0;
        const tipo = document.getElementById('tipoDia').value;
        const turno = document.getElementById('turnoSel').value;
        const terno = parseInt(document.getElementById('ternoSel').value);
        
        let taxa = (turno === "07x15") ? (tipo === 'f' ? 8.61 : 5.73) : 6.88;
        let liquido = ((prod * taxa) / terno) * 0.82;

        document.getElementById('resLiquido').innerText = `LÍQUIDO: R$ ${liquido.toFixed(2)}`;
        document.getElementById('resCalc').style.display = 'block';
    }

    function copiar() {
        navigator.clipboard.writeText(document.getElementById('relArea').innerText);
        alert("Copiado!");
    }
</script>
</body>
</html>
