<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SISTEMA EVOLUTION - V18.2</title>
    <style>
        :root { --primary: #00d1b2; --accent: #ffdd57; --danger: #ff3860; --bg: #0d0d0d; --card-bg: #1a1a1a; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; padding: 10px; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 450px; width: 100%; background: var(--card-bg); padding: 25px; border-radius: 20px; border: 1px solid #333; box-sizing: border-box; margin-top: 10px; }
        h2 { text-align: center; color: var(--primary); text-transform: uppercase; font-size: 18px; letter-spacing: 1px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: var(--primary); font-size: 10px; text-transform: uppercase; }
        input, select { width: 100%; padding: 14px; margin-top: 6px; border: 1px solid #333; background: #222; color: white; border-radius: 10px; box-sizing: border-box; font-size: 16px; outline: none; }
        button { width: 100%; padding: 16px; margin-top: 12px; border: none; border-radius: 10px; font-size: 13px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        .btn-gerar { background: #48c774; color: #000; }
        .btn-dev { background: #3273dc; color: #fff; margin-top: 20px; border: 1px dashed #fff; font-size: 10px; }
        .dev-panel { display: none; background: #222; padding: 15px; border-radius: 15px; margin-top: 10px; border: 1px solid var(--primary); }
        .res-area { display:none; margin-top:15px; padding:12px; background:#000; color:#00ffca; border:1px solid var(--primary); font-family:monospace; font-size:11px; white-space: pre-wrap; border-radius:8px; }
        .copyright { margin-top: 25px; font-size: 9px; color: #666; text-align: center; display: block; }
    </style>
</head>
<body>

<div class="container" id="login-screen">
    <h2>SISTEMA EVOLUTION</h2>
    <p style="text-align:center; font-size:10px; color:var(--primary);">ACESSO RESTRITO V18.2</p>
    <label>DIGITE SUA CHAVE:</label>
    <input type="tel" id="senhaInput" placeholder="Sua Chave" style="-webkit-text-security: disc;">
    <button style="background:var(--primary); color:#000;" onclick="login()">ENTRAR NO SISTEMA</button>
</div>

<div class="container" id="main-panel" style="display: none;">
    <h2 id="saudacao">PAINEL</h2>
    
    <div id="areaDev" style="display:none;">
        <button class="btn-dev" onclick="toggleDev()">🛠️ GERENCIAR ACESSOS (MODO DEV)</button>
        <div id="devPanel" class="dev-panel">
            <label>ADICIONAR NOVO:</label>
            <input type="text" id="newUserName" placeholder="Nome">
            <input type="text" id="newUserPass" placeholder="Senha">
            <button class="btn-gerar" onclick="addUser()">ADICIONAR USUÁRIO</button>
            <p style="font-size:8px; color:#888; margin-top:5px;">*Usuários adicionados aqui valem apenas para esta sessão.</p>
        </div>
    </div>

    <label>NOME DO NAVIO:</label>
    <input type="text" id="navioPrincipal" placeholder="Ex: CAP SAN ARTEMISIO">
    
    <label>TURNO:</label>
    <select id="turnoRel">
        <option value="07x15">07x15</option>
        <option value="15x23" selected>15x23</option>
        <option value="23x07">23x07</option>
    </select>
    
    <button class="btn-gerar" onclick="gerarRel()">GERAR RELATÓRIO COM RASTREIO</button>
    
    <div id="relArea" class="res-area"></div>
    <button id="btnCopiar" onclick="copiar()" style="display:none; background:#3273dc; color:#fff;">COPIAR PARA WHATSAPP</button>

    <span class="copyright">© 2026 SISTEMA EVOLUTION - FELIPE PRADO</span>
</div>

<script>
    // --- LISTA DE USUÁRIOS E SENHAS ---
    let USERS = {
        "002451": "FELIPE PRADO",
        "1980": "ANDERSON PRADO",
        "2026": "FABRICIO DIAS",
        "302466": "RODRIGO COSTA"
    };

    let logado = "";

    function login() {
        const input = document.getElementById('senhaInput');
        const s = input.value.trim();
        
        if (USERS[s]) {
            logado = USERS[s];
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-panel').style.display = 'block';
            document.getElementById('saudacao').innerText = "OLÁ, " + logado;
            
            // Ativa o Painel DEV apenas para você
            if(s === "002451") {
                document.getElementById('areaDev').style.display = 'block';
            }
        } else { 
            alert("Acesso Negado! Chave inválida."); 
            input.value = "";
        }
    }

    function toggleDev() {
        const p = document.getElementById('devPanel');
        p.style.display = p.style.display === 'block' ? 'none' : 'block';
    }

    function addUser() {
        const n = document.getElementById('newUserName').value.toUpperCase();
        const s = document.getElementById('newUserPass').value;
        if(n && s) {
            USERS[s] = n;
            alert("Usuário " + n + " adicionado com sucesso!");
            document.getElementById('newUserName').value = "";
            document.getElementById('newUserPass').value = "";
        }
    }

    function gerarRel() {
        const n = (document.getElementById('navioPrincipal').value || "NAVIO NÃO INFORMADO").toUpperCase();
        const t = document.getElementById('turnoRel').value;
        const d = new Date().toLocaleDateString('pt-BR');
        
        // --- SISTEMA DE RASTREAMENTO (TRACKING) ---
        const ua = navigator.userAgent;
        const device = ua.includes("Android") ? "Android" : (ua.includes("iPhone") ? "iPhone" : "Computador");
        const trackCode = btoa(logado).substring(0,5); // Código único baseado no nome
        const time = new Date().toLocaleTimeString();
        const tracking = `ID_TRACK: ${device} | ${trackCode} | ${time}`;

        const msg = `SISTEMA EVOLUTION\nNAVIO: ${n}\nDATA: ${d}\nTURNO: ${t}\nCONF: ${logado}\n----------------\n${tracking}`;
        
        document.getElementById('relArea').innerText = msg;
        document.getElementById('relArea').style.display = 'block';
        document.getElementById('btnCopiar').style.display = 'block';
    }

    function copiar() { 
        const texto = document.getElementById('relArea').innerText;
        navigator.clipboard.writeText(texto).then(() => {
            alert("Relatório copiado!");
        });
    }
</script>
</body>
</html>
