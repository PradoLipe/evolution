<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVOLUTION - V38</title>
    <style>
        :root { 
            --primary: #00d1b2; 
            --accent: #ffd700; 
            --danger: #ff3860;
            --success: #48c774;
            --info: #209cee;
            --bg: #0f0f13; 
            --card: #1a1a20;
            --input: #25252a;
            --text: #ffffff;
            --text-dim: #a0a0a5;
            --border: rgba(255,255,255,0.05);
        }

        [data-theme="light"] {
            --bg: #f4f4f9;
            --card: #ffffff;
            --input: #ececef;
            --text: #1c1c1e;
            --text-dim: #6e6e73;
            --border: rgba(0,0,0,0.05);
        }
        
        * { -webkit-user-select: none; user-select: none; box-sizing: border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
        input, select, textarea { user-select: text; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            padding: 15px; 
            min-height: 100vh;
            display: flex; 
            justify-content: center; 
            transition: background 0.3s;
        }
        
        .container { max-width: 480px; width: 100%; position: relative; padding-bottom: 50px; }
        
        /* HEADER COM CATRACA */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 5px 0;
        }

        .config-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        h2 { font-size: 1.1rem; letter-spacing: 2px; color: var(--primary); font-weight: 800; }

        /* CARDS E SEÇÕES */
        .section-card { 
            background: var(--card); 
            padding: 20px; 
            border-radius: 20px; 
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h3 { font-size: 0.85rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

        /* LISTA DE HISTÓRICO REFORMULADA */
        .hist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--border);
        }
        .hist-item:last-child { border-bottom: none; }

        .hist-info { flex: 1; }
        .hist-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; display: block; }
        .hist-meta { font-size: 0.75rem; color: var(--text-dim); }

        .hist-values { text-align: right; margin-right: 15px; }
        .val-liq { color: var(--accent); font-weight: 800; font-size: 1rem; display: block; }
        .val-bruto { color: var(--text-dim); font-size: 0.7rem; text-decoration: line-through; opacity: 0.6; }

        /* BOTÕES */
        button { border-radius: 14px; font-weight: 700; border: none; cursor: pointer; transition: 0.2s; padding: 16px; font-size: 0.85rem; }
        .btn-main { background: var(--primary); color: #000; width: 100%; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); width: 100%; }
        
        /* DASHBOARD CLEAN */
        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .dash-item { background: var(--card); padding: 15px; border-radius: 18px; border: 1px solid var(--border); }
        .dash-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 5px; }
        .dash-val { font-size: 1.1rem; font-weight: 800; }

        /* INPUTS MODERNOS */
        input, select { 
            width: 100%; padding: 15px; background: var(--input); border: 1px solid transparent; 
            border-radius: 14px; color: var(--text); font-size: 1rem; margin-top: 8px; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); outline: none; background: transparent; }

        /* BADGES */
        .badge { font-size: 0.7rem; padding: 4px 10px; border-radius: 8px; font-weight: 800; text-transform: uppercase; }
        .badge-pend { background: rgba(255,56,96,0.1); color: var(--danger); }
        .badge-ok { background: rgba(72,199,116,0.1); color: var(--success); }

        .hidden { display: none !important; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: var(--card); padding: 25px; border-radius: 24px; width: 100%; max-width: 400px; }

        /* CALENDÁRIO MINI */
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; border-radius: 10px; cursor: pointer; }
        .cal-day.active { background: var(--primary); color: #000; font-weight: 800; }
        .cal-day.has { border: 1px solid var(--primary); }

        .toast { position: fixed; bottom: 20px; background: #fff; color: #000; padding: 12px 25px; border-radius: 50px; font-weight: 700; z-index: 2000; transform: translateY(100px); transition: 0.4s; }
        .toast.show { transform: translateY(0); }
    </style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="modal" id="modalConfig">
    <div class="modal-content">
        <h3 style="color:var(--text); font-size: 1.2rem; margin-bottom: 20px;">Configurações</h3>
        
        <label>Tema</label>
        <select id="themeSelect" onchange="mudarTema(this.value)">
            <option value="dark">🌙 Modo Escuro</option>
            <option value="light">☀️ Modo Claro</option>
        </select>

        <div style="margin-top: 25px; display: grid; gap: 10px;">
            <button class="btn-outline" onclick="exportarBackupJSON()">📤 Exportar Backup</button>
            <button class="btn-outline" onclick="$('importFile').click()">📥 Importar Backup</button>
            <button class="btn-outline" onclick="exportarCSV()">📄 Planilha Excel</button>
            <button class="btn-main" onclick="mostrarPix()" style="background: var(--accent);">🚀 Apoiar o Dev</button>
            <button class="btn-outline" style="color: var(--danger); border-color: var(--danger); margin-top: 10px;" onclick="limparTodos()">🗑️ Resetar Sistema</button>
        </div>
        
        <input type="file" id="importFile" class="hidden" accept=".json" onchange="importarBackupJSON(event)">
        <button class="btn-main" style="margin-top: 20px;" onclick="fecharConfig()">Fechar</button>
    </div>
</div>

<div class="container" id="login-screen">
    <div style="text-align:center; margin-top: 40vh;">
        <h2 style="font-size: 2rem; margin-bottom: 30px;">EVOLUTION</h2>
        <input type="tel" id="senhaInput" placeholder="Chave de Acesso" style="text-align:center; -webkit-text-security: disc;" maxlength="6">
        <button class="btn-main" style="margin-top: 20px;" onclick="login()">ENTRAR</button>
    </div>
</div>

<div class="container hidden" id="main-panel">
    <div class="app-header">
        <div>
            <span id="saudacao" style="font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase;">BEM-VINDO</span>
            <h2 id="userName">CONFERENTE</h2>
        </div>
        <div class="config-btn" onclick="abrirConfig()">⚙️</div>
    </div>

    <div class="dash-grid">
        <div class="dash-item"><div class="dash-label">Total Líquido</div><div class="dash-val" id="dashTotalLiquido" style="color: var(--accent);">R$ 0</div></div>
        <div class="dash-item"><div class="dash-label">A Receber</div><div class="dash-val" id="dashPendenteLiquido" style="color: var(--danger);">R$ 0</div></div>
    </div>

    <div class="section-card">
        <h3 onclick="toggleSection('rel-box')" style="cursor:pointer">📄 Relatório de Produção</h3>
        <div id="rel-box" class="hidden">
            <input type="text" id="navioRel" placeholder="Nome do Navio" list="listaNavios">
            <datalist id="listaNavios"></datalist>
            <div style="display:flex; gap:10px;">
                <input type="number" id="ternoRelInput" placeholder="Terno">
                <select id="turnoRel" onchange="ajustarRel()">
                    <option value="">Turno</option>
                    <option value="07x15">07x15</option>
                    <option value="15x23">15x23</option>
                    <option value="23x07">23x07</option>
                </select>
            </div>
            <div id="camposRel"></div>
            <button class="btn-main" style="margin-top: 15px; background: #25d366; color: #fff;" onclick="gerarRel()">GERAR PARA WHATSAPP</button>
            <div id="relatorioArea" class="hidden" style="background:#000; color:var(--primary); padding:15px; border-radius:12px; margin-top:15px; font-family:monospace; font-size:12px; white-space:pre-wrap;"></div>
            <button id="btnCopiar" class="btn-main hidden" style="margin-top: 10px;" onclick="copiar()">COPIAR TEXTO</button>
        </div>
    </div>

    <div class="section-card">
        <h3>💰 Lançar Novo Serviço</h3>
        <input type="text" id="navioCalc" placeholder="Nome do Navio" list="listaNavios">
        <div style="display:flex; gap:10px;">
            <select id="tipoDia"><option value="n">Normal</option><option value="f">Feriado/Dom</option></select>
            <select id="turnoCalc" onchange="ajustarCalc()">
                <option value="07x15">07x15</option>
                <option value="15x23" selected>15x23</option>
                <option value="23x07">23x07</option>
            </select>
        </div>
        <div id="camposCalc"></div>
        <label style="margin-top:10px">Divisão entre quantos conferentes?</label>
        <select id="nConf"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option></select>
        <button class="btn-main" style="margin-top: 20px;" onclick="calcularESalvar()">SALVAR SERVIÇO</button>
    </div>

    <div class="section-card">
        <h3>📅 Histórico Recente</h3>
        <div id="listaHist">
            </div>
        <div style="margin-top: 20px; padding-top: 15px; border-top: 2px solid var(--border); text-align: center;">
            <span style="font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase;">Total do Histórico</span>
            <div style="font-size: 1.5rem; font-weight: 800; color: var(--accent);" id="totalLiquidoFiltrado">R$ 0,00</div>
        </div>
    </div>

</div>

<div class="modal" id="modalPix">
    <div class="modal-content" style="text-align:center;">
        <div style="font-size: 3rem; margin-bottom: 10px;">☕</div>
        <h4 style="font-weight: 800; margin-bottom: 10px;">Apoie o Projeto</h4>
        <p id="mensagemApoio" style="font-size: 0.85rem; color: var(--text-dim); margin-bottom: 20px;"></p>
        <div style="background: var(--input); padding: 15px; border-radius: 15px; margin-bottom: 20px;" onclick="copiarChavePix()">
            <span style="font-size: 0.6rem; color: var(--text-dim); display:block;">TOQUE PARA COPIAR A CHAVE</span>
            <span style="font-size: 1.2rem; font-weight: 800; color: var(--accent);">92994821868</span>
        </div>
        <button class="btn-main" onclick="fecharModalPix()">Depois eu ajudo</button>
    </div>
</div>

<script>
    const USERS = {"002451": "FELIPE PRADO", "7806": "EdilsonRj", "1980": "ANDERSON PRADO", "2026": "FABRICIO DIAS", "302466": "RODRIGO COSTA", "3373": "RICARDO PRADO", "2912": "JOHNY"};
    const frasesApoio = ["O café é o combustível do código. Ajuda aí? ☕", "Esse sistema te ajudou? Retribua com um Pix! 🚀", "Mantenha o sistema vivo e evoluindo! 💡"];
    
    let logado = "", todosDados = [];
    const $ = id => document.getElementById(id);

    function toast(msg) {
        const t = $('toast'); t.textContent = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    function login() {
        const key = $('senhaInput').value;
        if(USERS[key]) {
            logado = USERS[key];
            $('userName').textContent = logado;
            $('login-screen').classList.add('hidden');
            $('main-panel').classList.remove('hidden');
            carregarSistema();
        } else toast("Chave incorreta");
    }

    function carregarSistema() {
        todosDados = JSON.parse(localStorage.getItem('hist_' + logado)) || [];
        ajustarRel();
        ajustarCalc();
        renderizarHist();
        atualizarDash();
        carregarNavios();
        const tema = localStorage.getItem('theme_' + logado) || 'dark';
        document.documentElement.setAttribute('data-theme', tema);
    }

    function abrirConfig() { $('modalConfig').style.display = 'flex'; }
    function fecharConfig() { $('modalConfig').style.display = 'none'; }
    function mostrarPix() { 
        $('mensagemApoio').textContent = frasesApoio[Math.floor(Math.random()*frasesApoio.length)];
        $('modalPix').style.display = 'flex'; 
    }
    function fecharModalPix() { $('modalPix').style.display = 'none'; }
    function copiarChavePix() { navigator.clipboard.writeText('92994821868'); toast("Chave Pix Copiada!"); }

    function mudarTema(t) {
        document.documentElement.setAttribute('data-theme', t);
        localStorage.setItem('theme_' + logado, t);
    }

    function toggleSection(id) { $(id).classList.toggle('hidden'); }

    function ajustarRel() {
        const t = $('turnoRel').value;
        $('camposRel').innerHTML = t === "15x23" ? '<input type="number" id="p1" placeholder="Prod 15-19h"><input type="number" id="p2" placeholder="Prod 20-23h">' : (t ? '<input type="number" id="pGeral" placeholder="Produção Total">' : '');
    }

    function ajustarCalc() {
        const t = $('turnoCalc').value;
        $('camposCalc').innerHTML = t === "15x23" ? '<input type="number" id="t1" placeholder="Prod 15-19h"><input type="number" id="t2" placeholder="Prod 20-23h">' : '<input type="number" id="tGeral" placeholder="Produção Total">';
    }

    function gerarRel() {
        const tur = $('turnoRel').value;
        if(!tur) return toast("Selecione o turno");
        const navio = ($('navioRel').value || "NAVIO").toUpperCase();
        const terno = $('ternoRelInput').value ? $('ternoRelInput').value + "°" : "S/T";
        const data = new Date().toLocaleDateString('pt-BR');
        let prodStr = "", total = 0;

        if(tur === "15x23") {
            const v1 = parseInt($('p1').value)||0; const v2 = parseInt($('p2').value)||0;
            prodStr = `15x19: ${v1}\n20x23: ${v2}`; total = v1+v2;
        } else {
            total = parseInt($('pGeral').value)||0;
            prodStr = `PRODUÇÃO: ${total}`;
        }

        const texto = `* Relatório de Produção *\n\nNavio: ${navio}\nData: ${data}\nTerno: ${terno}\nTurno: ${tur}\n\n${prodStr}\nTotal: ${total}\n\nConferente: ${logado}`;
        $('relatorioArea').textContent = texto;
        $('relatorioArea').classList.remove('hidden');
        $('btnCopiar').classList.remove('hidden');
        salvarNavio(navio);
    }

    function copiar() { navigator.clipboard.writeText($('relatorioArea').textContent); toast("Copiado!"); }

    function calcularESalvar() {
        const navio = ($('navioCalc').value || "S/N").toUpperCase();
        const tur = $('turnoCalc').value;
        const tipo = $('tipoDia').value;
        const n = parseInt($('nConf').value);
        let bruto = 0;

        if(tur === "15x23") {
            const v1 = parseInt($('t1').value)||0; const v2 = parseInt($('t2').value)||0;
            bruto = (tipo === 'f') ? (v1 * 8.61) + (v2 * 10.32) : (v1 * 5.73) + (v2 * 6.88);
        } else {
            const prod = parseInt($('tGeral').value)||0;
            const taxa = (tur === "07x15") ? (tipo === 'f' ? 8.61 : 5.73) : 6.88;
            bruto = prod * taxa;
        }

        const individual = bruto / n;
        const liq = individual * 0.82;
        
        const registro = {
            id: Date.now(),
            data: new Date().toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'}),
            navio,
            bruto: individual,
            liquido: liq,
            pago: false
        };

        todosDados.unshift(registro);
        localStorage.setItem('hist_' + logado, JSON.stringify(todosDados));
        renderizarHist();
        atualizarDash();
        salvarNavio(navio);
        toast("Salvo com sucesso!");
    }

    function renderizarHist() {
        const container = $('listaHist');
        container.innerHTML = todosDados.length ? '' : '<p style="text-align:center; color:var(--text-dim); padding:20px;">Nenhum serviço salvo</p>';
        
        todosDados.slice(0, 10).forEach(item => {
            const div = document.createElement('div');
            div.className = 'hist-item';
            div.innerHTML = `
                <div class="hist-info">
                    <span class="hist-name">${item.navio}</span>
                    <span class="hist-meta">${item.data} • <span class="badge ${item.pago?'badge-ok':'badge-pend'}" onclick="alternarStatus(${item.id})">${item.pago?'Pago':'Pendente'}</span></span>
                </div>
                <div class="hist-values">
                    <span class="val-liq">R$ ${item.liquido.toFixed(2)}</span>
                    <span class="val-bruto">R$ ${item.bruto.toFixed(2)}</span>
                </div>
                <button style="background:none; color:var(--danger); font-size:1.2rem; padding:5px;" onclick="excluirItem(${item.id})">×</button>
            `;
            container.appendChild(div);
        });
        $('totalLiquidoFiltrado').textContent = "R$ " + todosDados.reduce((a,b)=>a+b.liquido,0).toFixed(2);
    }

    function alternarStatus(id) {
        const idx = todosDados.findIndex(i => i.id === id);
        todosDados[idx].pago = !todosDados[idx].pago;
        localStorage.setItem('hist_' + logado, JSON.stringify(todosDados));
        renderizarHist();
        atualizarDash();
    }

    function excluirItem(id) {
        if(confirm("Excluir este item?")) {
            todosDados = todosDados.filter(i => i.id !== id);
            localStorage.setItem('hist_' + logado, JSON.stringify(todosDados));
            renderizarHist();
            atualizarDash();
        }
    }

    function atualizarDash() {
        const totalL = todosDados.reduce((a,b) => a+b.liquido, 0);
        const pendL = todosDados.filter(i => !i.pago).reduce((a,b) => a+b.liquido, 0);
        $('dashTotalLiquido').textContent = "R$ " + totalL.toFixed(0);
        $('dashPendenteLiquido').textContent = "R$ " + pendL.toFixed(0);
    }

    function salvarNavio(n) {
        let ns = JSON.parse(localStorage.getItem('navios_'+logado))||[];
        if(!ns.includes(n)){ ns.push(n); localStorage.setItem('navios_'+logado, JSON.stringify(ns)); carregarNavios(); }
    }
    function carregarNavios() {
        const ns = JSON.parse(localStorage.getItem('navios_'+logado))||[];
        $('listaNavios').innerHTML = ns.map(n => `<option value="${n}">`).join('');
    }

    function exportarBackupJSON() {
        const data = { hist: todosDados, navios: JSON.parse(localStorage.getItem('navios_'+logado)) };
        const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `backup_evolution_${logado}.json`;
        a.click();
    }

    function exportarCSV() {
        let csv = 'Data,Navio,Bruto,Liquido,Status\n';
        todosDados.forEach(i => csv += `${i.data},${i.navio},${i.bruto.toFixed(2)},${i.liquido.toFixed(2)},${i.pago?'Pago':'Pendente'}\n`);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
        a.download = `financeiro_${logado}.csv`;
        a.click();
    }
</script>
</body>
</html>
