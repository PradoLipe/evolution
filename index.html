<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SISTEMA EVOLUTION - V18 (DEV MODE)</title>
    <style>
        :root { --primary: #00d1b2; --accent: #ffdd57; --danger: #ff3860; --bg: #0d0d0d; --card-bg: #1a1a1a; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; padding: 10px; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 450px; width: 100%; background: var(--card-bg); padding: 25px; border-radius: 20px; border: 1px solid #333; box-sizing: border-box; margin-top: 10px; }
        h2 { text-align: center; color: var(--primary); text-transform: uppercase; font-size: 18px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: var(--primary); font-size: 10px; text-transform: uppercase; }
        input, select { width: 100%; padding: 14px; margin-top: 6px; border: 1px solid #333; background: #222; color: white; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 16px; margin-top: 12px; border: none; border-radius: 10px; font-size: 13px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        .btn-gerar { background: #48c774; color: #000; }
        .btn-dev { background: #3273dc; color: #fff; margin-top: 20px; border: 1px dashed #fff; }
        .dev-panel { display: none; background: #222; padding: 15px; border-radius: 15px; margin-top: 20px; border: 1px solid var(--primary); }
        .copyright-tag { margin-top: 25px; font-size: 9px; color: #666; text-align: center; display: block; }
    </style>
</head>
<body>

<div class="container" id="login-screen">
    <h2>SISTEMA EVOLUTION</h2>
    <p style="text-align:center; font-size:10px; color:var(--primary);">SECURE ACCESS V18</p>
    <label>CHAVE DE ACESSO:</label>
    <input type="tel" id="senhaInput" placeholder="Sua Chave" style="-webkit-text-security: disc;">
    <button style="background:var(--primary); color:#000;" onclick="login()">ENTRAR</button>
</div>

<div class="container" id="main-panel" style="display: none;">
    <h2 id="saudacao">PAINEL</h2>
    
    <div id="areaDev" style="display:none;">
        <button class="btn-dev" onclick="toggleDev()">🛠️ PAINEL ADMINISTRATIVO (DEV)</button>
        <div id="devPanel" class="dev-panel">
            <h3 style="font-size:12px; color:var(--accent);">GERENCIAR USUÁRIOS</h3>
            <input type="text" id="newUserName" placeholder="Nome do Usuário">
            <input type="text" id="newUserPass" placeholder="Senha">
            <button class="btn-gerar" onclick="addUser()">ADICIONAR/ATUALIZAR</button>
        </div>
    </div>

    <label>DADOS DO NAVIO:</label>
    <input type="text" id="navioPrincipal" placeholder="NOME DO NAVIO">
    <button class="btn-gerar" onclick="gerarRel()">GERAR RELATÓRIO RASTREADO</button>
    
    <div id="relArea" style="display:none; margin-top:15px; padding:10px; background:#000; color:#00ffca; border:1px solid var(--primary); font-size:10px; white-space: pre-wrap;"></div>
    <button id="btnCopiar" onclick="copiar()" style="display:none; background:#3273dc; color:#fff;">COPIAR</button>

    <span class="copyright-tag">© 2026 SISTEMA EVOLUTION - FELIPE PRADO</span>
</div>

<script>
    let USERS = {
        "002451": "FELIPE PRADO",
        "1980": "ANDERSON PRADO",
        "2026": "FABRICIO DIAS",
        "302466": "RODRIGO COSTA"
    };

    let logado = "";

    function login() {
        const s = document.getElementById('senhaInput').value.trim();
        if (USERS[s]) {
            logado = USERS[s];
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-panel').style.display = 'block';
            document.getElementById('saudacao').innerText = "OLÁ, " + logado;
            if(s === "002451") document.getElementById('areaDev').style.display = 'block';
        } else { alert("Chave inválida!"); }
    }

    function toggleDev() {
        const p = document.getElementById('devPanel');
        p.style.display = p.style.display === 'block' ? 'none' : 'block';
    }

    function addUser() {
        const n = document.getElementById('newUserName').value.toUpperCase();
        const s = document.getElementById('newUserPass').value;
        if(n && s) { USERS[s] = n; alert("Usuário " + n + " adicionado!"); }
    }

    function gerarRel() {
        const n = (document.getElementById('navioPrincipal').value || "S/N").toUpperCase();
        const device = navigator.userAgent.includes("Android") ? "Android" : (navigator.userAgent.includes("iPhone") ? "iPhone" : "PC");
        const track = `ID_TRACK: ${device} | ${btoa(logado).substring(0,5)} | ${new Date().toLocaleTimeString()}`;
        
        document.getElementById('relArea').innerText = `NAVIO: ${n}\nCONF: ${logado}\n----------------\n${track}`;
        document.getElementById('relArea').style.display = 'block';
        document.getElementById('btnCopiar').style.display = 'block';
    }

    function copiar() { navigator.clipboard.writeText(document.getElementById('relArea').innerText); alert("Copiado!"); }
</script>
</body>
</html>
