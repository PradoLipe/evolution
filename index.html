<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVOLUTION V46 - ULTRA PREMIUM 3.5</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        
        :root {
            --primary: #00d1b2; --danger: #ff3860; --success: #48c774;
            --bg: #0a0a0e; --card: rgba(22, 22, 29, 0.75); --text: #fff; --border: rgba(255, 255, 255, 0.1);
        }

        body.light-mode {
            --bg: #f4f7f6; --card: #ffffff; --text: #1a1a1a; --border: rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: 0.3s; }
        .container { max-width: 480px; margin: 0 auto; padding: 20px; }
        
        .header-app { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .config-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 12px; cursor: pointer; }

        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .dash-card { background: var(--card); padding: 15px; border-radius: 18px; border: 1px solid var(--border); position: relative; }
        .dash-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; border-radius: 4px 0 0 4px; }
        .dash-pend::before { background: var(--danger); } .dash-pago::before { background: var(--success); }
        .dash-val { font-size: 1.1rem; font-weight: 800; margin-top: 5px; }

        .input-row { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 10px !important; width: 100% !important; margin-bottom: 12px; }
        input, select { width: 100%; padding: 14px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; color: var(--text); outline: none; font-size: 14px; }
        .input-label { display: block; font-size: 10px; color: #8e8e93; margin-bottom: 4px; font-weight: 700; text-transform: uppercase; }

        .btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: var(--primary); color: #000; }
        .btn-success { background: var(--success); color: #fff; }

        .section-card { background: var(--card); border-radius: 20px; margin-bottom: 15px; border: 1px solid var(--border); overflow: hidden; }
        .section-header { padding: 18px 20px; cursor: pointer; display: flex; justify-content: space-between; font-weight: 800; font-size: 0.75rem; }
        .section-content { display: none; padding: 0 20px 20px; }
        .section-card.expanded .section-content { display: block; }

        .hist-item { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; border: 1px solid var(--border); }
        .hidden { display: none !important; }
        
        #configModal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 100; }
        #configModal.active { display: flex; }
    </style>
</head>
<body>
    <div class="container" id="loginScreen">
        <div style="height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <h1 style="color:var(--primary); letter-spacing:5px; margin-bottom: 30px;">EVOLUTION</h1>
            <input type="password" id="senhaInput" placeholder="CHAVE DE ACESSO" style="text-align:center;">
            <button class="btn btn-primary" style="margin-top:20px;" onclick="app.login()">ACESSAR</button>
        </div>
    </div>

    <div class="container hidden" id="mainPanel">
        <div class="header-app">
            <div><p style="font-size:10px; color:var(--primary); font-weight:800;">ATIVO</p><h2 id="userName" style="font-size:1rem;">...</h2></div>
            <button class="config-btn" onclick="app.toggleModal()">⚙️</button>
        </div>

        <div class="dash-grid">
            <div class="dash-card dash-pend"><div>PENDENTE</div><div class="dash-val" id="dashPend" style="color:var(--danger)">R$ 0,00</div></div>
            <div class="dash-card dash-pago"><div>PAGO</div><div class="dash-val" id="dashPago" style="color:var(--success)">R$ 0,00</div></div>
        </div>

        <div class="section-card expanded" id="secLan">
            <div class="section-header" onclick="app.toggle('secLan')">NOVA PRODUÇÃO<span>▼</span></div>
            <div class="section-content">
                <div style="margin-bottom:12px;"><label class="input-label">Navio</label><input type="text" id="calcNavio" style="text-transform:uppercase;"></div>
                <div class="input-row">
                    <div><label class="input-label">Tipo</label><select id="tipo"><option value="normal">Normal</option><option value="feriado">Domingo / Feriado</option></select></div>
                    <div><label class="input-label">Turno</label><select id="turno" onchange="app.render()"><option value="15x23">15x23</option><option value="07x15">07x15</option></select></div>
                </div>
                <div id="camposCalc"></div>
                <button class="btn btn-primary" onclick="app.saveEntry()" style="margin-top:10px;">SALVAR REGISTRO</button>
            </div>
        </div>

        <div class="section-card" id="secHis">
            <div class="section-header" onclick="app.toggle('secHis')">HISTÓRICO<span>▼</span></div>
            <div class="section-content"><div id="histList"></div></div>
        </div>
    </div>

    <div id="configModal" onclick="if(event.target.id==='configModal')app.toggleModal()">
        <div style="background:var(--card); padding:30px; border-radius:25px; width:90%; max-width:350px; text-align:center;">
            <h3 style="margin-bottom:20px;">CONFIGURAÇÕES</h3>
            <button class="btn" style="background:var(--primary); color:#000; margin-bottom:10px;" onclick="app.toggleDarkMode()">ALTERAR TEMA</button>
            <button class="btn" style="background:var(--danger); color:#fff;" onclick="app.logout()">SAIR DO SISTEMA</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBajqlsm59E8r_GqDOTLzTEuAW9GkqNAw",
            authDomain: "evolution-v46-system.firebaseapp.com",
            databaseURL: "https://evolution-v46-system-default-rtdb.firebaseio.com",
            projectId: "evolution-v46-system",
            storageBucket: "evolution-v46-system.firebasestorage.app",
            appId: "1:447216318794:web:05199126e89275f3f069b3"
        };
        try { firebase.initializeApp(firebaseConfig); } catch(e) {}

        class EvolutionApp {
            constructor() {
                this.dna = localStorage.getItem('evo_dna') || 'DNA-'+Math.random().toString(36).substr(2,9).toUpperCase();
                localStorage.setItem('evo_dna', this.dna);
                this.entries = [];
                if (localStorage.getItem('evo_theme') === 'light') document.body.classList.add('light-mode');
            }

            async login() {
                const s = document.getElementById('senhaInput').value;
                const users = {"002451": "FELIPE PRADO", "1234": "TESTE", "7806": "EdilsonJr", "2026": "FABRICIO"};
                if(users[s]) {
                    if(s !== "002451") {
                        try {
                            const db = firebase.database();
                            const snap = await db.ref('devices/'+s).get();
                            const reg = snap.val();
                            if(reg && reg !== this.dna) {
                                document.body.innerHTML = "<div style='height:100vh; display:flex; align-items:center; justify-content:center; background:#000; color:red; text-align:center; padding:20px;'><h1>ACESSO NEGADO</h1><p>Esta chave já está em uso em outro celular.</p></div>";
                                return;
                            } else if(!reg) { await db.ref('devices/'+s).set(this.dna); }
                        } catch(e) {}
                    }
                    this.currentUser = users[s];
                    document.getElementById('userName').innerText = this.currentUser;
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('mainPanel').classList.remove('hidden');
                    this.loadHistory(); this.render();
                } else { alert("Senha Incorreta"); }
            }

            loadHistory() {
                // Tenta puxar do banco antigo e do novo
                const oldDb = JSON.parse(localStorage.getItem(`evo_db_${btoa(this.currentUser)}`)) || [];
                const newDb = JSON.parse(localStorage.getItem('evo_db')) || [];
                this.entries = oldDb.length > 0 ? oldDb : newDb;
                this.updateUI();
            }

            render() {
                const t = document.getElementById('turno').value;
                document.getElementById('camposCalc').innerHTML = t === '15x23' ? 
                    `<div class="input-row"><div><label class="input-label">15h-19h</label><input type="number" id="p1"></div><div><label class="input-label">19h-23h</label><input type="number" id="p2"></div></div>` : 
                    `<input type="number" id="pt" placeholder="Produção Total">`;
            }

            saveEntry() {
                const n = document.getElementById('calcNavio').value.toUpperCase();
                if(!n) return alert("Digite o Navio");
                const p1 = parseFloat(document.getElementById('p1')?.value || 0);
                const p2 = parseFloat(document.getElementById('p2')?.value || 0);
                const pt = parseFloat(document.getElementById('pt')?.value || (p1 + p2));
                const val = (document.getElementById('tipo').value === 'feriado' ? pt * 8.61 : pt * 5.73) / 3;
                this.entries.unshift({ id: Date.now(), navio: n, valor: val, pago: false, data: new Date().toLocaleDateString() });
                localStorage.setItem(`evo_db_${btoa(this.currentUser)}`, JSON.stringify(this.entries));
                this.updateUI(); alert("Salvo!");
            }

            updateUI() {
                let pend = 0, pago = 0;
                document.getElementById('histList').innerHTML = this.entries.map(e => {
                    if(e.pago) pago += e.valor; else pend += e.valor;
                    return `<div class="hist-item"><div><b>${e.navio}</b><br><small>${e.data} - ${e.pago?'Pago':'Pendente'}</small></div><div style="text-align:right">R$ ${e.valor.toFixed(2)}<br><button onclick="app.togglePago(${e.id})" style="color:var(--primary); background:none; border:none; font-size:10px;">Alterar</button></div></div>`;
                }).join('');
                document.getElementById('dashPend').innerText = `R$ ${pend.toFixed(2)}`;
                document.getElementById('dashPago').innerText = `R$ ${pago.toFixed(2)}`;
            }

            togglePago(id) {
                const e = this.entries.find(x => x.id === id);
                if(e) { e.pago = !e.pago; localStorage.setItem(`evo_db_${btoa(this.currentUser)}`, JSON.stringify(this.entries)); this.updateUI(); }
            }

            toggleDarkMode() {
                document.body.classList.toggle('light-mode');
                localStorage.setItem('evo_theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
            }

            toggleModal() { document.getElementById('configModal').classList.toggle('active'); }
            toggle(id) { document.getElementById(id).classList.toggle('expanded'); }
            logout() { location.reload(); }
        }
        const app = new EvolutionApp();
    </script>
</body>
</html>
