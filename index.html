<!DOCTYPE html>
<html lang="pt-br">
<head>

    <style>
        :root { 
            --primary: #00d1b2; 
            --primary-dark: #00b89c;
            --accent: #ffd700; 
            --danger: #ff3860;
            --success: #48c774;
            --bg: #0a0a0f; 
            --card: rgba(26, 26, 30, 0.98);
            --input: #25252a;
            --border: rgba(255,255,255,0.1);
        }
        
        * { -webkit-user-select: none; user-select: none; box-sizing: border-box; margin:0; padding:0; }
        input, select { user-select: text; }
        
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%); 
            color: #fff; 
            padding: 10px; 
            min-height: 100vh;
            display: flex; 
            justify-content: center; 
        }
        
        .container { 
            max-width: 480px; 
            width: 100%; 
            background: var(--card); 
            padding: 25px; 
            border-radius: 24px; 
            border: 1px solid var(--border);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }
        
        h2 { 
            text-align: center; 
            color: var(--primary); 
            text-transform: uppercase; 
            letter-spacing: 3px;
            font-size: 1.4rem;
            margin-bottom: 25px;
        }
        
        h3 { font-size: 1rem; margin-bottom: 15px; color: #fff; display: flex; align-items: center; gap: 8px; }
        h3::before { content: ''; display: inline-block; width: 4px; height: 20px; background: var(--primary); border-radius: 2px; }
        
        label { 
            display: block; 
            margin-top: 18px; 
            font-weight: 600;
            color: #888; 
            font-size: 10px; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        input, select { 
            width: 100%; 
            padding: 14px; 
            margin-top: 6px; 
            border: 2px solid var(--border); 
            background: var(--input); 
            color: white; 
            border-radius: 12px; 
            font-size: 16px; 
            outline: none;
            transition: all 0.3s ease;
        }
        
        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,209,178,0.1);
        }
        
        button { 
            width: 100%; 
            padding: 16px; 
            margin-top: 15px; 
            border: none; 
            border-radius: 12px; 
            font-size: 13px; 
            cursor: pointer; 
            font-weight: bold; 
            text-transform: uppercase; 
            transition: all 0.3s ease;
        }
        
        button:active { transform: scale(0.98); }
