<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0e">
    <title>EVOLUTION V46 ULTRA PREMIUM</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Space+Mono:wght@400;700&display=swap');
        
        :root {
            --primary: #00d1b2; --accent: #ffd700; --danger: #ff3860; --success: #48c774;
            --bg: #0a0a0e; --card: rgba(22, 22, 29, 0.75); --card-solid: #16161d;
            --text: #ffffff; --text-dim: #8e8e93; --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

        .container { max-width: 480px; width: 100%; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; min-height: 100vh; }

        /* TRAVA DE LAYOUT 50/50 */
        .input-row { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 10px !important; width: 100% !important; margin-bottom: 15px; }

        input, select { width: 100%; padding: 12px; background: rgba(32, 32, 38, 0.8); border: 1px solid var(--border); border-radius: 12px; color: #fff; outline: none; font-size: 14px; }
        .input-label { display: block; font-size: 10px; color: var(--text-dim); margin-bottom: 4px; font-weight: 700; text-transform: uppercase; }

        .btn { width: 100%; padding: 15px; border: none; border-radius: 14px; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: linear-gradient(135deg, var(--primary) 0%, #00b89c 100%); color: #000; }
        .btn-success { background: linear-gradient(135deg, var(--success) 0%, #3dad66 100%); color: #fff; }

        .section-card { background: var(--card); border-radius: 20px; margin-bottom: 15px; border: 1px solid var(--border); overflow: hidden; }
        .section-header { padding: 18px 20px; cursor: pointer; display: flex; justify-content: space-between; font-weight: 800; font-size: 0.75rem; letter-spacing: 1px; }
        .section-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; padding: 0 20px; }
        .section-card.expanded .section-content { max-height: 1500px; padding: 0 20px 20px; }

        .hidden { display: none !important; }

        .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; width: 90%; max-width: 350px; pointer-events: none; }
        .toast { background: var(--card-solid); color: var(--primary); padding: 16px; border-radius: 16px; border-left: 5px solid var(--primary); font-weight: 700; font-size: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <div class="container" id="loginScreen">
        <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <div style="background: var(--card); padding: 40px 30px; border-radius: 28px; width: 100%; text-align: center; border: 1px solid var(--border);">
                <h1 style="font-size: 2rem; letter-spacing: 5px; font-weight: 900; color: var(--primary);">EVOLUTION</h1>
                <p style="font-size: 9px; color: var(--text-dim); letter-spacing: 2px; margin-bottom: 30px;">V46 ULTRA PREMIUM</p>
                <input type="password" id="senhaInput" placeholder="CHAVE DE ACESSO" maxlength="6" style="text-align: center; font-weight: 800; letter-spacing: 4px;">
                <button class="btn btn-primary" style="margin-top: 20px;" onclick="app.login()">ACESSAR</button>
            </div>
        </div>
    </div>

    <div class="container hidden" id="mainPanel">
        <div class="section-card" id="secRel">
            <div class="section-header" onclick="app.toggleSection('secRel')">RELATÓRIO DE PRODUÇÃO<span>▼</span></div>
            <div class="section-content">
                <div class="input-group" style="margin-bottom:12px;"><label class="input-label">Navio</label><input type="text" id="relNavio" style="text-transform:uppercase;"></div>
                <div class="input-row">
                    <div class="input-group"><label class="input-label">Data</label><input type="date" id="relData"></div>
                    <div class="input-group"><label class="input-label">Turno</label><select id="relTurno" onchange="app.toggleRelatorioCampos()"><option value="07x15">07x15</option><option value="15x23" selected>15x23</option></select></div>
                </div>
                <div id="relCamposProducao"></div>
                <button class="btn btn-success" onclick="app.generateReport()">COPIAR RELATÓRIO</button>
            </div>
        </div>

        <div class="section-card" id="secLan">
            <div class="section-header" onclick="app.toggleSection('secLan')">NOVA PRODUÇÃO<span>▼</span></div>
            <div class="section-content">
                <div class="input-group" style="margin-bottom:12px;"><label class="input-label">Navio</label><input type="text" id="calcNavio" style="text-transform:uppercase;"></div>
                <div class="input-row">
                    <div class="input-group"><label class="input-label">Tipo</label><select id="calcTipoDia"><option value="normal">Normal</option><option value="feriado">Domingo / Feriado</option></select></div>
                    <div class="input-group"><label class="input-label">Turno</label><select id="calcTurno" onchange="app.adjustCalcFields()"><option value="15x23" selected>15x23</option><option value="07x15">07x15</option></select></div>
                </div>
                <div id="calcCampos"></div>
                <button class="btn btn-primary" onclick="app.saveEntry()">SALVAR REGISTRO</button>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO EXTRAÍDA
        const firebaseConfig = {
            apiKey: "AIzaSyBajqlsm59E8r_GqDOTLzTEuAW9GkqNAw",
            authDomain: "evolution-v46-system.firebaseapp.com",
            databaseURL: "https://evolution-v46-system-default-rtdb.firebaseio.com",
            projectId: "evolution-v46-system",
            storageBucket: "evolution-v46-system.firebasestorage.app",
            messagingSenderId: "447216318794",
            appId: "1:447216318794:web:05199126e89275f3f069b3"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const SECURE_USERS = { "002451": "FELIPE PRADO", "1234": "USUÁRIO TESTE", "7806": "EdilsonJr" };

        class EvolutionApp {
            constructor() {
                this.deviceId = this.initDevice();
                this.init();
            }

            initDevice() {
                let id = localStorage.getItem('evo_dna');
                if (!id) { id = 'ID-' + Math.random().toString(36).substr(2, 9).toUpperCase(); localStorage.setItem('evo_dna', id); }
                return id;
            }

            async login() {
                const code = document.getElementById('senhaInput').value;
                const user = SECURE_USERS[code];
                if (!user) { this.showToast('Senha Incorreta'); return; }

                // TRAVA GLOBAL FIREBASE
                if (code !== "002451") {
                    const snap = await db.ref(`devices/${code}`).get();
                    const registeredDna = snap.val();
                    if (registeredDna && registeredDna !== this.deviceId) {
                        this.breakSite(); return;
                    } else if (!registeredDna) {
                        await db.ref(`devices/${code}`).set(this.deviceId);
                    }
                }

                this.currentUser = user;
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainPanel').classList.remove('hidden');
                this.adjustCalcFields(); this.toggleRelatorioCampos();
            }

            breakSite() {
                document.body.innerHTML = `<div style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#000; color:#ff3860; text-align:center; padding:30px;">
                    <h1 style="font-weight:900;">ACESSO NEGADO</h1>
                    <p style="margin:20px 0; color:#8e8e93;">Esta chave está vinculada a outro celular.</p>
                    <p style="color:var(--primary); font-weight:800;">CONTATO: FELIPE PRADO</p>
                </div>`;
            }

            adjustCalcFields() {
                const t = document.getElementById('calcTurno').value;
                const c = document.getElementById('calcCampos');
                c.innerHTML = t === '15x23' ? `<div class="input-row"><div><label class="input-label">15h-19h</label><input type="number" id="calcP1"></div><div><label class="input-label">19h-23h</label><input type="number" id="calcP2"></div></div>` : `<div class="input-group"><label class="input-label">Total</label><input type="number" id="calcPT"></div>`;
            }

            toggleRelatorioCampos() {
                const t = document.getElementById('relTurno').value;
                const c = document.getElementById('relCamposProducao');
                c.innerHTML = t === '15x23' ? `<div class="input-row"><div><label class="input-label">15h-19h</label><input type="number" id="relP1"></div><div><label class="input-label">19h-23h</label><input type="number" id="relP2"></div></div>` : `<div class="input-group"><label class="input-label">Total</label><input type="number" id="relPT"></div>`;
            }

            generateReport() {
                const n = document.getElementById('relNavio').value.toUpperCase();
                const t = document.getElementById('relTurno').value;
                const df = new Date().toLocaleDateString('pt-BR');
                let m = `*${n}*\nData: ${df} - ${t}\n`;
                if (t === '15x23') {
                    const p1 = document.getElementById('relP1').value || 0;
                    const p2 = document.getElementById('relP2').value || 0;
                    m += `15x19: ${p1}\n19x23: ${p2}\nTOTAL: ${parseInt(p1)+parseInt(p2)}\n`;
                } else m += `TOTAL: ${document.getElementById('relPT').value || 0}\n`;
                m += `${this.currentUser}`;
                navigator.clipboard.writeText(m).then(() => this.showToast('Relatório Copiado'));
            }

            showToast(m) {
                const e = document.createElement('div'); e.className = 'toast'; e.textContent = m;
                document.getElementById('toastContainer').appendChild(e);
                setTimeout(() => e.remove(), 3000);
            }

            toggleSection(id) { document.getElementById(id).classList.toggle('expanded'); }

            init() { 
                const hoje = new Date().toISOString().split('T')[0]; 
                document.getElementById('relData').value = hoje; 
            }
        }
        const app = new EvolutionApp();
    </script>
</body>
</html>
