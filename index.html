<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SISTEMA EVOLUTION - V18.4</title>
    <style>
        :root { --primary: #00d1b2; --accent: #ffdd57; --danger: #ff3860; --bg: #0d0d0d; --card-bg: #1a1a1a; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; padding: 10px; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 450px; width: 100%; background: var(--card-bg); padding: 25px; border-radius: 20px; border: 1px solid #333; box-sizing: border-box; margin-top: 10px; }
        h2 { text-align: center; color: var(--primary); text-transform: uppercase; font-size: 18px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: var(--primary); font-size: 10px; text-transform: uppercase; }
        input, select { width: 100%; padding: 14px; margin-top: 6px; border: 1px solid #333; background: #222; color: white; border-radius: 10px; box-sizing: border-box; font-size: 16px; outline: none; }
        button { width: 100%; padding: 16px; margin-top: 12px; border: none; border-radius: 10px; font-size: 13px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        .btn-gerar { background: #48c774; color: #000; }
        .btn-dev { background: #3273dc; color: #fff; font-size: 10px; margin-top: 10px; }
        .btn-calc-toggle { background: var(--accent); color: #000; margin-top: 20px; }
        .calc-section { display: none; margin-top: 20px; padding: 15px; background: #252525; border: 1px solid var(--accent); border-radius: 15px; }
        .res-area { display:none; margin-top:15px; padding:12px; background:#000; color:#00ffca; border:1px solid var(--primary); font-family:monospace; font-size:11px; white-space: pre-wrap; border-radius:8px; }
        .history-section { margin-top: 30px; border-top: 2px solid #333; padding-top: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 10px; }
        th { color: var(--primary); text-align: left; padding: 8px; border-bottom: 1px solid #444; }
        td { padding: 8px; border-bottom: 1px solid #333; }
        .copyright { margin-top: 25px; font-size: 9px; color: #666; text-align: center; display: block; }
    </style>
</head>
<body>

<div class="container" id="login-screen">
    <h2>SISTEMA EVOLUTION</h2>
    <p style="text-align:center; font-size:10px; color:var(--primary);">ACESSO RESTRITO V18.4</p>
    <label>CHAVE DE ACESSO:</label>
    <input type="tel" id="senhaInput" placeholder="Sua Chave" style="-webkit-text-security: disc;">
    <button style="background:var(--primary); color:#000;" onclick="login()">ENTRAR</button>
</div>

<div class="container" id="main-panel" style="display: none;">
    <h2 id="saudacao">PAINEL</h2>
    
    <div id="areaDev" style="display:none;">
        <button class="btn-dev" onclick="document.getElementById('devPanel').style.display='block'">🛠️ PAINEL ADMINISTRATIVO</button>
        <div id="devPanel" style="display:none; background:#222; padding:10px; border-radius:10px; margin-top:5px; border:1px solid var(--primary);">
            <input type="text" id="newUserName" placeholder="Nome">
            <input type="text" id="newUserPass" placeholder="Senha">
            <button class="btn-gerar" onclick="addUser()">ADICIONAR ACESSO</button>
            <button style="background:#444; color:#fff;" onclick="document.getElementById('devPanel').style.display='none'">FECHAR</button>
        </div>
    </div>

    <label>NAVIO E DADOS:</label>
    <input type="text" id="navioPrincipal" placeholder="NOME DO NAVIO" oninput="sincronizar(this.value)">
    <input type="date" id="dataTurno" style="margin-top:10px;">
    
    <button class="btn-gerar" onclick="gerarRel()">GERAR TEXTO WHATSAPP</button>
    <div id="relArea" class="res-area"></div>
    <button id="btnCopiar" onclick="copiar()" style="display:none; background:#3273dc; color:#fff;">COPI
