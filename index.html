<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVOLUTION - V48 PREMIUM</title>
    <style>
        :root { 
            --primary: #00d1b2; --accent: #ffd700; --danger: #ff3860; --success: #48c774;
            --info: #209cee; --bg: #0f0f13; --card: #1a1a20; --input: #25252a;
            --text: #ffffff; --text-dim: #a0a0a5; --border: rgba(255,255,255,0.05);
        }
        [data-theme="light"] {
            --bg: #f4f4f9; --card: #ffffff; --input: #ececef; --text: #1c1c1e; --text-dim: #6e6e73; --border: rgba(0,0,0,0.1);
        }
        * { -webkit-user-select: none; user-select: none; box-sizing: border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
        input, select, textarea { user-select: text; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 15px; min-height: 100vh; display: flex; justify-content: center; }
        .container { max-width: 480px; width: 100%; position: relative; display: flex; flex-direction: column; }
        
        /* DASHBOARD */
        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        .dash-item { background: var(--card); padding: 15px; border-radius: 16px; border: 1px solid var(--border); }
        .dash-label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 4px; display: block; }
        .dash-val { font-size: 1.1rem; font-weight: 800; }

        /* SEÇÕES */
        .section-card { background: var(--card); padding: 20px; border-radius: 20px; margin-bottom: 15px; border: 1px solid var(--border); }
        h3 { font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 15px; display: flex; justify-content: space-between; }

        /* HISTÓRICO (RESTAURADO IGUAL À FOTO) */
        .hist-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--border); position: relative; }
        .hist-info { display: flex; flex-direction: column; gap: 4px; }
        .hist-name { font-weight: 800; font-size: 0.95rem; text-transform: uppercase; }
        .hist-date { font-size: 0.75rem; color: var(--text-dim); }
        .hist-values { text-align: right; }
        .val-liq { color: var(--accent); font-weight: 800; font-size: 1rem; display: block; }
        .val-bruto { color: var(--text-dim); font-size: 0.7rem; text-decoration: none; display: block; }
        .btn-del { color: var(--danger); font-size: 1.2rem; padding: 0 10px; cursor: pointer; }

        /* INPUTS */
        input, select { width: 100%; padding: 14px; background: var(--input); border: 1px solid transparent; border-radius: 12px; color: var(--text); font-size: 0.95rem; margin-top: 8px; }
        .btn-main { background: var(--primary); color: #000; width: 100%; margin-top: 15px; border-radius: 12px; font-weight: 700; padding: 14px; border:none; cursor:pointer; text-transform: uppercase; }

        /* CONFIGURAÇÕES ABA (RESTAURADA) */
        .config-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding: 10px 0; }
        .config-content { padding-top: 15px; display: none; }
        .config-btn-row { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 15px; }

        /* MODAIS */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: var(--card); border: 1px solid var(--border); padding: 25px; border-radius: 20px; width: 100%; max-width: 380px; text-align: center; }

        .badge { font-size: 0.65rem; padding: 3px 8px; border-radius: 6px; font-weight: 800; margin-top: 5px; display: inline-block; }
        .badge-pend { background: rgba(255,56,96,0.1); color: var(--danger); border: 1px solid var(--danger); }
        .badge-ok { background: rgba(72,199,116,0.1); color: var(--success); border: 1px solid var(--success); }
        .toast { position: fixed; bottom: 30px; background: var(--primary); color: #000; padding: 12px 25px; border-radius: 50px; font-weight: 800; z-index: 2000; display: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body data-theme="dark">

<div class="toast" id="toast"></div>

<div class="modal" id="modalPix">
    <div class="modal-content" onclick="copiarChavePix()">
        <div style="font-size: 3rem;">☕</div>
        <h3 id="msgComedia" style="margin:15px 0; font-size:0.9rem; color:var(--text-dim);"></h3>
        <div style="background:#000; padding:20px; border-radius:18px; border:1px dashed var(--accent);">
            <span style="font-size: 1.1rem; font-weight: 900; color: var(--accent);">92994821868</span>
            <br><small style="color:var(--text-dim)">Felipe Prado • Toque para copiar</small>
        </div>
        <button onclick="event.stopPropagation(); fecharModalPix()" style="background:none; border:none; color:var(--text-dim); margin-top: 15px;">Mais tarde</button>
    </div>
</div>

<div class="container" id="login-screen">
    <div style="text-align:center; margin-top: 25vh;">
        <h1 style="font-size: 2.2rem; color: var(--primary); letter-spacing: 5px; font-weight: 900;">EVOLUTION</h1>
        <p style="color:var(--text-dim); font-size: 0.7rem; margin-bottom: 30px;">PREMIUM MANAGEMENT</p>
        <input type="tel" id="senhaInput" placeholder="Senha de Acesso" style="text-align:center;">
        <button class="btn-main" onclick="login()">ENTRAR</button>
    </div>
</div>

<div class="container hidden" id="main-panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
        <h2 id="userName" style="font-size:1.1rem; font-weight: 800;">...</h2>
        <div style="color:var(--primary); font-size: 1.2rem;">⚡</div>
    </div>

    <div class="dash-grid">
        <div class="dash-item"><span class="dash-label">Bruto</span><div id="dashTotalBruto" style="color:var(--info);" class="dash-val">R$ 0,00</div></div>
        <div class="dash-item"><span class="dash-label">Líquido</span><div id="dashTotalLiquido" style="color:var(--accent);" class="dash-val">R$ 0,00</div></div>
    </div>

    <div class="section-card">
        <h3 onclick="toggleSection('rel-box')" style="cursor:pointer">📄 Gerador de Relatório <span>▼</span></h3>
        <div id="rel-box" class="hidden">
            <input type="date" id="dataRel">
            <input type="text" id="navioRel" placeholder="Nome do Navio">
            <div style="display:flex; gap:8px;">
                <input type="number" id="ternoRelInput" placeholder="Terno">
                <select id="turnoRel" onchange="ajustarRel()">
                    <option value="">Selecione o Turno</option>
                    <option value="07x15">07x15</option>
                    <option value="15x23">15x23</option>
                    <option value="23x07">23x07</option>
                </select>
            </div>
            <div id="camposRel"></div>
            <button class="btn-main" style="background:#25d366; color:#fff;" onclick="gerarRel()">Gerar p/ WhatsApp</button>
            <div id="relatorioArea" class="hidden" style="background:#000; color:var(--primary); padding:15px; border-radius:12px; margin-top:15px; font-family:monospace; font-size:11px; white-space:pre-wrap; border: 1px solid #333;"></div>
        </div>
    </div>

    <div class="section-card">
        <h3>💰 Lançar Produção</h3>
        <input type="date" id="dataCalc">
        <input type="text" id="navioCalc" placeholder="Navio">
        <div style="display:flex; gap:8px;">
            <select id="tipoDia"><option value="n">Dia Normal</option><option value="f">Dom/Feriado</option></select>
            <select id="turnoCalc" onchange="ajustarCalc()"><option value="07x15">07x15</option><option value="15x23" selected>15x23</option><option value="23x07">23x07</option></select>
        </div>
        <div id="camposCalc"></div>
        <button class="btn-main" onclick="calcularESalvar()">SALVAR SERVIÇO</button>
    </div>

    <div class="section-card">
        <h3>📅 Histórico</h3>
        <div id="listaHist"></div>
    </div>

    <div class="section-card">
        <div class="config-header" onclick="toggleConfig()">
            <span style="font-size:0.8rem; font-weight:bold; color:var(--text-dim); display:flex; align-items:center; gap:8px;">⚙️ CONFIGURAÇÕES</span>
            <span id="setaConfig">▼</span>
        </div>
        <div class="config-content" id="configContent">
            <button class="btn-main" onclick="mostrarPix()" style="background:var(--accent); color:#000; margin-top:0;">☕ Apoiar o Desenvolvedor</button>
            <button class="btn-main" onclick="toggleTheme()" style="background:var(--info); color:#fff;">🌓 Alternar Tema (Claro/Escuro)</button>
            
            <div style="margin-top:20px; padding-top:15px; border-top:1px solid var(--border);">
                <p style="font-size:0.65rem; color:var(--text-dim); margin-bottom:10px; letter-spacing:1px;">OPÇÕES DE BACKUP</p>
                <button class="btn-main" onclick="exportarExcel()" style="background:var(--success); color:#fff; margin-top:0;">📊 Baixar Histórico Excel (.csv)</button>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:10px;">
                    <button class="btn-main" onclick="exportarJSON()" style="font-size:0.7rem; margin-top:0;">📤 Exportar</button>
                    <button class="btn-main" onclick="importarJSON()" style="font-size:0.7rem; margin-top:0;">📥 Importar</button>
                </div>
            </div>
        </div>
    </div>

    <p style="text-align:center; font-size:9px; color:var(--text-dim); margin: 20px 0;">ALL RIGHTS RESERVED TO FELIPE PRADO</p>
</div>

<script>
    const USERS = {"002451": "FELIPE PRADO", "7806": "EdilsonRj", "1980": "ANDERSON PRADO", "2026": "FABRICIO DIAS", "302466": "RODRIGO COSTA", "3373": "RICARDO PRADO", "2912": "JOHNY"};
    const frasesPix = ["Café pro dev: pagando a internet! 🌐", "A Enel não perdoa, ajuda o dev! ⚡", "Apoie o Evolution! ☕"];
    let logado = "", todosDados = [];
    const $ = id => document.getElementById(id);

    function fMoeda(v) { return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
    function toast(m){ const t=$('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',3000); }

    function login() {
        const key = $('senhaInput').value;
        if(USERS[key]) {
            logado = USERS[key];
            $('userName').textContent = logado;
            $('login-screen').classList.add('hidden');
            $('main-panel').classList.remove('hidden');
            carregarSistema();
        } else alert("Chave inválida!");
    }

    function carregarSistema() {
        todosDados = JSON.parse(localStorage.getItem('hist_' + logado)) || [];
        renderizarHist(); atualizarDash(); ajustarCalc();
        $('dataCalc').value = new Date().toISOString().split('T')[0];
        $('dataRel').value = new Date().toISOString().split('T')[0];
    }

    function toggleConfig() {
        const content = $('configContent');
        const seta = $('setaConfig');
        const isHidden = content.style.display === 'none' || content.style.display === '';
        content.style.display = isHidden ? 'block' : 'none';
        seta.textContent = isHidden ? '▲' : '▼';
    }

    function toggleTheme() {
        const b = document.body;
        const novo = b.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        b.setAttribute('data-theme', novo);
        toast("Tema alterado!");
    }

    function exportarExcel() {
        let csv = "Data;Navio;Bruto;Liquido;Status\n";
        todosDados.forEach(i => { csv += `${i.data};${i.navio};${i.bruto.toFixed(2)};${i.liquido.toFixed(2)};${i.pago?'Pago':'Pendente'}\n`; });
        const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Evolution_FelipePrado.csv`;
        link.click();
    }

    function exportarJSON() { navigator.clipboard.writeText(JSON.stringify(todosDados)); alert("Backup Copiado!"); }
    function importarJSON() { 
        const code = prompt("Cole o código de backup:"); 
        if(code) { todosDados = JSON.parse(code); localStorage.setItem('hist_'+logado, code); carregarSistema(); }
    }

    function mostrarPix() { 
        $('msgComedia').textContent = frasesPix[Math.floor(Math.random()*frasesPix.length)];
        $('modalPix').style.display = 'flex'; 
    }
    function fecharModalPix() { $('modalPix').style.display = 'none'; }
    function copiarChavePix() { navigator.clipboard.writeText('92994821868'); toast("Pix Copiado! ☕"); fecharModalPix(); }

    function ajustarRel() {
        const t = $('turnoRel').value;
        $('camposRel').innerHTML = t === "15x23" ? 
            '<input type="number" id="p1" placeholder="Prod 15h-19h"><input type="number" id="p2" placeholder="Prod 20h-23h">' : 
            (t ? '<input type="number" id="pGeral" placeholder="Produção Total">' : '');
    }

    function gerarRel() {
        const t = $('turnoRel').value; if(!t) return;
        let prod = 0, txt = "";
        if(t === "15x23") {
            const v1 = parseInt($('p1').value)||0; const v2 = parseInt($('p2').value)||0;
            prod = v1+v2; txt = `15x19: ${v1}\n20x23: ${v2}\nTotal: ${prod}`;
        } else {
            prod = parseInt($('pGeral').value)||0; txt = `Produção: ${prod}`;
        }
        const msg = `* Relatório de Produção *\n\nNavio: ${($('navioRel').value||"S/N").toUpperCase()}\nData: ${$('dataRel').value.split('-').reverse().join('/')}\nTerno: ${$('ternoRelInput').value||"S/T"}°\nTurno: ${t}\n\n${txt}\n\nConferente: ${logado}`;
        $('relatorioArea').textContent = msg; $('relatorioArea').classList.remove('hidden');
        navigator.clipboard.writeText(msg); toast("Copiado!");
    }

    function ajustarCalc() {
        const t = $('turnoCalc').value;
        $('camposCalc').innerHTML = t === "15x23" ? '<input type="number" id="t1" placeholder="15h-19h"><input type="number" id="t2" placeholder="20h-23h">' : '<input type="number" id="tGeral" placeholder="Total">';
    }

    function calcularESalvar() {
        const tur = $('turnoCalc').value;
        let b = 0;
        if(tur === "15x23") { b = ((parseInt($('t1').value)||0)*5.73) + ((parseInt($('t2').value)||0)*6.88); }
        else { b = (parseInt($('tGeral').value)||0) * 5.73; }
        todosDados.unshift({ id: Date.now(), data: $('dataCalc').value.split('-').reverse().join('/').substring(0,5), navio: ($('navioCalc').value||"S/N").toUpperCase(), bruto: b/3, liquido: (b/3)*0.82, pago: false });
        localStorage.setItem('hist_'+logado, JSON.stringify(todosDados));
        renderizarHist(); atualizarDash(); toast("Salvo!");
    }

    function renderizarHist() {
        const c = $('listaHist'); c.innerHTML = '';
        todosDados.forEach(i => {
            const d = document.createElement('div'); d.className='hist-item';
            d.innerHTML = `
                <div class="hist-info">
                    <span class="hist-name">${i.navio}</span>
                    <span class="hist-date">${i.data} • <span class="badge ${i.pago?'badge-ok':'badge-pend'}" onclick="alternarStatus(${i.id})">${i.pago?'PAGO':'PENDENTE'}</span></span>
                </div>
                <div class="hist-values">
                    <span class="val-liq">${fMoeda(i.liquido)}</span>
                    <span class="val-bruto">R$ ${(i.bruto).toFixed(2)}</span>
                </div>
                <div class="btn-del" onclick="remover(${i.id})">×</div>
            `;
            c.appendChild(d);
        });
    }

    function alternarStatus(id) {
        const idx = todosDados.findIndex(i => i.id === id);
        todosDados[idx].pago = !todosDados[idx].pago;
        localStorage.setItem('hist_'+logado, JSON.stringify(todosDados));
        renderizarHist(); atualizarDash();
    }

    function remover(id) {
        if(confirm("Excluir serviço?")) {
            todosDados = todosDados.filter(i => i.id !== id);
            localStorage.setItem('hist_'+logado, JSON.stringify(todosDados));
            renderizarHist(); atualizarDash();
        }
    }

    function atualizarDash() {
        const b = todosDados.reduce((a,x)=>a+x.bruto,0);
        const l = todosDados.reduce((a,x)=>a+x.liquido,0);
        $('dashTotalBruto').textContent = fMoeda(b);
        $('dashTotalLiquido').textContent = fMoeda(l);
    }
    function toggleSection(id) { $(id).classList.toggle('hidden'); }
</script>
</body>
</html>
