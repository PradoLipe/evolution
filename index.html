<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVOLUTION V46 - FIX</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --primary: #00d1b2; --bg: #0a0a0e; --card: #16161d; --text: #fff; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }
        .container { max-width: 480px; margin: 0 auto; padding: 20px; }
        .input-row { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 10px !important; margin-bottom: 15px; }
        input, select { width: 100%; padding: 14px; background: #202026; border: 1px solid #333; border-radius: 12px; color: #fff; outline: none; }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-weight: 800; text-transform: uppercase; cursor: pointer; }
        .btn-primary { background: var(--primary); color: #000; }
        .section-card { background: var(--card); border-radius: 20px; margin-bottom: 15px; border: 1px solid #333; overflow: hidden; }
        .section-header { padding: 20px; cursor: pointer; display: flex; justify-content: space-between; font-weight: 800; font-size: 0.8rem; }
        .section-content { display: none; padding: 0 20px 20px; }
        .section-card.expanded .section-content { display: block; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container" id="loginScreen">
        <div style="height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <h1 style="color:var(--primary); letter-spacing:4px; margin-bottom:30px;">EVOLUTION</h1>
            <input type="password" id="senhaInput" placeholder="CHAVE DE ACESSO" style="text-align:center;">
            <button class="btn btn-primary" style="margin-top:20px;" onclick="app.login()">ACESSAR</button>
        </div>
    </div>

    <div class="container hidden" id="mainPanel">
        <div class="section-card expanded" id="secLan">
            <div class="section-header" onclick="app.toggle('secLan')">NOVA PRODUÇÃO<span>▼</span></div>
            <div class="section-content">
                <div class="input-row">
                    <select id="tipo"><option>Normal</option><option>Domingo / Feriado</option></select>
                    <select id="turno" onchange="app.render()"><option value="15x23">15x23</option><option value="07x15">07x15</option></select>
                </div>
                <div id="campos"></div>
                <button class="btn btn-primary" style="margin-top:10px;">SALVAR</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBajqlsm59E8r_GqDOTLzTEuAW9GkqNAw",
            authDomain: "evolution-v46-system.firebaseapp.com",
            databaseURL: "https://evolution-v46-system-default-rtdb.firebaseio.com",
            projectId: "evolution-v46-system",
            storageBucket: "evolution-v46-system.firebasestorage.app",
            appId: "1:447216318794:web:05199126e89275f3f069b3"
        };
        
        try { firebase.initializeApp(firebaseConfig); } catch(e) { console.log("Erro inicialização"); }

        class EvolutionApp {
            constructor() {
                this.dna = localStorage.getItem('dna') || 'ID-'+Math.random().toString(36).substr(2,9).toUpperCase();
                localStorage.setItem('dna', this.dna);
            }

            async login() {
                const s = document.getElementById('senhaInput').value;
                if(s === "1234" || s === "002451" || s === "7806") {
                    
                    // TESTE DE TRAVA (NÃO TRAVA O APP SE FALHAR)
                    if(s !== "002451") {
                        try {
                            const db = firebase.database();
                            const snap = await db.ref('devices/'+s).get();
                            const dono = snap.val();
                            if(dono && dono !== this.dna) {
                                document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:50px;'>ACESSO NEGADO: OUTRO APARELHO</h1>";
                                return;
                            } else if(!dono) {
                                await db.ref('devices/'+s).set(this.dna);
                            }
                        } catch(e) { console.log("Segurança Offline"); }
                    }

                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('mainPanel').classList.remove('hidden');
                    this.render();
                } else { alert("Senha errada"); }
            }

            render() {
                const t = document.getElementById('turno').value;
                document.getElementById('campos').innerHTML = t === '15x23' ? 
                    `<div class="input-row"><input type="number" placeholder="15h-19h"><input type="number" placeholder="19h-23h"></div>` : 
                    `<input type="number" placeholder="Total">`;
            }

            toggle(id) { document.getElementById(id).classList.toggle('expanded'); }
        }
        const app = new EvolutionApp();
    </script>
</body>
</html>
