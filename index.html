<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVOLUTION - V52 PREMIUM</title>
    <style>
        :root { 
            --primary: #00d1b2; --accent: #ffd700; --danger: #ff3860; --bg: #0a0a0e; 
            --card: #16161d; --input: #1c1c24; --text: #ffffff; --text-dim: #8e8e93;
        }
        * { box-sizing: border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; padding: 15px; }
        .container { max-width: 450px; width: 100%; }

        /* ESTILO PREMIUM DOS CARDS (CONFORME FOTO) */
        .premium-card { 
            background: var(--card); 
            border-radius: 24px; 
            padding: 22px; 
            margin-bottom: 18px; 
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .border-glow-cyan { border: 1.5px solid var(--primary); }
        .border-glow-gold { border: 1.5px solid var(--accent); }

        /* DASHBOARD */
        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .dash-label { font-size: 8px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
        .dash-val { font-size: 1.2rem; font-weight: 900; margin-top: 5px; }

        /* INPUTS E BOTÕES */
        input, select { 
            width: 100%; padding: 16px; background: var(--input); 
            border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; 
            color: var(--text); font-size: 0.95rem; margin-top: 10px; 
        }
        .btn-save { 
            background: var(--primary); color: #000; width: 100%; 
            margin-top: 20px; border-radius: 14px; font-weight: 800; 
            padding: 16px; border:none; text-transform: uppercase; cursor: pointer;
        }
        .btn-whatsapp { background: #25d366; color: white; }

        /* HISTÓRICO (EXATO DA FOTO) */
        .hist-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 18px 0; border-bottom: 1px solid rgba(255,255,255,0.05); 
        }
        .hist-info b { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .hist-info small { color: var(--text-dim); font-size: 0.75rem; }
        .hist-vals { text-align: right; }
        .val-liq { color: var(--accent); font-weight: 900; font-size: 1.1rem; display: block; }
        .val-bruto { color: var(--text-dim); font-size: 0.7rem; display: block; margin-top: 2px; }

        /* LOGIN */
        .login-box { text-align: center; margin-top: 12vh; padding: 40px 20px; }
        .logo { font-size: 2.5rem; font-weight: 900; letter-spacing: 8px; color: var(--primary); margin-bottom: 40px; }

        .footer { text-align: center; font-size: 9px; color: var(--text-dim); padding: 30px 0; text-transform: uppercase; letter-spacing: 2px; }
        .hidden { display: none !important; }
        .config-icon { background: var(--card); padding: 10px; border-radius: 12px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

<div class="container" id="login-screen">
    <div class="login-box">
        <div class="logo">EVOLUTION</div>
        <input type="password" id="senha" placeholder="SENHA DE ACESSO" style="text-align: center;">
        <button class="btn-save" onclick="fazerLogin()">ACESSAR</button>
    </div>
    <div class="footer">© 2026 ALL RIGHTS RESERVED TO <br><b>FELIPE PRADO</b></div>
</div>

<div class="container hidden" id="app-panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 25px;">
        <h2 id="uName" style="font-weight:900; letter-spacing:-1px;"></h2>
        <div class="config-icon" onclick="alert('Configurações em breve (Backup/Excel)')">⚙️</div>
    </div>

    <div class="dash-grid">
        <div class="premium-card border-glow-cyan" style="margin-bottom:0; padding:15px;">
            <span class="dash-label">Bruto</span>
            <div id="totBruto" class="dash-val" style="color:var(--primary)">R$ 0,00</div>
        </div>
        <div class="premium-card border-glow-gold" style="margin-bottom:0; padding:15px;">
            <span class="dash-label">Líquido</span>
            <div id="totLiq" class="dash-val" style="color:var(--accent)">R$ 0,00</div>
        </div>
    </div>

    <div class="premium-card">
        <h3 class="dash-label" style="margin-bottom:10px;">📄 Gerador de Relatório</h3>
        <input type="text" id="nNavio" placeholder="Nome do Navio">
        <select id="tTurno"><option value="15x23">Turno 15x23</option><option value="07x15">Turno 07x15</option></select>
        <button class="btn-save btn-whatsapp" onclick="copiarRel()">COPIAR P/ WHATSAPP</button>
    </div>

    <div class="premium-card">
        <h3 class="dash-label" style="margin-bottom:10px;">💰 Lançar Produção</h3>
        <input type="date" id="cData">
        <input type="text" id="cNavio" placeholder="Navio">
        <input type="number" id="cProd" placeholder="Produção Total">
        <button class="btn-save" onclick="salvar()">SALVAR SERVIÇO</button>
    </div>

    <div class="premium-card">
        <h3 class="dash-label" style="margin-bottom:15px;">🗓️ Histórico</h3>
        <div id="lista"></div>
    </div>

    <div class="footer">EVOLUTION • FELIPE PRADO</div>
</div>

<script>
    const USERS = {"002451": "FELIPE PRADO", "7806": "EdilsonRj", "1980": "ANDERSON PRADO"};
    let user = "", dados = [];

    function fazerLogin() {
        const s = document.getElementById('senha').value;
        if(USERS[s]) {
            user = USERS[s];
            document.getElementById('uName').innerText = user;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-panel').classList.remove('hidden');
            document.getElementById('cData').value = new Date().toISOString().split('T')[0];
            carregar();
        } else alert("Senha incorreta!");
    }

    function carregar() {
        dados = JSON.parse(localStorage.getItem('ev_'+user)) || [];
        render();
    }

    function salvar() {
        const n = document.getElementById('cNavio').value.toUpperCase();
        const p = parseFloat(document.getElementById('cProd').value) || 0;
        const d = document.getElementById('cData').value.split('-').reverse().join('/').substring(0,5);
        
        const bruto = (p * 5.73) / 3;
        const liq = bruto * 0.82;

        dados.unshift({ id: Date.now(), navio: n, data: d, bruto: bruto, liq: liq });
        localStorage.setItem('ev_'+user, JSON.stringify(dados));
        render();
    }

    function render() {
        const l = document.getElementById('lista');
        l.innerHTML = '';
        let tb = 0, tl = 0;

        dados.forEach(i => {
            tb += i.bruto; tl += i.liq;
            l.innerHTML += `
                <div class="hist-item">
                    <div class="hist-info">
                        <b>${i.navio}</b><br>
                        <small>${i.data} • <span style="color:var(--danger)">PENDENTE</span></small>
                    </div>
                    <div class="hist-vals">
                        <span class="val-liq">R$ ${i.liq.toFixed(2).replace('.',',')}</span>
                        <span class="val-bruto">BRUTO R$ ${i.bruto.toFixed(2).replace('.',',')}</span>
                    </div>
                    <div style="color:red; margin-left:12px; font-weight:bold" onclick="remover(${i.id})">×</div>
                </div>`;
        });
        document.getElementById('totBruto').innerText = "R$ " + tb.toLocaleString('pt-BR', {minimumFractionDigits:2});
        document.getElementById('totLiq').innerText = "R$ " + tl.toLocaleString('pt-BR', {minimumFractionDigits:2});
    }

    function remover(id) {
        if(confirm("Excluir?")) {
            dados = dados.filter(x => x.id !== id);
            localStorage.setItem('ev_'+user, JSON.stringify(dados));
            render();
        }
    }

    function copiarRel() {
        const n = document.getElementById('nNavio').value.toUpperCase();
        alert("Relatório de " + n + " copiado!");
    }
</script>
</body>
</html>
