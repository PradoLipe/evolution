<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVOLUTION - V49 PREMIUM</title>
    <style>
        :root { 
            --primary: #00d1b2; --accent: #ffd700; --danger: #ff3860; --success: #48c774;
            --info: #209cee; --bg: #0a0a0e; --card: #16161d; --input: #202026;
            --text: #ffffff; --text-dim: #8e8e93; --border: rgba(255,255,255,0.08);
        }
        * { -webkit-user-select: none; user-select: none; box-sizing: border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
        input, select, textarea { user-select: text; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; transition: 0.3s; }
        .container { max-width: 480px; width: 100%; padding: 20px; position: relative; display: flex; flex-direction: column; }
        
        /* LOGIN PREMIUM */
        .glass-card { background: rgba(255,255,255,0.03); backdrop-filter: blur(15px); border: 1px solid var(--border); border-radius: 30px; padding: 50px 25px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.5); margin-top: 10vh; }
        .evolution-logo { font-size: 2.8rem; font-weight: 900; letter-spacing: 10px; background: linear-gradient(135deg, var(--primary), #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
        
        /* INPUTS */
        input, select { width: 100%; padding: 18px; background: var(--input); border: 1px solid var(--border); border-radius: 16px; color: var(--text); font-size: 1rem; margin-top: 12px; transition: 0.2s; }
        input:focus { border-color: var(--primary); outline: none; background: #25252c; }
        .btn-main { background: var(--primary); color: #000; width: 100%; margin-top: 20px; border-radius: 16px; font-weight: 800; padding: 18px; border:none; cursor:pointer; text-transform: uppercase; letter-spacing: 1px; }

        /* DASHBOARD */
        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .dash-item { background: var(--card); padding: 20px; border-radius: 22px; border: 1px solid var(--border); }
        .dash-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; display: block; }
        .dash-val { font-size: 1.2rem; font-weight: 800; }

        /* SEÇÕES INTERNAS */
        .section-card { background: var(--card); padding: 22px; border-radius: 26px; margin-bottom: 15px; border: 1px solid var(--border); }
        h3 { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }

        /* HISTÓRICO PREMIUM (RESTAURADO) */
        .hist-item { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--border); position: relative; }
        .hist-name { font-weight: 800; font-size: 1rem; text-transform: uppercase; color: #fff; display: block; }
        .hist-date { font-size: 0.8rem; color: var(--text-dim); margin-top: 4px; display: block; }
        .val-liq { color: var(--accent); font-weight: 900; font-size: 1.1rem; display: block; text-align: right; }
        .val-bruto { color: var(--text-dim); font-size: 0.75rem; display: block; text-align: right; margin-top: 2px; }
        .btn-del { color: var(--danger); font-size: 1.4rem; padding-left: 15px; cursor: pointer; opacity: 0.6; }

        /* FOOTER & RIGHTS */
        .footer-rights { text-align: center; padding: 40px 0; opacity: 0.8; }
        .footer-rights p { font-size: 10px; color: var(--text-dim); letter-spacing: 2px; margin-bottom: 5px; }
        .footer-rights .bold { color: var(--primary); font-weight: 700; font-size: 11px; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: var(--card); border: 1px solid var(--border); padding: 30px; border-radius: 30px; width: 100%; max-width: 400px; text-align: center; }
        .toast { position: fixed; bottom: 30px; background: var(--primary); color: #000; padding: 12px 25px; border-radius: 50px; font-weight: 800; z-index: 2000; display: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="modal" id="modalConfig">
    <div class="modal-content">
        <h3 style="color:var(--primary);">Configurações</h3>
        <button class="btn-main" onclick="exportarExcel()" style="background:var(--success); color:#fff;">📊 Exportar Planilha Excel</button>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px;">
            <button class="btn-main" onclick="exportarJSON()" style="font-size:0.7rem;">📤 Backup</button>
            <button class="btn-main" onclick="importarJSON()" style="font-size:0.7rem;">📥 Restaurar</button>
        </div>
        <button onclick="fecharModal('modalConfig')" style="background:none; border:none; color:var(--danger); margin-top:20px; font-weight:bold;">VOLTAR</button>
    </div>
</div>

<div class="container" id="login-screen">
    <div class="glass-card">
        <div class="evolution-logo">EVOLUTION</div>
        <p style="color: var(--text-dim); font-size: 0.75rem; margin-bottom: 40px; letter-spacing: 4px;">SYSTEM ADMINISTRATION</p>
        
        <input type="password" id="senhaInput" placeholder="DIGITE SUA SENHA" style="text-align:center;">
        <button class="btn-main" onclick="login()">ACESSAR PAINEL</button>
    </div>
    
    <div class="footer-rights">
        <p>© 2026 ALL RIGHTS RESERVED TO</p>
        <div class="bold">FELIPE PRADO</div>
    </div>
</div>

<div class="container hidden" id="main-panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 30px; padding-top:10px;">
        <div>
            <p style="font-size: 9px; color: var(--primary); font-weight: 800; letter-spacing: 2px;">BEM-VINDO,</p>
            <h2 id="userName" style="font-size: 1.4rem; font-weight: 900; letter-spacing: -0.5px;">...</h2>
        </div>
        <div style="background: var(--card); padding: 12px; border-radius: 18px; border: 1px solid var(--border); cursor:pointer;" onclick="abrirModal('modalConfig')">⚙️</div>
    </div>

    <div class="dash-grid">
        <div class="dash-item"><span class="dash-label">Bruto Total</span><div id="dashTotalBruto" style="color:var(--info);" class="dash-val">R$ 0,00</div></div>
        <div class="dash-item"><span class="dash-label">Líquido</span><div id="dashTotalLiquido" style="color:var(--accent);" class="dash-val">R$ 0,00</div></div>
    </div>

    <div class="section-card">
        <h3>💰 Lançar Produção</h3>
        <input type="date" id="dataCalc">
        <input type="text" id="navioCalc" placeholder="Nome do Navio">
        <div style="display:flex; gap:10px;">
            <select id="turnoCalc" onchange="ajustarCalc()"><option value="07x15">Manhã (07x15)</option><option value="15x23" selected>Tarde (15x23)</option><option value="23x07">Noite (23x07)</option></select>
        </div>
        <div id="camposCalc"></div>
        <button class="btn-main" onclick="calcularESalvar()">SALVAR NO HISTÓRICO</button>
    </div>

    <div class="section-card">
        <h3>📅 Histórico de Serviços</h3>
        <div id="listaHist"></div>
    </div>

    <div class="footer-rights">
        <p>EVOLUTION PREMIUM V49</p>
        <div class="bold">FELIPE PRADO</div>
    </div>
</div>

<script>
    const USERS = {"002451": "FELIPE PRADO", "7806": "EdilsonRj", "1980": "ANDERSON PRADO", "2026": "FABRICIO DIAS", "302466": "RODRIGO COSTA", "3373": "RICARDO PRADO", "2912": "JOHNY"};
    let logado = "", todosDados = [];
    const $ = id => document.getElementById(id);

    function fMoeda(v) { return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
    function toast(m){ const t=$('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',3000); }
    function abrirModal(id) { $(id).style.display = 'flex'; }
    function fecharModal(id) { $(id).style.display = 'none'; }

    function login() {
        const key = $('senhaInput').value;
        if(USERS[key]) {
            logado = USERS[key];
            $('userName').textContent = logado;
            $('login-screen').classList.add('hidden');
            $('main-panel').classList.remove('hidden');
            carregarSistema();
        } else { alert("Chave de acesso incorreta."); }
    }

    function carregarSistema() {
        todosDados = JSON.parse(localStorage.getItem('hist_' + logado)) || [];
        renderizarHist(); atualizarDash(); ajustarCalc();
        $('dataCalc').value = new Date().toISOString().split('T')[0];
    }

    function ajustarCalc() {
        const t = $('turnoCalc').value;
        $('camposCalc').innerHTML = t === "15x23" ? '<input type="number" id="t1" placeholder="Produção 15h-19h"><input type="number" id="t2" placeholder="Produção 20h-23h">' : '<input type="number" id="tGeral" placeholder="Produção Total">';
    }

    function calcularESalvar() {
        const tur = $('turnoCalc').value;
        let b = 0;
        if(tur === "15x23") { b = ((parseInt($('t1').value)||0)*5.73) + ((parseInt($('t2').value)||0)*6.88); }
        else { b = (parseInt($('tGeral').value)||0) * 5.73; }
        todosDados.unshift({ id: Date.now(), data: $('dataCalc').value.split('-').reverse().join('/').substring(0,5), navio: ($('navioCalc').value||"S/N").toUpperCase(), bruto: b/3, liquido: (b/3)*0.82, pago: false });
        localStorage.setItem('hist_'+logado, JSON.stringify(todosDados));
        renderizarHist(); atualizarDash(); toast("Serviço salvo com sucesso!");
    }

    function renderizarHist() {
        const c = $('listaHist'); c.innerHTML = '';
        todosDados.forEach(i => {
            const d = document.createElement('div'); d.className='hist-item';
            d.innerHTML = `
                <div>
                    <span class="hist-name">${i.navio}</span>
                    <span class="hist-date">${i.data} • <span style="color:${i.pago?var(--success):var(--danger)}; font-weight:bold; font-size:0.7rem;" onclick="alternar(${i.id})">${i.pago?'RECEBIDO':'PENDENTE'}</span></span>
                </div>
                <div style="display:flex; align-items:center;">
                    <div>
                        <span class="val-liq">${fMoeda(i.liquido)}</span>
                        <span class="val-bruto">BRUTO ${fMoeda(i.bruto)}</span>
                    </div>
                    <span class="btn-del" onclick="remover(${i.id})">×</span>
                </div>
            `;
            c.appendChild(d);
        });
    }

    function alternar(id) {
        const idx = todosDados.findIndex(i => i.id === id);
        todosDados[idx].pago = !todosDados[idx].pago;
        localStorage.setItem('hist_'+logado, JSON.stringify(todosDados));
        renderizarHist(); atualizarDash();
    }

    function remover(id) {
        if(confirm("Deseja remover este serviço do histórico?")) {
            todosDados = todosDados.filter(i => i.id !== id);
            localStorage.setItem('hist_'+logado, JSON.stringify(todosDados));
            renderizarHist(); atualizarDash();
        }
    }

    function atualizarDash() {
        const b = todosDados.reduce((a,x)=>a+x.bruto,0);
        const l = todosDados.reduce((a,x)=>a+x.liquido,0);
        $('dashTotalBruto').textContent = fMoeda(b);
        $('dashTotalLiquido').textContent = fMoeda(l);
    }

    function exportarExcel() {
        let csv = "Data;Navio;Bruto;Liquido;Status\n";
        todosDados.forEach(i => { csv += `${i.data};${i.navio};${i.bruto.toFixed(2)};${i.liquido.toFixed(2)};${i.pago?'Pago':'Pendente'}\n`; });
        const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Evolution_Export.csv`;
        link.click();
    }
    function exportarJSON() { navigator.clipboard.writeText(JSON.stringify(todosDados)); alert("Backup copiado!"); }
    function importarJSON() { 
        const code = prompt("Cole seu código de backup:"); 
        if(code) { todosDados = JSON.parse(code); localStorage.setItem('hist_'+logado, code); carregarSistema(); }
    }
</script>
</body>
</html>
