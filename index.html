<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVOLUTION - V48 PREMIUM</title>
    <style>
        :root { 
            --primary: #00d1b2; --accent: #ffd700; --danger: #ff3860; --success: #48c774;
            --info: #209cee; --bg: #0f0f13; --card: #1a1a20; --input: #25252a;
            --text: #ffffff; --text-dim: #a0a0a5; --border: rgba(255,255,255,0.05);
        }
        [data-theme="light"] {
            --bg: #f4f4f9; --card: #ffffff; --input: #ececef; --text: #1c1c1e; --text-dim: #6e6e73; --border: rgba(0,0,0,0.1);
        }
        * { -webkit-user-select: none; user-select: none; box-sizing: border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
        input, select, textarea { user-select: text; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 15px; min-height: 100vh; display: flex; justify-content: center; }
        .container { max-width: 480px; width: 100%; position: relative; display: flex; flex-direction: column; }
        
        /* DASHBOARD */
        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        .dash-item { background: var(--card); padding: 15px; border-radius: 16px; border: 1px solid var(--border); }
        .dash-label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 4px; display: block; }
        .dash-val { font-size: 1.1rem; font-weight: 800; }

        /* SEÇÕES */
        .section-card { background: var(--card); padding: 20px; border-radius: 20px; margin-bottom: 15px; border: 1px solid var(--border); }
        h3 { font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 15px; display: flex; justify-content: space-between; }

        /* HISTÓRICO (RESTAURADO IGUAL À FOTO) */
        .hist-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--border); position: relative; }
        .hist-info { display: flex; flex-direction: column; gap: 4px; }
        .hist-name { font-weight: 800; font-size: 0.95rem; text-transform: uppercase; }
        .hist-date { font-size: 0.75rem; color: var(--text-dim); }
        .hist-values { text-align: right; }
        .val-liq { color: var(--accent); font-weight: 800; font-size: 1rem; display: block; }
        .val-bruto { color: var(--text-dim); font-size: 0.7rem; text-decoration: none; display: block; }
        .btn-del { color: var(--danger); font-size: 1.2rem; padding: 0 10px; cursor: pointer; }

        /* INPUTS */
        input, select { width: 100%; padding: 14px; background: var(--input); border: 1px solid transparent; border-radius: 12px; color: var(--text); font-size: 0.95rem; margin-top: 8px; }
        .btn-main { background: var(--primary); color: #000; width: 100%; margin-top: 15px; border-radius: 12px; font-weight: 700; padding: 14px; border:none; cursor:pointer; text-transform: uppercase; }

        /* CONFIGURAÇÕES ABA (RESTAURADA) */
        .config-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding: 10px 0; }
        .config-content { padding-top: 15px; display: none; }
        .config-btn-row { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 15px; }

        /* MODAIS */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: var(--card); border: 1px solid var(--border); padding: 25px; border-radius: 20px; width: 100%; max-width: 380px; text-align: center; }

        .badge { font-size: 0.65rem; padding: 3px 8px; border-radius: 6px; font-weight: 800; margin-top: 5px; display: inline-block; }
        .badge-pend { background: rgba(255,56,96,0.1); color: var(--danger); border: 1px solid var(--danger); }
        .badge-ok { background: rgba(72,199,116,0.1); color: var(--success); border: 1px solid var(--success); }
        .toast { position: fixed; bottom: 30px; background: var(--primary); color: #000; padding: 12px 25px; border-radius: 50px; font-weight: 800; z-index: 2000; display: none; }
        .hidden { display: none !important; }
    </style>
</head>
