    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
        
        :root {
            --primary: #00d4ff;
            --primary-glow: rgba(0, 212, 255, 0.4);
            --secondary: #7000ff;
            --accent: #ffd700;
            --danger: #ff3860;
            --success: #00d9a6;
            --warning: #ffb800;
            --info: #00b4d8;
            --bg: #0a0e27;
            --surface: rgba(255, 255, 255, 0.03);
            --surface-elevated: rgba(255, 255, 255, 0.06);
            --glass: rgba(20, 25, 50, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --text: #f0f2ff;
            --text-secondary: #8b92b4;
            --text-muted: #4a5070;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 0 40px rgba(0, 212, 255, 0.1);
            --gradient-primary: linear-gradient(135deg, #00d4ff 0%, #7000ff 100%);
            --gradient-success: linear-gradient(135deg, #00d9a6 0%, #00b4d8 100%);
            --gradient-gold: linear-gradient(135deg, #ffd700 0%, #ffb800 100%);
            --radius: 16px;
            --radius-sm: 12px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        body.light-mode {
            --bg: #f5f7fa;
            --surface: rgba(255, 255, 255, 0.7);
            --surface-elevated: rgba(255, 255, 255, 0.9);
            --glass: rgba(255, 255, 255, 0.8);
            --border: rgba(0, 0, 0, 0.08);
            --text: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --shadow-glow: 0 0 40px rgba(0, 212, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html { scroll-behavior: smooth; touch-action: manipulation; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.5s ease, color 0.3s ease;
            position: relative;
            -webkit-font-smoothing: antialiased;
            padding-bottom: var(--safe-bottom);
        }

        .ambient-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
            will-change: transform;
        }
        
        .ambient-bg::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 212, 255, 0.03) 0%, transparent 50%);
            animation: rotate 60s linear infinite;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 100px;
        }

        /* LOGIN SCREEN */
        .login-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            background: radial-gradient(circle at center, #151b3d 0%, #0a0e27 100%);
            transition: opacity 0.4s ease, transform 0.4s ease;
            padding: 16px;
        }

        .login-screen.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.1);
        }

        .login-container {
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-hero {
            text-align: center;
            margin-bottom: 24px;
            position: relative;
        }

        .sindicato-emblem {
            width: 100px;
            height: 100px;
            margin: 0 auto 16px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--glass);
            border: 2px solid rgba(0, 212, 255, 0.2);
            border-radius: 24px;
            backdrop-filter: blur(8px);
            box-shadow: 
                0 0 40px rgba(0, 212, 255, 0.15),
                inset 0 0 40px rgba(0, 212, 255, 0.05);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .sindicato-emblem::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 24px;
            background: var(--gradient-primary);
            opacity: 0.3;
            z-index: -1;
            filter: blur(12px);
        }

        .sindicato-icon {
            width: 55px;
            height: 55px;
            filter: drop-shadow(0 4px 15px rgba(0, 0, 0, 0.3));
        }

        .login-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 6px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .login-subtitle {
            color: var(--text-secondary);
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            opacity: 0.9;
        }

        .login-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .pin-display {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .pin-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: transparent;
            transition: all 0.2s ease;
        }

        .pin-dot.active {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
            transform: scale(1.1);
        }

        .pin-dot.error {
            background: var(--danger);
            border-color: var(--danger);
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .key-btn {
            aspect-ratio: 1.2;
            border: none;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.1s ease;
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
            position: relative;
            overflow: hidden;
        }

        .key-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .key-btn:active {
            transform: scale(0.96);
            background: var(--primary);
            color: var(--bg);
        }

        .key-btn:active::before {
            opacity: 1;
        }

        .key-btn.action {
            background: var(--gradient-primary);
            color: white;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
        }

        .key-btn.delete {
            color: var(--danger);
            background: rgba(255, 56, 96, 0.1);
        }

        .login-footer {
            margin-top: 24px;
            text-align: center;
            opacity: 0.5;
        }

        .login-footer p {
            font-size: 0.6rem;
            letter-spacing: 2px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .sync-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .sync-indicator.visible {
            opacity: 1;
        }

        .sync-indicator.error {
            color: var(--danger);
        }

        .sync-indicator.synced {
            color: var(--success);
        }

        .sync-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* HEADER */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 12px 16px;
            background: rgba(10, 14, 39, 0.85);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        body.light-mode .app-header {
            background: rgba(245, 247, 250, 0.85);
        }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px 6px 6px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .user-pill:active {
            transform: scale(0.98);
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.75rem;
            color: white;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-info h3 {
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .vip-badge {
            font-size: 0.55rem;
            background: var(--gradient-gold);
            color: #0a0e27;
            padding: 1px 6px;
            border-radius: 6px;
            font-weight: 800;
            letter-spacing: 0.5px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
            animation: pulse-gold 2s infinite;
        }

        @keyframes pulse-gold {
            0%, 100% { opacity: 0.8; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .user-info span.status-text {
            font-size: 0.6rem;
            color: var(--success);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-dot {
            width: 5px;
            height: 5px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
        }

        .icon-btn:active {
            transform: scale(0.95);
            background: var(--primary);
            color: white;
        }

        .icon-btn.admin-btn {
            background: rgba(255, 215, 0, 0.1);
            border-color: rgba(255, 215, 0, 0.3);
            color: var(--accent);
        }

        /* CONTENT */
        .app-content {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* DASHBOARD */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 4px;
        }

        .stat-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            position: relative;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .stat-card:active {
            transform: scale(0.98);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--gradient-primary);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .stat-card.bruto::before { background: var(--info); opacity: 1; }
        .stat-card.liquido::before { background: var(--gradient-gold); opacity: 1; }
        .stat-card.pendente::before { background: var(--danger); opacity: 1; }
        .stat-card.pago::before { background: var(--success); opacity: 1; }

        .stat-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 2px;
        }

        .stat-card.bruto .stat-value { color: var(--info); }
        .stat-card.liquido .stat-value { color: var(--accent); }
        .stat-card.pendente .stat-value { color: var(--danger); }
        .stat-card.pago .stat-value { color: var(--success); }

        .stat-meta {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* MODAL ADMIN OTIMIZADO PARA MOBILE VERTICAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: none;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--bg);
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            position: sticky;
            top: 0;
            padding: 16px 20px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            flex-shrink: 0;
        }

        .modal-title {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
        }

        .modal-close {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 1.2rem;
        }

        .modal-close:active {

        /* ADMIN SECTIONS */

            background: var(--surface);
            border: 1px solid var(--border);

            margin-bottom: 16px;

            grid-template-columns: 1fr;

            margin-bottom: 0;

        /* USER LIST OTIMIZADA */

        .user-item-status {
            display: flex;

            gap: 8px;
            flex-wrap: wrap;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-indicator.active { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .status-indicator.blocked { background: var(--danger); }

        /* BOTÕES DE AÇÃO */
        .user-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
        }

        @media (min-width: 480px) {
            .user-actions {
                width: auto;
                grid-template-columns: repeat(4, auto);
            }
        }

        .btn-action {
            padding: 10px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        .btn-action.vip.active {
            background: rgba(255, 215, 0, 0.2);
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-action.block {
            color: var(--danger);
            border-color: rgba(255, 56, 96, 0.3);
        }

        .btn-action.block:not(.blocked) {
            color: var(--success);
            border-color: rgba(0, 217, 166, 0.3);
        }

        .btn-action.delete {
            color: var(--danger);
            border-color: rgba(255, 56, 96, 0.3);
        }

        .btn-action:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* BOTÕES PRINCIPAIS */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;

        }

            transform: scale(0.98);

        .btn-primary {
            background: var(--gradient-primary);

            color: white;
            box-shadow: 0 4px 15px rgba(0, 217, 166, 0.3);
        }

        .btn-glass {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-danger {
            background: rgba(255, 56, 96, 0.1);
            color: var(--danger);
            border: 1px solid rgba(255, 56, 96, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* FOOTER */
        .app-footer {
            margin-top: auto;
            padding: 20px 16px;
            text-align: center;
            border-top: 1px solid var(--border);
            background: var(--surface);
        }

        .footer-brand {
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 4px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;

        .footer-copy {

        .hidden { display: none !important; }

        .mt-2 { margin-top: 8px; }
        .mt-3 { margin-top: 12px; }
        .mt-4 { margin-top: 16px; }

        /* TOAST */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            pointer-events: none;
            width: 90%;
            max-width: 320px;
        }

        .toast {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: slideDownToast 0.4s ease;
        }

        @keyframes slideDownToast {
            from { transform: translate(-50%, -100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        /* MODAL PADRÃO (NÃO ADMIN) */
        .modal-overlay.standard .modal-content {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 24px;
            width: 90%;
            max-width: 420px;
            max-height: 85vh;
            height: auto;
            margin: auto;
            transform: scale(0.9);
        }

        .modal-overlay.standard.active .modal-content {
            transform: scale(1);
        }

        /* CONFIRM DELETE MODAL */
        .confirm-modal {
            text-align: center;
            padding: 40px 20px;
        }

        .confirm-modal-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .confirm-modal-text {
            font-size: 1rem;
            color: var(--text);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .confirm-modal-subtext {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .confirm-modal-actions {
            display: flex;
            gap: 12px;
        }

        .confirm-modal-actions .btn {
            flex: 1;
        }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>
    <div class="toast-container" id="toastContainer"></div>

    <!-- TELA DE LOGIN -->
    <div class="login-screen" id="loginScreen">
        <div class="login-container">
            <div class="login-hero">
                <div class="sindicato-emblem">
                    <svg class="sindicato-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M50 8 L85 25 L85 60 Q50 92 15 60 L15 25 Z" stroke="url(#grad1)" stroke-width="3" fill="rgba(0, 212, 255, 0.1)"/>
                        <rect x="32" y="30" width="36" height="40" rx="4" stroke="url(#grad1)" stroke-width="2.5" fill="none"/>
                        <line x1="38" y1="40" x2="62" y2="40" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round"/>
                        <line x1="38" y1="50" x2="62" y2="50" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
                        <line x1="38" y1="60" x2="52" y2="60" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
                        <circle cx="68" cy="68" r="10" fill="var(--success)" fill-opacity="0.2" stroke="var(--success)" stroke-width="2"/>
                        <path d="M64 68 L67 71 L72 65" stroke="var(--success)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                        <defs>
                            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#7000ff;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                
                <h1 class="login-title">EVOLUTION</h1>
                <p class="login-subtitle">Controle e Registro de Produção</p>
            </div>

            <div class="login-card">
                <div class="pin-display" id="pinDisplay">
                    <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
                    <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
                </div>

                <div class="keypad">
                    <button class="key-btn" onclick="app.addDigit(1)">1</button>
                    <button class="key-btn" onclick="app.addDigit(2)">2</button>

                    <button class="key-btn" onclick="app.addDigit(4)">4</button>
                    <button class="key-btn" onclick="app.addDigit(5)">5</button>
                    <button class="key-btn" onclick="app.addDigit(6)">6</button>
                    <button class="key-btn" onclick="app.addDigit(7)">7</button>

                    <button class="key-btn" onclick="app.addDigit(0)">0</button>

                <div class="sync-indicator" id="syncIndicator">
                    <div class="sync-spinner"></div>
                    <span id="syncText">Conectando...</span>

            <div class="login-footer">
                <p>© 2026 Felipe Prado Systems</p>

    <!-- APP PRINCIPAL -->
    <div class="app-container hidden" id="mainApp">
        
        <header class="app-header">
            <div class="user-pill" onclick="app.openModal('profileModal')">
                <div class="avatar" id="userAvatar">FP</div>
                <div class="user-info">

            <div class="header-actions">

    <!-- MODAL ADMIN (FULL SCREEN OTIMIZADO) -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Painel Admin</h3>
                <button class="modal-close" onclick="app.closeModal('adminModal')">✕</button>
            </div>

                <!-- Conteúdo carregado dinamicamente -->

    <!-- MODAL CONFIRMAR EXCLUSÃO -->
    <div class="modal-overlay standard" id="confirmDeleteModal">
        <div class="modal-content">
            <div class="confirm-modal">
                <div class="confirm-modal-icon">🗑️</div>
                <div class="confirm-modal-text">Excluir usuário?</div>
                <div class="confirm-modal-subtext" id="confirmDeleteText">Esta ação não pode ser desfeita.</div>
                <div class="confirm-modal-actions">
                    <button class="btn btn-glass" onclick="app.closeModal('confirmDeleteModal')">Cancelar</button>
                    <button class="btn btn-danger" onclick="app.executeDeleteUser()">Excluir</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL PADRÃO -->
    <div class="modal-overlay standard" id="profileModal" onclick="app.closeModalOnOverlay(event, 'profileModal')">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Perfil</h3>
                <button class="modal-close" onclick="app.closeModal('profileModal')">✕</button>
            </div>
            <div class="modal-body" style="text-align: center;">
                <div class="avatar" style="width: 80px; height: 80px; font-size: 2rem; margin: 0 auto 16px;">FP</div>
                <button class="btn btn-danger mt-4" onclick="app.logout()">Sair</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== CONFIGURAÇÃO FIREBASE ====================
        const firebaseConfig = {
            apiKey: "AIzaSyBEIQTvTguTmvq_I3DdyO0XsWGu5lYb6gw",
            authDomain: "evolution-v50-final.firebaseapp.com",
            projectId: "evolution-v50-final",
            storageBucket: "evolution-v50-final.firebasestorage.app",
            messagingSenderId: "657178030818",
            appId: "1:657178030818:web:06cbbb4949c761f91a64bb"
        };

        // Inicializar Firebase imediatamente
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const db = firebase.firestore();
        const auth = firebase.auth();
        
        // Configurar cache persistente com tamanho ilimitado
        db.settings({
            cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED
        });

        // Habilitar persistência offline
        db.enablePersistence({ synchronizeTabs: true })
            .then(() => console.log('Persistência offline ativada'))
            .catch(err => console.warn('Persistência não disponível:', err));

        const DEFAULT_USERS = {
            "002451": { name: "FELIPE PRADO", code: "002451", blocked: false, isAdmin: true, vip: true },
            "7806": { name: "EDILSON JR", code: "7806", blocked: false },
            "1980": { name: "ANDERSON PRADO", code: "1980", blocked: false },
            "2026": { name: "FABRICIO DIAS", code: "2026", blocked: false },
            "302466": { name: "RODRIGO COSTA", code: "302466", blocked: false },
            "3373": { name: "RICARDO PRADO", code: "3373", blocked: false },
            "2912": { name: "JOHNY", code: "2912", blocked: false },
            "0420": { name: "FERNANDO SOARES", code: "0420", blocked: false }
        };

        const ADMIN_ID = "002451";

        // ==================== CLASSE PRINCIPAL OTIMIZADA ====================
        class EvolutionV50 {
            constructor() {
                this.users = { ...DEFAULT_USERS };
                this.currentUser = null;
                this.currentUserId = null;
                this.pinValue = '';
                this.deviceId = this.getOrCreateDeviceId();
                this.isAdmin = false;
                this.firebaseReady = false;
                this.syncStatus = 'disconnected';
                this.pendingDeleteUserCode = null;
                this.usersListener = null;
                
                this.init();
            }

            getOrCreateDeviceId() {
                let id = localStorage.getItem('evo_device_v50');
                if (!id) {
                    id = 'V50-' + Math.random().toString(36).substr(2, 9).toUpperCase();
                    localStorage.setItem('evo_device_v50', id);
                }
                return id;
            }

            async init() {
                this.loadTheme();
                
                // TELA DE LOGIN IMEDIATA
                this.showLoginScreen();
                
                // INICIAR FIREBASE EM PARALELO (NÃO BLOQUEIA)
                this.initializeFirebase();
            }

            showLoginScreen() {
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('mainApp').classList.add('hidden');
            }

            async initializeFirebase() {
                const indicator = document.getElementById('syncIndicator');
                const text = document.getElementById('syncText');
                
                indicator.classList.add('visible');
                
                try {
                    // Autenticar anônimo
                    await auth.signInAnonymously();
                    
                    // PRÉ-CARREGAR USUÁRIOS DO CACHE PRIMEIRO
                    this.loadUsersFromCache();
                    
                    // DEPOIS SINCRONIZAR COM FIREBASE
                    await this.syncUsersFromFirebase();
                    
                    this.firebaseReady = true;
                    this.syncStatus = 'synced';
                    
                    indicator.classList.remove('error');
                    indicator.classList.add('synced');
                    text.textContent = 'Sincronizado';
                    
                    setTimeout(() => {
                        indicator.classList.remove('visible');
                    }, 2000);
                    
                } catch (error) {
                    console.error('Erro Firebase:', error);
                    this.syncStatus = 'error';
                    indicator.classList.add('error');
                    text.textContent = 'Modo Offline';
                    
                    // Mesmo offline, carregar do cache
                    this.loadUsersFromCache();
                }
            }

            loadUsersFromCache() {
                const cached = localStorage.getItem('evo_users_cache_v50');
                if (cached) {
                    try {
                        const parsed = JSON.parse(cached);
                        // Mesclar com defaults, mantendo admin protegido
                        this.users = { 
                            ...DEFAULT_USERS,
                            ...parsed,
                            [ADMIN_ID]: { ...DEFAULT_USERS[ADMIN_ID], ...parsed[ADMIN_ID] }
                        };
                    } catch(e) {}
                }
            }

            saveUsersToCache() {
                localStorage.setItem('evo_users_cache_v50', JSON.stringify(this.users));
            }

            async syncUsersFromFirebase() {
                try {
                    // Usar get em vez de onSnapshot inicial para ser mais rápido
                    const snapshot = await db.collection('users').get({ source: 'server' });
                    
                    if (!snapshot.empty) {
                        snapshot.forEach(doc => {
                            if (doc.id !== ADMIN_ID) {
                                this.users[doc.id] = doc.data();
                            }
                        });
                        this.saveUsersToCache();
                    } else {
                        // Upload inicial se vazio
                        await this.uploadDefaultUsers();
                    }
                    
                    // Configurar listener para atualizações em tempo real
                    this.setupUsersListener();
                    
                } catch (error) {
                    console.warn('Erro sync Firebase, usando cache:', error);
                }
            }

            async uploadDefaultUsers() {
                const batch = db.batch();
                Object.values(DEFAULT_USERS).forEach(user => {
                    const ref = db.collection('users').doc(user.code);
                    batch.set(ref, { ...user, createdAt: new Date() });
                });
                await batch.commit();
            }

            setupUsersListener() {
                if (this.usersListener) return;
                
                this.usersListener = db.collection('users')
                    .onSnapshot(snapshot => {
                        let changed = false;
                        snapshot.docChanges().forEach(change => {
                            if (change.type === 'added' || change.type === 'modified') {
                                if (change.doc.id !== ADMIN_ID) {
                                    this.users[change.doc.id] = change.doc.data();
                                    changed = true;
                                }
                            }
                        });
                        
                        if (changed) {
                            this.saveUsersToCache();
                            // Se modal admin estiver aberto, atualizar
                            if (document.getElementById('adminModal').classList.contains('active')) {
                                this.renderAdminUsers();
                            }
                        }
                    }, err => {
                        console.warn('Erro listener:', err);
                    });
            }

            // ==================== LOGIN ====================

            addDigit(digit) { 
                if (this.pinValue.length < 6) { 
                    this.pinValue += digit; 
                    this.updatePinDisplay(); 
                    if (this.pinValue.length === 6) setTimeout(() => this.login(), 50);
                } 
            }

            removeDigit() { 
                this.pinValue = this.pinValue.slice(0, -1); 
                this.updatePinDisplay(); 
            }

            updatePinDisplay() {
                const dots = document.querySelectorAll('.pin-dot');
                dots.forEach((dot, index) => {
                    if (index < this.pinValue.length) { 
                        dot.classList.add('active'); 
                        dot.classList.remove('error'); 
                    } else { 
                        dot.classList.remove('active', 'error'); 
                    }
                });
            }

            showPinError() {
                const dots = document.querySelectorAll('.pin-dot');
                dots.forEach(dot => { 
                    dot.classList.remove('active'); 
                    dot.classList.add('error'); 
                });
                setTimeout(() => { 
                    this.pinValue = ''; 
                    this.updatePinDisplay(); 
                }, 500);
                this.showToast('Chave incorreta', 'error');
            }

            async login() {
                const code = this.pinValue;
                const userData = this.users[code];

                if (!userData) { 
                    this.showPinError();
                    return; 
                }

                if (code !== ADMIN_ID && userData.deviceId && userData.deviceId !== this.deviceId) {
                    this.showToast('Dispositivo não reconhecido', 'error');
                    this.pinValue = '';
                    this.updatePinDisplay();
                    return;
                }

                if (userData.blocked && code !== ADMIN_ID) {
                    this.showToast('Usuário bloqueado', 'error');
                    this.pinValue = '';
                    this.updatePinDisplay();
                    return;
                }

                // LOGIN IMEDIATO
                this.currentUser = userData.name;
                this.currentUserId = code;
                this.isAdmin = (code === ADMIN_ID);

                this.showMainApp();
                
                // Background ops
                setTimeout(() => {
                    this.updateLastLogin(code);
                }, 100);

                localStorage.setItem('evo_session_v50', btoa(JSON.stringify({ 
                    user: this.currentUser, 
                    code: this.currentUserId, 
                    ts: Date.now() 
                })));

                this.pinValue = '';
            }

            async updateLastLogin(code) {
                if (!this.firebaseReady) return;
                try {
                    await db.collection('users').doc(code).set({
                        lastLogin: new Date(),
                        deviceId: this.deviceId
                    }, { merge: true });
                } catch (e) {}
            }

            showMainApp() {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                
                document.getElementById('userName').firstChild.textContent = this.currentUser + " ";
                document.getElementById('userAvatar').textContent = this.currentUser.substring(0, 2);
                
                const user = this.users[this.currentUserId];
                const isVip = user?.vip || (user?.vipTrialUntil && new Date() < new Date(user.vipTrialUntil));
                document.getElementById('vipBadge').classList.toggle('hidden', !isVip);
                
                if (this.isAdmin) {
                    document.getElementById('btnAdmin').classList.remove('hidden');
                }
            }

            // ==================== ADMIN MODAL OTIMIZADO ====================

            openAdminModal() {
                this.renderAdminContent();
                document.getElementById('adminModal').classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            renderAdminContent() {
                const body = document.getElementById('adminModalBody');
                body.innerHTML = `
                    <div class="admin-section">
                        <button class="admin-toggle-btn" onclick="app.toggleAdminSection('admUsers')">
                            <span>👥 Gerenciar Usuários</span>
                            <span>▼</span>
                        </button>
                        <div id="admUsers" class="admin-toggle-content" style="display: block;">
                            <div class="admin-form-grid single mt-3">
                                <div class="input-group">
                                    <label class="input-label">Novo Usuário</label>
                                    <input type="text" id="newUserName" placeholder="Nome completo" style="text-transform: uppercase;">
                                </div>
                                <div class="input-group">
                                    <input type="text" id="newUserCode" placeholder="PIN de 6 dígitos" maxlength="6" inputmode="numeric">
                                </div>
                            </div>
                            <button class="btn btn-primary mt-3" onclick="app.addNewUser()">
                                ➕ Adicionar Usuário
                            </button>
                            
                            <div class="mt-4">
                                <label class="input-label">Usuários Cadastrados</label>
                                <div class="user-list" id="adminUserList">
                                    ${this.renderUsersListHTML()}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="admin-section">
                        <button class="admin-toggle-btn" onclick="app.toggleAdminSection('admRates')">
                            <span>💲 Configurar Taxas</span>
                            <span>▼</span>
                        </button>
                        <div id="admRates" class="admin-toggle-content">
                            <p style="color: var(--text-secondary); text-align: center; padding: 20px;">
                                Taxas configuradas no sistema
                            </p>
                        </div>
                    </div>
                `;
            }

            renderUsersListHTML() {
                const userArray = Object.values(this.users)
                    .filter(u => u.code !== ADMIN_ID)
                    .sort((a, b) => a.name.localeCompare(b.name));

                if (userArray.length === 0) {
                    return '<div style="text-align: center; color: var(--text-muted); padding: 20px;">Nenhum usuário cadastrado</div>';
                }

                return userArray.map(u => {
                    const isVip = u.vip || (u.vipTrialUntil && new Date() < new Date(u.vipTrialUntil));
                    return `
                        <div class="user-item" id="user-${u.code}">
                            <div class="user-item-info">
                                <div class="user-item-name">
                                    ${u.name}
                                    ${u.isAdmin ? '<span class="user-admin-badge">Admin</span>' : ''}
                                </div>
                                <div class="user-item-code">PIN: ${u.code}</div>
                                <div class="user-last-seen">
                                    ${this.formatLastSeen(u.lastLogin)}
                                </div>
                            </div>
                            <div class="user-actions">
                                <button class="btn-action vip ${isVip ? 'active' : ''}" 
                                        onclick="app.toggleUserVip('${u.code}')"
                                        title="VIP">
                                    💎
                                </button>
                                <button class="btn-action device" 
                                        onclick="app.resetUserDevice('${u.code}')"
                                        title="Resetar Dispositivo">
                                    📱
                                </button>
                                <button class="btn-action block ${u.blocked ? 'blocked' : ''}" 
                                        onclick="app.toggleUserBlock('${u.code}')"
                                        title="${u.blocked ? 'Desbloquear' : 'Bloquear'}">
                                    ${u.blocked ? '🔓' : '🔒'}
                                </button>
                                <button class="btn-action delete" 
                                        onclick="app.confirmDeleteUser('${u.code}')"
                                        title="Excluir">
                                    🗑️
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            renderAdminUsers() {
                const list = document.getElementById('adminUserList');
                if (list) {
                    list.innerHTML = this.renderUsersListHTML();
                }
            }

            toggleAdminSection(id) {
                const el = document.getElementById(id);
                const isVisible = el.style.display === 'block';
                
                // Fechar todos
                document.querySelectorAll('.admin-toggle-content').forEach(c => {
                    c.style.display = 'none';
                });
                
                // Abrir clicado se estava fechado
                if (!isVisible) {
                    el.style.display = 'block';
                }
            }

            // ==================== OPERAÇÕES USUÁRIOS ====================

            async addNewUser() {
                const nameInput = document.getElementById('newUserName');
                const codeInput = document.getElementById('newUserCode');
                const name = nameInput?.value.toUpperCase().trim();
                const code = codeInput?.value.trim();

                if (!name || !code || code.length !== 6) {
                    this.showToast('Preencha nome e PIN de 6 dígitos', 'error');
                    return;
                }

                if (this.users[code]) {
                    this.showToast('PIN já existe', 'error');
                    return;
                }

                const newUser = {
                    name: name,
                    code: code,
                    blocked: false,
                    vip: false,
                    createdAt: new Date().toISOString()
                };

                // Atualização imediata na UI
                this.users[code] = newUser;
                this.saveUsersToCache();
                this.renderAdminUsers();
                
                nameInput.value = '';
                codeInput.value = '';
                
                this.showToast(`${name} adicionado!`, 'success');

                // Sincronização em background
                if (this.firebaseReady) {
                    try {
                        await db.collection('users').doc(code).set(newUser);
                    } catch (e) {
                        console.error('Erro ao salvar no Firebase:', e);
                    }
                }
            }

            async toggleUserBlock(code) {
                const user = this.users[code];
                if (!user) return;

                const newStatus = !user.blocked;
                
                // Atualização imediata
                user.blocked = newStatus;
                this.saveUsersToCache();
                this.renderAdminUsers();
                
                this.showToast(newStatus ? 'Usuário bloqueado' : 'Usuário liberado', 'success');

                if (this.firebaseReady) {
                    try {
                        await db.collection('users').doc(code).update({ blocked: newStatus });
                    } catch (e) {}
                }
            }

            async toggleUserVip(code) {
                const user = this.users[code];
                if (!user) return;
                
                const newStatus = !user.vip;

                user.vip = newStatus;
                this.saveUsersToCache();
                this.renderAdminUsers();
                
                this.showToast(newStatus ? 'VIP ativado' : 'VIP removido', 'success');

                if (this.firebaseReady) {
                    try {
                        await db.collection('users').doc(code).update({ vip: newStatus });
                    } catch (e) {}
                }
            }

            async resetUserDevice(code) {
                const user = this.users[code];
                if (!user) return;
                
                user.deviceId = null;
                this.saveUsersToCache();
                
                this.showToast(`Dispositivo de ${user.name} resetado`, 'success');

                if (this.firebaseReady) {
                    try {
                        await db.collection('users').doc(code).update({ deviceId: null });
                    } catch (e) {}
                }
            }

            confirmDeleteUser(code) {
                const user = this.users[code];
                if (!user) return;
                
                if (user.isAdmin) {
                    this.showToast('Não é possível excluir o admin', 'error');
                    return;
                }
                
                this.pendingDeleteUserCode = code;
                document.getElementById('confirmDeleteText').textContent = 
                    `Tem certeza que deseja excluir ${user.name} permanentemente?`;
                this.openModal('confirmDeleteModal');
            }

            async executeDeleteUser() {
                if (!this.pendingDeleteUserCode) return;
                
                const code = this.pendingDeleteUserCode;
                
                // Remover da memória
                delete this.users[code];
                this.saveUsersToCache();
                
                // Atualizar UI
                this.renderAdminUsers();
                this.closeModal('confirmDeleteModal');
                this.pendingDeleteUserCode = null;
                
                this.showToast('Usuário excluído', 'success');

                // Sincronizar com Firebase
                if (this.firebaseReady) {
                    try {
                        await db.collection('users').doc(code).delete();
                    } catch (e) {
                        console.error('Erro ao excluir do Firebase:', e);
                    }
                }
            }

            formatLastSeen(timestamp) {
                if (!timestamp) return 'Nunca acessou';
                
                try {
                    let date;
                    if (timestamp.toDate) date = timestamp.toDate();
                    else if (typeof timestamp === 'string') date = new Date(timestamp);
                    else if (typeof timestamp === 'number') date = new Date(timestamp);
                    else if (timestamp.seconds) date = new Date(timestamp.seconds * 1000);
                    else return 'Data inválida';
                    
                    return date.toLocaleString('pt-BR', { 
                        day: '2-digit', 
                        month: '2-digit', 
                        hour: '2-digit', 
                        minute: '2-digit' 
                    });
                } catch (e) {
                    return 'Data inválida';
                }
            }

            // ==================== UTILITÁRIOS ====================

            showToast(message, type = 'info') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div'); 
                toast.className = 'toast';
                const colors = { success: 'var(--success)', error: 'var(--danger)', info: 'var(--primary)' };
                toast.style.borderLeft = `3px solid ${colors[type]}`;
                toast.innerHTML = `<span style="color: ${colors[type]};">${type === 'success' ? '✓' : type === 'error' ? '✕' : '•'}</span> ${message}`;
                container.appendChild(toast); 
                setTimeout(() => toast.remove(), 3000);
            }

            openModal(id) {
                const modal = document.getElementById(id);
                if (modal) {
                    modal.classList.add('active');
                    document.body.style.overflow = 'hidden';
                }
            }

            closeModal(id) {
                const modal = document.getElementById(id);
                if (modal) {
                    modal.classList.remove('active');
                    document.body.style.overflow = '';
                }
            }

            closeModalOnOverlay(e, id) {
                if (e.target.id === id) this.closeModal(id);
            }

            toggleTheme() {
                document.body.classList.toggle('light-mode');
                localStorage.setItem('evo_theme_v50', document.body.classList.contains('light-mode') ? 'light' : 'dark');
            }

            loadTheme() {
                if (localStorage.getItem('evo_theme_v50') === 'light') {
                    document.body.classList.add('light-mode');
                }
            }

            logout() {
                if (this.usersListener) {
                    this.usersListener();
                }
                localStorage.removeItem('evo_session_v50');
                location.reload();
            }
        }

        const app = new EvolutionV50();
    </script>
</body>
</html>
