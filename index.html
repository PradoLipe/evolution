<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVOLUTION V46 - COMPLETO</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        
        :root {
            --primary: #00d1b2; --danger: #ff3860; --success: #48c774;
            --bg: #0a0a0e; --card: rgba(22, 22, 29, 0.75); --text: #fff; --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .container { max-width: 480px; margin: 0 auto; padding: 20px; }
        
        /* LOGIN CENTRALIZADO ORIGINAL */
        #loginScreen { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        
        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .dash-card { background: var(--card); padding: 15px; border-radius: 18px; border: 1px solid var(--border); position: relative; }
        .dash-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; border-radius: 4px 0 0 4px; }
        .dash-pend::before { background: var(--danger); } .dash-pago::before { background: var(--success); }
        .dash-val { font-size: 1.1rem; font-weight: 800; margin-top: 5px; }

        /* GRADE DE HORÁRIO 50/50 - FIXA LADO A LADO */
        .input-row { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 10px !important; width: 100% !important; margin-bottom: 12px; }
        input, select { width: 100%; padding: 14px; background: rgba(32, 32, 38, 0.8); border: 1px solid var(--border); border-radius: 12px; color: #fff; outline: none; font-size: 14px; }
        .input-label { display: block; font-size: 10px; color: #8e8e93; margin-bottom: 4px; font-weight: 700; text-transform: uppercase; }

        .btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: var(--primary); color: #000; }
        .btn-success { background: var(--success); color: #fff; }

        .section-card { background: var(--card); border-radius: 20px; margin-bottom: 15px; border: 1px solid var(--border); overflow: hidden; }
        .section-header { padding: 18px 20px; cursor: pointer; display: flex; justify-content: space-between; font-weight: 800; font-size: 0.75rem; }
        .section-content { display: none; padding: 0 20px 20px; }
        .section-card.expanded .section-content { display: block; }

        .hist-item { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container" id="loginScreen">
        <h1 style="color:var(--primary); letter-spacing:5px; margin-bottom: 10px; font-weight: 900;">EVOLUTION</h1>
        <p style="font-size: 9px; color: #8e8e93; letter-spacing: 2px; margin-bottom: 30px;">V46 ULTRA PREMIUM</p>
        <input type="password" id="senhaInput" placeholder="CHAVE DE ACESSO" style="text-align:center; max-width: 280px;">
        <button class="btn btn-primary" style="margin-top:20px; max-width: 280px;" onclick="app.login()">ACESSAR</button>
    </div>

    <div class="container hidden" id="mainPanel">
        <div class="dash-grid">
            <div class="dash-card dash-pend"><div>PENDENTE</div><div class="dash-val" id="dashPend" style="color:var(--danger)">R$ 0,00</div></div>
            <div class="dash-card dash-pago"><div>PAGO</div><div class="dash-val" id="dashPago" style="color:var(--success)">R$ 0,00</div></div>
        </div>

        <div class="section-card" id="secRel">
            <div class="section-header" onclick="app.toggle('secRel')">RELATÓRIO DE PRODUÇÃO<span>▼</span></div>
            <div class="section-content">
                <div style="margin-bottom:12px;"><label class="input-label">Navio</label><input type="text" id="relNavio" style="text-transform:uppercase;"></div>
                <div class="input-row">
                    <div><label class="input-label">Data</label><input type="date" id="relData"></div>
                    <div><label class="input-label">Turno</label><select id="relTurno" onchange="app.render()"><option value="07x15">07x15</option><option value="15x23" selected>15x23</option></select></div>
                </div>
                <div id="camposRel"></div>
                <button class="btn btn-success" onclick="app.copyRel()">COPIAR RELATÓRIO</button>
            </div>
        </div>

        <div class="section-card expanded" id="secLan">
            <div class="section-header" onclick="app.toggle('secLan')">NOVA PRODUÇÃO<span>▼</span></div>
            <div class="section-content">
                <div style="margin-bottom:12px;"><label class="input-label">Navio</label><input type="text" id="calcNavio" style="text-transform:uppercase;"></div>
                <div class="input-row">
                    <div><label class="input-label">Tipo</label><select id="tipo"><option value="normal">Normal</option><option value="feriado">Domingo / Feriado</option></select></div>
                    <div><label class="input-label">Turno</label><select id="turno" onchange="app.render()"><option value="15x23">15x23</option><option value="07x15">07x15</option></select></div>
                </div>
                <div id="camposCalc"></div>
                <button class="btn btn-primary" onclick="app.saveEntry()" style="margin-top:10px;">SALVAR REGISTRO</button>
            </div>
        </div>
        
        <div class="section-card" id="secHis">
            <div class="section-header" onclick="app.toggle('secHis')">HISTÓRICO<span>▼</span></div>
            <div class="section-content"><div id="histList"></div></div>
        </div>
    </div>

    <script>
        class EvolutionApp {
            constructor() {
                this.users = {"002451": "FELIPE PRADO", "7806": "EdilsonJr", "2026": "FABRICIO", "1234": "TESTE"};
                this.entries = [];
            }

            login() {
                const s = document.getElementById('senhaInput').value;
                if(this.users[s]) {
                    this.currentUser = this.users[s];
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('mainPanel').classList.remove('hidden');
                    this.loadData();
                    this.render();
                } else { alert("Chave Incorreta"); }
            }

            loadData() {
                const key = `evo_db_${btoa(this.currentUser)}`;
                this.entries = JSON.parse(localStorage.getItem(key)) || [];
                this.updateUI();
            }

            render() {
                const tc = document.getElementById('turno').value;
                const tr = document.getElementById('relTurno').value;
                
                document.getElementById('camposCalc').innerHTML = tc === '15x23' ? 
                    `<div class="input-row"><div><label class="input-label">15h-19h</label><input type="number" id="p1"></div><div><label class="input-label">19h-23h</label><input type="number" id="p2"></div></div>` : 
                    `<div style="margin-bottom:12px;"><label class="input-label">Total</label><input type="number" id="pt"></div>`;

                document.getElementById('camposRel').innerHTML = tr === '15x23' ? 
                    `<div class="input-row"><div><label class="input-label">15h-19h</label><input type="number" id="rp1"></div><div><label class="input-label">19h-23h</label><input type="number" id="rp2"></div></div>` : 
                    `<div style="margin-bottom:12px;"><label class="input-label">Total</label><input type="number" id="rpt"></div>`;
            }

            saveEntry() {
                const n = document.getElementById('calcNavio').value.toUpperCase();
                if(!n) return alert("Informe o Navio");
                const p1 = parseFloat(document.getElementById('p1')?.value || 0);
                const p2 = parseFloat(document.getElementById('p2')?.value || 0);
                const pt = document.getElementById('pt') ? parseFloat(document.getElementById('pt').value) : (p1 + p2);
                const val = (document.getElementById('tipo').value === 'feriado' ? pt * 8.61 : pt * 5.73) / 3;
                
                this.entries.unshift({ id: Date.now(), navio: n, valor: val, pago: false, data: new Date().toLocaleDateString('pt-BR') });
                localStorage.setItem(`evo_db_${btoa(this.currentUser)}`, JSON.stringify(this.entries));
                this.updateUI();
                alert("Salvo com sucesso!");
            }

            updateUI() {
                let pend = 0, pago = 0;
                document.getElementById('histList').innerHTML = this.entries.map(e => {
                    if(e.pago) pago += e.valor; else pend += e.valor;
                    return `<div class="hist-item"><div><b>${e.navio}</b><br><small>${e.data}</small></div><div style="text-align:right">R$ ${e.valor.toFixed(2)}<br><button onclick="app.togglePago(${e.id})" style="background:none; border:none; color:var(--primary); font-size:10px;">${e.pago?'PAGO':'PENDENTE'}</button></div></div>`;
                }).join('');
                document.getElementById('dashPend').innerText = `R$ ${pend.toFixed(2)}`;
                document.getElementById('dashPago').innerText = `R$ ${pago.toFixed(2)}`;
            }

            togglePago(id) {
                const e = this.entries.find(x => x.id === id);
                if(e) { e.pago = !e.pago; localStorage.setItem(`evo_db_${btoa(this.currentUser)}`, JSON.stringify(this.entries)); this.updateUI(); }
            }

            copyRel() {
                const n = document.getElementById('relNavio').value.toUpperCase();
                const tr = document.getElementById('relTurno').value;
                const p1 = document.getElementById('rp1')?.value || 0;
                const p2 = document.getElementById('rp2')?.value || 0;
                const tot = document.getElementById('rpt') ? document.getElementById('rpt').value : (parseInt(p1) + parseInt(p2));
                let txt = `*${n}*\nData: ${new Date().toLocaleDateString('pt-BR')}\nTurno: ${tr}\n`;
                if(tr === '15x23') txt += `15x19: ${p1}\n19x23: ${p2}\n`;
                txt += `TOTAL: ${tot}\n${this.currentUser}`;
                navigator.clipboard.writeText(txt).then(() => alert("Relatório Copiado!"));
            }

            toggle(id) { document.getElementById(id).classList.toggle('expanded'); }
        }
        const app = new EvolutionApp();
        document.getElementById('relData').value = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
