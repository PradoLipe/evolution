<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SISTEMA EVOLUTION - V34</title>
    <style>
        :root { 
            --primary: #00d1b2; 
            --accent: #ffd700; 
            --danger: #ff3860;
            --success: #48c774;
            --info: #3273dc;
            --bg: #0a0a0f; 
            --card: rgba(26, 26, 30, 0.98);
            --input: #25252a;
        }
        
        * { -webkit-user-select: none; user-select: none; box-sizing: border-box; margin:0; padding:0; }
        input, select { user-select: text; }
        
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%); 
            color: #fff; 
            padding: 10px; 
            min-height: 100vh;
            display: flex; 
            justify-content: center; 
        }
        
        .container { 
            max-width: 480px; 
            width: 100%; 
            background: var(--card); 
            padding: 25px; 
            border-radius: 24px; 
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        h2 { 
            text-align: center; 
            color: var(--primary); 
            text-transform: uppercase; 
            letter-spacing: 3px;
            font-size: 1.4rem;
            margin-bottom: 25px;
        }
        
        h3 { 
            font-size: 1rem; 
            margin: 25px 0 15px; 
            color: #fff; 
            display: flex; 
            align-items: center; 
            gap: 8px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--primary);
        }
        
        label { 
            display: block; 
            margin-top: 15px; 
            font-weight: 600;
            color: #888; 
            font-size: 10px; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        input, select { 
            width: 100%; 
            padding: 14px; 
            margin-top: 6px; 
            border: 2px solid #333; 
            background: var(--input); 
            color: white; 
            border-radius: 12px; 
            font-size: 16px; 
            outline: none;
            transition: all 0.3s;
        }
        
        input:focus, select:focus { border-color: var(--primary); }
        
        button { 
            width: 100%; 
            padding: 16px; 
            margin-top: 15px; 
            border: none; 
            border-radius: 12px; 
            font-size: 13px; 
            cursor: pointer; 
            font-weight: bold; 
            text-transform: uppercase; 
            transition: transform 0.2s;
        }
        
        button:active { transform: scale(0.98); }
        
        .btn-main { background: var(--primary); color: #000; }
        .btn-whatsapp { background: #25d366; color: #fff; }
        .btn-calc { background: var(--accent); color: #000; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-secondary { background: #333; color: #fff; font-size: 11px; padding: 12px; }
        .btn-info { background: var(--info); color: #fff; }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .section-card { 
            background: rgba(40,40,45,0.6); 
            padding: 20px; 
            border-radius: 18px; 
            border: 1px solid #333;
            margin-top: 20px; 
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .stat-box {
            background: rgba(0,0,0,0.3);
            padding: 15px 10px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #333;
        }
        
        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary);
        }
        
        .stat-value.bruto { color: var(--info); }
        .stat-value.liquido { color: var(--accent); }
        
        .stat-label {
            font-size: 9px;
            color: #888;
            text-transform: uppercase;
            margin-top: 5px;
        }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 11px; 
            margin-top: 10px; 
        }
        
        th { 
            color: var(--primary); 
            padding: 10px 5px; 
            text-align: left; 
            border-bottom: 2px solid #333;
            font-size: 9px;
            text-transform: uppercase;
        }
        
        td { 
            padding: 10px 5px; 
            border-bottom: 1px solid #222;
            vertical-align: middle;
        }
        
        .val-bruto { 
            font-size: 10px; 
            color: var(--info); 
            display: block;
        }
        
        .val-liquido { 
            font-size: 12px; 
            color: var(--accent); 
            font-weight: bold; 
            display: block;
        }
        
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 9px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .badge-pendente { background: rgba(255,193,7,0.2); color: #ffc107; border: 1px solid #ffc107; }
        .badge-pago { background: rgba(72,199,116,0.2); color: var(--success); border: 1px solid var(--success); }
        
        .resumo-financeiro { 
            background: linear-gradient(135deg, rgba(0,0,0,0.6), #1a1a1a);
            padding: 20px; 
            border-radius: 16px; 
            margin-top: 20px; 
            border: 1px solid rgba(255,215,0,0.3);
            text-align: center;
        }
        
        .total-display {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent);
            margin-top: 8px;
        }
        
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .filters input, .filters select {
            flex: 1;
            margin-top: 0;
            padding: 10px;
            font-size: 12px;
        }
        
        .actions-cell { display: flex; gap: 5px; align-items: center; }
        
        .icon-btn {
            width: 28px;
            height: 28px;
            padding: 0;
            margin: 0;
            border-radius: 6px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1a1a1a;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            border: 1px solid var(--primary);
            font-size: 13px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }
        
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: var(--card);
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 350px;
            border: 1px solid #333;
        }
        
        .modal-header { color: var(--primary); font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .modal-body { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        
        .backup-info {
            background: rgba(0,209,178,0.1);
            border: 1px solid var(--primary);
            padding: 10px;
            border-radius: 8px;
            font-size: 11px;
            color: var(--primary);
            margin-top: 10px;
            text-align: center;
        }
        
        .hidden { display: none !important; }
        
        .toggle-section {
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .toggle-section::after {
            content: '▼';
            font-size: 12px;
            transition: transform 0.3s;
        }
        
        .toggle-section.active::after {
            transform: rotate(180deg);
        }
        
        .section-content {
            display: none;
        }
        
        .section-content.active {
            display: block;
        }
    </style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="modal" id="modal">
    <div class="modal-content">
        <div class="modal-header" id="modalTitle">Confirmação</div>
        <div class="modal-body" id="modalBody">Deseja excluir?</div>
        <div class="btn-group">
            <button class="btn-secondary" onclick="fecharModal()">Cancelar</button>
            <button class="btn-danger" id="modalConfirm">Confirmar</button>
        </div>
    </div>
</div>

    <button class="btn-main" onclick="login()">ACESSAR</button>

</div>
