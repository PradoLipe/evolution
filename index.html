<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SISTEMA EVOLUTION - V17</title>
    <style>
        :root {
            --primary: #00d1b2;
            --accent: #ffdd57;
            --danger: #ff3860;
            --bg: #0a0a0a;
            --card-bg: #1a1a1a;
        }

        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: #fff; padding: 10px; display: flex; flex-direction: column; align-items: center; margin: 0; }
        .container { max-width: 450px; width: 100%; background: var(--card-bg); padding: 20px; border-radius: 15px; border: 1px solid #333; box-shadow: 0 0 15px rgba(0, 209, 178, 0.1); box-sizing: border-box; }
        
        h2 { text-align: center; color: var(--primary); text-transform: uppercase; margin-bottom: 20px; font-size: 20px; letter-spacing: 1px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: var(--primary); font-size: 11px; text-transform: uppercase; }
        
        input, select { width: 100%; padding: 14px; margin-top: 5px; border: 1px solid #333; background: #262626; color: white; border-radius: 8px; box-sizing: border-box; font-size: 16px; transition: border 0.3s; }
        input:focus { border-color: var(--primary); outline: none; }

        button { width: 100%; padding: 15px; margin-top: 10px; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: transform 0.1s, opacity 0.2s; }
        button:active { transform: scale(0.98); }
        
        .btn-acessar { background: var(--primary); color: #000; }
        .btn-gerar { background: #48c774; color: #000; }
        .btn-backup { background: #3273dc; color: #fff; margin-top: 10px; }
        
        .calc-section { display: none; margin-top: 20px; padding: 15px; background: #222; border: 1px solid var(--accent); border-radius: 12px; }
        #resCalc { display:none; margin-top:15px; text-align: center; border-top: 1px solid #444; padding-top: 10px; }
        
        /* TABELA HISTÓRICO */
        .history-section { margin-top: 30px; border-top: 2px solid #333; padding-top: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 10px; }
        th { background: #333; color: var(--primary); padding: 10px 5px; text-align: left; }
        td { padding: 12px 5px; border-bottom: 1px solid #2a2a2a; }
        
        .val-liquido { color: var(--accent); font-weight: bold; font-size: 12px; }
        .resumo-box { background: #000; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid var(--accent); box-shadow: inset 0 0 10px rgba(255, 221, 87, 0.1); }
        
        footer { margin-top: 30px; padding: 20px; font-size: 10px; color: #666; text-align: center; width: 100%; }
        .action-btns { display: flex; gap: 5px; }
        .btn-mini { padding: 5px; font-size: 9px; width: auto; flex: 1; }
    </style>
</head>
<body>

<div class="container" id="login-screen">
    <h2>SISTEMA EVOLUTION</h2>
    <input type="tel" id="senhaInput" placeholder="Chave de Acesso" style="-webkit-text-security: disc;">
    <button class="btn-acessar" onclick="login()">ENTRAR NO SISTEMA</button>
</div>

<div class="container" id="main-panel" style="display: none;">
    <h2 id="saudacao">PAINEL</h2>
    
    <label>DADOS DO TURNO:</label>
    <input type="date" id="dataTurno">
    <input type="text" id="navio" placeholder="NOME DO NAVIO" style="margin-top:10px;">
    <input type="text" id="ternoInput" placeholder="Ex: 1º TERNO" style="margin-top:10px;">
    
    <label>RELATÓRIO WHATSAPP:</label>
    <select id="turnoRel" onchange="ajustarRel()">
        <option value="">Selecione o Turno</option>
        <option value="07x15">07x15</option>
        <option value="15x23">15x23</option>
        <option value="23x07">23x07</option>
    </select>
    <div id="camposRel"></div>
    <button class="btn-gerar" onclick="gerarRel()">GERAR TEXTO</button>
    <div id="relatorioArea" style="display:none; margin-top:10px; padding:12px; background:#000; color:#00ffca; border:1px solid var(--primary); font-family:monospace; font-size:11px; border-radius:5px;"></div>
    <button id="btnCopiar" onclick="copiar()" style="display:none; background:#3273dc; color:white;">COPIAR MENSAGEM</button>

    <hr style="border:0; border-top:1px solid #333; margin:25px 0;">

    <button class="btn-acessar" style="background:var(--accent); color:#000;" onclick="toggleCalc()">📊 CALCULADORA DE GANHOS</button>
    
    <div class="calc-section" id="calcSection">
        <label>TIPO DE DIA:</label>
        <select id="tipoDia"><option value="n">NORMAL</option><option value="f">DOMINGO/FERIADO</option></select>
        <label>TURNO E PRODUÇÃO:</label>
        <select id="turnoCalc" onchange="ajustarCalc()">
            <option value="07x15">07x15</option><option value="15x23" selected>15x23</option><option value="23x07">23x07</option>
        </select>
        <div id="camposCalc"></div>
        <label>QUANTIDADE DE CONFERENTES:</label>
        <select id="nConf"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option></select>
        <button class="btn-gerar" style="background:var(--accent); color:black;" onclick="calcularESalvar()">CALCULAR E SALVAR NO HISTÓRICO</button>
        <div id="resCalc">
            <div id="resBruto" style="color:#aaa; font-size:13px;"></div>
            <div id="resLiquido" style="color: var(--accent); font-size: 20px; font-weight: bold;"></div>
        </div>
    </div>

    <div class="history-section">
        <h3 style="font-size: 14px; color: var(--primary);">MEU HISTÓRICO DE NAVIOS</h3>
        <table id="tabelaHistorico">
            <thead>
                <tr>
                    <th style="width: 20%;">DATA</th>
                    <th style="width: 35%;">NAVIO</th>
                    <th style="width: 25%;">LÍQUIDO</th>
                    <th style="width: 20%;">STATUS</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        
        <div class="resumo-box">
            <div style="font-size: 11px; color:#aaa;">TOTAL ACUMULADO: <span id="totalAcumulado" style="float:right;">R$ 0,00</span></div>
            <div style="font-size: 15px; margin-top:8px; font-weight:bold; color:var(--accent);">A RECEBER: <span id="totalPendente" style="float:right;">R$ 0,00</span></div>
        </div>

        <button class="btn-backup" onclick="baixarBackup()">📥 BAIXAR BACKUP (JSON)</button>
        <button style="background:var(--danger); color:white; font-size:10px; margin-top: 15px;" onclick="limparHistorico()">LIMPAR TODO HISTÓRICO</button>
    </div>
</div>

<footer>
    © 2026 SISTEMA EVOLUTION - TODOS OS DIREITOS RESERVADOS A FELIPE PRADO
</footer>

<script>
    const USERS = {"002451": "FELIPE PRADO", "1980": "ANDERSON PRADO", "2026": "FABRICIO DIAS", "302466": "RODRIGO COSTA"};
    let logado = "";
    document.getElementById('dataTurno').value = new Date().toISOString().split('T')[0];

    function login() {
        const s = document.getElementById('senhaInput').value.trim();
        if (USERS[s]) {
            logado = USERS[s];
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-panel').style.display = 'block';
            document.getElementById('saudacao').innerText = "OLÁ, " + logado;
            ajustarCalc(); carregarHistorico();
            if (new Date().getDay() === 0) document.getElementById('tipoDia').value = 'f';
        } else { alert("Senha incorreta."); }
    }

    function toggleCalc() {
        const cs = document.getElementById('calcSection');
        cs.style.display = cs.style.display === 'block' ? 'none' : 'block';
    }

    function ajustarRel() {
        const t = document.getElementById('turnoRel').value;
        const div = document.getElementById('camposRel');
        div.innerHTML = (t === "15x23") ? '<input type="number" id="p1" placeholder="PROD 15x19" style="margin-top:10px;"><input type="number" id="p2" placeholder="PROD 20x23" style="margin-top:10px;">' : (t===""?"":'<input type="number" id="pGeral" placeholder="PRODUÇÃO TOTAL"
