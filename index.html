<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SISTEMA EVOLUTION - V17</title>
    <style>
        :root {
            --primary: #00d1b2;
            --accent: #ffdd57;
            --danger: #ff3860;
            --bg: #0d0d0d;
            --card-bg: #1a1a1a;
            --glow: 0 0 10px rgba(0, 209, 178, 0.3);
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: #fff; padding: 10px; display: flex; flex-direction: column; align-items: center; margin: 0; min-height: 100vh; }
        
        .container { 
            max-width: 450px; width: 100%; background: var(--card-bg); 
            padding: 25px; border-radius: 20px; border: 1px solid #333; 
            box-shadow: var(--glow); box-sizing: border-box; margin-top: 10px;
        }
        
        h2 { text-align: center; color: var(--primary); text-transform: uppercase; margin-bottom: 25px; font-size: 20px; letter-spacing: 2px; text-shadow: 0 0 5px rgba(0,209,178,0.5); }
        
        label { display: block; margin-top: 18px; font-weight: bold; color: var(--primary); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
        
        input, select { 
            width: 100%; padding: 14px; margin-top: 6px; border: 1px solid #333; 
            background: #222; color: white; border-radius: 10px; box-sizing: border-box; 
            font-size: 16px; transition: 0.3s;
        }
        
        input:focus { border-color: var(--primary); box-shadow: 0 0 8px rgba(0,209,178,0.2); outline: none; }

        button { 
            width: 100%; padding: 16px; margin-top: 12px; border: none; border-radius: 10px; 
            font-size: 13px; cursor: pointer; font-weight: bold; text-transform: uppercase; 
            transition: all 0.2s; 
        }
        
        button:active { transform: scale(0.96); }
        
        .btn-acessar { background: var(--primary); color: #000; box-shadow: 0 4px 15px rgba(0, 209, 178, 0.3); }
        .btn-gerar { background: #48c774; color: #000; }
        .btn-backup { background: #3273dc; color: #fff; }
        .btn-calc-toggle { background: var(--accent); color: #000; margin-top: 25px; }
        
        .calc-section { display: none; margin-top: 20px; padding: 18px; background: #252525; border: 1px solid var(--accent); border-radius: 15px; }
        #resCalc { display:none; margin-top:15px; text-align: center; border-top: 1px solid #444; padding-top: 15px; }
        
        .history-section { margin-top: 35px; border-top: 2px solid #333; padding-top: 25px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 15px; }
        th { background: #2a2a2a; color: var(--primary); padding: 12px 5px; text-align: left; border-radius: 5px 5px 0 0; }
        td { padding: 14px 5px; border-bottom: 1px solid #333; }
        
        .val-liquido { color: var(--accent); font-weight: bold; font-size: 12px; }
        .resumo-box { background: #000; padding: 18px; border-radius: 12px; margin-top: 20px; border: 1px solid var(--accent); }
        
        .action-btns { display: flex; gap: 8px; }
        .btn-mini { padding: 8px; font-size: 10px; width: auto; flex: 1; margin: 0; }

        footer { margin-top: auto; padding: 25px; font-size: 10px; color: #555; text-align: center; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="container" id="login-screen">
    <h2>SISTEMA EVOLUTION</h2>
    <label>ACESSO RESTRITO:</label>
    <input type="tel" id="senhaInput" placeholder="Digite sua Chave" style="-webkit-text-security: disc;">
    <button class="btn-acessar" onclick="login()">ENTRAR NO SISTEMA</button>
</div>

<div class="container" id="main-panel" style="display: none;">
    <h2 id="saudacao">PAINEL</h2>
    
    <label>INFORMAÇÕES DO DIA:</label>
    <input type="date" id="dataTurno">
    <input type="text" id="navio" placeholder="NOME DO NAVIO" style="margin-top:10px;">
    <input type="text" id="ternoInput" placeholder="Ex: 1º TERNO" style="margin-top:10px;">
    
    <label>RELATÓRIO PARA WHATSAPP:</label>
    <select id="turnoRel" onchange="ajustarRel()">
        <option value="">Selecione o Turno</option>
        <option value="07x15">07x15</option>
        <option value="15x23">15x23</option>
        <option value="23x07">23x07</option>
    </select>
    <div id="camposRel"></div>
    <button class="btn-gerar" onclick="gerarRel()">GERAR TEXTO</button>
    
    <div id="relatorioArea" style="display:none; margin-top:15px; padding:15px; background:#000; color:#00ffca; border:1px solid var(--primary); font-family:monospace; font-size:12px; border-radius:8px; white-space: pre-wrap;"></div>
    <button id="btnCopiar" onclick="copiar()" style="display:none; background:#3273dc; color:white;">COPIAR MENSAGEM</button>

    <button class="btn-calc-toggle" onclick="toggleCalc()">📊 CALCULADORA E REGISTRO</button>
    
    <div class="calc-section" id="calcSection">
        <label>TIPO DE DIA:</label>
        <select id="tipoDia"><option value="n">NORMAL</option><option value="f">DOMINGO/FERIADO</option></select>
        
        <label>TURNO E PRODUÇÃO:</label>
        <select id="turnoCalc" onchange="ajustarCalc()">
            <option value="07x15">07x15</option><option value="15x23" selected>15x23</option><option value="23x07">23x07</option>
        </select>
        <div id="camposCalc"></div>
        
        <label>Nº DE CONFERENTES:</label>
        <select id="nConf"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option></select>
        
        <button class="btn-gerar" style="background:var(--accent); color:black;" onclick="calcularESalvar()">CALCULAR E SALVAR</button>
        
        <div id="resCalc">
            <div id="resBruto" style="color:#aaa; font-size:13px;"></div>
            <div id="resLiquido" style="color: var(--accent); font-size: 22px; font-weight: bold;"></div>
        </div>
    </div>

    <div class="history-section">
        <h3 style="font-size: 14px; color: var(--primary); text-align: center;">HISTÓRICO DE NAVIOS</h3>
        <table id="tabelaHistorico">
            <thead>
                <tr>
                    <th>DATA</th>
                    <th>NAVIO</th>
                    <th>VALOR</th>
                    <th>AÇÃO</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        
        <div class="resumo-box">
            <div style="font-size: 11px; color:#aaa;">TOTAL GERAL: <span id="totalAcumulado" style="float:right;">R$ 0,00</span></div>
            <div style="font-size: 16px; margin-top:10px; font-weight:bold; color:var(--accent);">A RECEBER: <span id="totalPendente" style="float:right;">R$ 0,00</span></div>
        </div>

        <button class="btn-backup" onclick="baixarBackup()" style="margin-top: 20px;">📥 BAIXAR BACKUP DOS DADOS</button>
        <button style="background:var(--danger); color:white; font-size:10px; margin-top: 15px;" onclick="limparHistorico()">LIMPAR TUDO</button>
    </div>
</div>

<footer>
    © 2026 SISTEMA EVOLUTION - V17<br>
    TODOS OS DIREITOS RESERVADOS A FELIPE PRADO
</footer>

<script>
    const USERS = {"002451": "FELIPE PRADO", "1980": "ANDERSON PRADO", "2026": "FABRICIO DIAS", "302466": "RODRIGO COSTA"};
    let logado = "";

    // Inicializa a data de hoje
    document.getElementById('dataTurno').value = new Date().toISOString().split('T')[0];

    function login() {
        const input = document.getElementById('senhaInput');
        const s = input.value.trim();
        
        if (USERS[s]) {
            logado = USERS[s];
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-panel').style.display = 'block';
            document.getElementById('saudacao').innerText = "OLÁ, " + logado;
            
            // Configurações iniciais pós-login
            if (new Date().getDay() === 0) document.getElementById('tipoDia').value = 'f';
            ajustarCalc(); 
            carregarHistorico();
        } else { 
            alert("Senha incorreta!"); 
            input.value = "";
        }
    }

    function toggleCalc() {
        const cs = document.getElementById('calcSection');
        cs.style.display = (cs.style.display === 'block') ? 'none' : 'block';
    }

    function ajustarRel() {
        const t = document.getElementById('turnoRel').value;
        const div = document.getElementById('camposRel');
        if (t === "15x23") {
            div.innerHTML = '<input type="number" id="p1" placeholder="PROD 15x19" style="margin-top:10px;"><input type="number" id="p2" placeholder="PROD 20x23" style="margin-top:10px;">';
        } else if (t !== "") {
            div.innerHTML = '<input type="number" id="pGeral" placeholder="PRODUÇÃO TOTAL" style="margin-top:10px;">';
        } else {
            div.innerHTML = '';
        }
    }

    function gerarRel() {
        const tur = document.getElementById('turnoRel').value;
        if(!tur) return alert("Selecione o turno!");
        const n = (document.getElementById('navio').value || "S/N").toUpperCase();
        const terno = (document.getElementById('ternoInput').value || "S/T").toUpperCase();
        const d = document.getElementById('dataTurno').value.split('-').reverse().join('/');
        let p = "", tot = 0;

        if(tur === "15x23") {
            const v1 = parseInt(document.getElementById('p1').value) || 0;
            const v2 = parseInt(document.getElementById('p2').value) || 0;
            p = `15x19: ${v1}\n20x23: ${v2}`; 
            tot = v1 + v2;
        } else {
            tot = parseInt(document.getElementById('pGeral').value) || 0;
            p = `PRODUÇÃO: ${tot}`;
        }

        const msg = `NAVIO: ${n}\nDATA: ${d}\nTERNO: ${terno}\nTURNO: ${tur}\n${p}\nTOTAL: ${tot}\nCONF: ${logado}`;
        document.getElementById('relatorioArea').innerText = msg;
        document.getElementById('relatorioArea').style.display = 'block';
        document.getElementById('btnCopiar').style.display = 'block';
    }

    function ajustarCalc() {
        const t = document.getElementById('turnoCalc').value;
        const div = document.getElementById('camposCalc');
        if (t === "15x23") {
            div.innerHTML = '<input type="number" id="t1" placeholder="PROD 15x19" style="margin-top:10px;"><input type="number" id="t2" placeholder="PROD 20x23" style="margin-top:10px;">';
        } else {
            div.innerHTML = '<input type="number" id="tGeral" placeholder="PROD TOTAL" style="margin-top:10px;">';
        }
    }

    function calcularESalvar() {
        const data = document.getElementById('dataTurno').value.split('-').reverse().join('/');
        const navio = (document.getElementById('navio').value || "S/N").toUpperCase();
        const tur = document.getElementById('turnoCalc').value;
        const tipo = document.getElementById('tipoDia').value;
        const n = parseInt(document.getElementById('nConf').value);
        let brutoTotal = 0;

        if(tur === "15x23") {
            const v1 = parseInt(document.getElementById('t1').value) || 0;
            const v2 = parseInt(document.getElementById('t2').value) || 0;
            // Taxas: Normal (5.73/6.88) | Feriado (8.61/10.32)
            brutoTotal = (tipo === 'f') ? (v1 * 8.61) + (v2 * 10.32) : (v1 * 5.73) + (v2 * 6.88);
        } else {
            const prod = parseInt(document.getElementById('tGeral').value) || 0;
            const taxa = (tur === "07x15") ? (tipo === 'f' ? 8.61 : 5.73) : 6.88;
            brutoTotal = prod * taxa;
        }

        const brutoIndiv = brutoTotal / n;
        const liquido = brutoIndiv * 0.82; // Desconto de 18%
        
        document.getElementById('resBruto').innerText = "BRUTO INDIVIDUAL: R$ " + brutoIndiv.toFixed(2);
        document.getElementById('resLiquido').innerText = "LÍQUIDO: R$ " + liquido.toFixed(2);
        document.getElementById('resCalc').style.display = 'block';

        let hist = JSON.parse(localStorage.getItem('hist_' + logado)) || [];
        hist.push({ id: Date.now(), data, navio, bruto: brutoIndiv, liquido, pago: false });
        localStorage.setItem('hist_' + logado, JSON.stringify(hist));
        
        setTimeout(carregarHistorico, 200);
    }

    function carregarHistorico() {
        const lista = JSON.parse(localStorage.getItem('hist_' + logado)) || [];
        const corpo = document.querySelector('#tabelaHistorico tbody');
        corpo.innerHTML = ""; 
        let totalMes = 0, pendente = 0;
        
        lista.forEach(item => {
            totalMes += item.liquido; 
            if(!item.pago) pendente += item.liquido;
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.data.substring(0,5)}</td>
                <td style="text-transform:uppercase">${item.navio}</td>
                <td class="val-liquido">R$ ${item.liquido.toFixed(2)}</td>
                <td>
                    <div class="action-btns">
                        <button class="btn-mini" style="background:${item.pago?'#444':'#48c774'}; color:${item.pago?'#aaa':'#000'}" onclick="alternarPago(${item.id})">${item.pago?'OK':'$'}</button>
                        <button class="btn-mini" style="background:var(--danger); color:#fff" onclick="excluirItem(${item.id})">X</button>
                    </div>
                </td>
            `;
            corpo.appendChild(tr);
        });
        document.getElementById('totalAcumulado').innerText = "R$ " + totalMes.toFixed(2);
        document.getElementById('totalPendente').innerText = "R$ " + pendente.toFixed(2);
    }

    function alternarPago(id) {
        let hist = JSON.parse(localStorage.getItem('hist_' + logado));
        hist = hist.map(item => item.id === id ? {...item, pago: !item.pago} : item);
        localStorage.setItem('hist_' + logado, JSON.stringify(hist)); 
        carregarHistorico();
    }

    function excluirItem(id) {
        if(confirm("Excluir este navio do histórico?")) {
            let hist = JSON.parse(localStorage.getItem('hist_' + logado));
            hist = hist.filter(item => item.id !== id);
            localStorage.setItem('hist_' + logado, JSON.stringify(hist)); 
            carregarHistorico();
        }
    }

    function baixarBackup() {
        const data = localStorage.getItem('hist_' + logado);
        if(!data || data === "[]") return alert("Não há dados para backup.");
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `BACKUP_${logado.replace(' ', '_')}_${new Date().toLocaleDateString()}.json`;
        a.click();
    }

    function copiar() { 
        const area = document.getElementById('relatorioArea');
        navigator.clipboard.writeText(area.innerText).then(() => alert("Copiado com sucesso!"));
    }

    function limparHistorico() { 
        if(confirm("ATENÇÃO: Isso apagará TODOS os seus registros. Deseja continuar?")) { 
            localStorage.removeItem('hist_' + logado); 
            carregarHistorico(); 
        } 
    }
</script>
</body>
</html>
