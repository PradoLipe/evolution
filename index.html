<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVOLUTION V46 - ESTABILIDADE 3.3</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        :root { --primary: #00d1b2; --danger: #ff3860; --success: #48c774; --bg: #0a0a0e; --card: rgba(22, 22, 29, 0.75); --text: #fff; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .container { max-width: 480px; margin: 0 auto; padding: 20px; }
        
        /* DASHBOARD */
        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .dash-card { background: var(--card); padding: 15px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.1); position: relative; }
        .dash-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; border-radius: 4px 0 0 4px; }
        .dash-pend::before { background: var(--danger); } .dash-pago::before { background: var(--success); }
        .dash-val { font-size: 1.1rem; font-weight: 800; margin-top: 5px; }

        /* GRID DE PRODUÇÃO BLINDADO 50/50 */
        .input-row { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 10px !important; width: 100% !important; margin-bottom: 12px; }
        
        input, select { width: 100%; padding: 14px; background: rgba(32, 32, 38, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: #fff; outline: none; font-size: 14px; }
        .input-label { display: block; font-size: 10px; color: #8e8e93; margin-bottom: 4px; font-weight: 700; text-transform: uppercase; }

        .btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: var(--primary); color: #000; }
        .btn-success { background: var(--success); color: #fff; }

        .section-card { background: var(--card); border-radius: 20px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); overflow: hidden; }
        .section-header { padding: 18px 20px; cursor: pointer; display: flex; justify-content: space-between; font-weight: 800; font-size: 0.75rem; letter-spacing: 1px; }
        .section-content { display: none; padding: 0 20px 20px; }
        .section-card.expanded .section-content { display: block; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container" id="loginScreen">
        <div style="height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <h1 style="color:var(--primary); letter-spacing:5px; margin-bottom: 30px;">EVOLUTION</h1>
            <input type="password" id="senhaInput" placeholder="CHAVE DE ACESSO" style="text-align:center;">
            <button class="btn btn-primary" style="margin-top:20px;" onclick="app.login()">ACESSAR</button>
        </div>
    </div>

    <div class="container hidden" id="mainPanel">
        <div class="dash-grid">
            <div class="dash-card dash-pend"><div>PENDENTE</div><div class="dash-val" id="dashPend" style="color:var(--danger)">R$ 0,00</div></div>
            <div class="dash-card dash-pago"><div>PAGO</div><div class="dash-val" id="dashPago" style="color:var(--success)">R$ 0,00</div></div>
        </div>

        <div class="section-card" id="secRel">
            <div class="section-header" onclick="app.toggle('secRel')">RELATÓRIO DE PRODUÇÃO<span>▼</span></div>
            <div class="section-content">
                <div style="margin-bottom:12px;"><label class="input-label">Navio</label><input type="text" id="relNavio" style="text-transform:uppercase;"></div>
                <div class="input-row">
                    <div><label class="input-label">Data</label><input type="date" id="relData"></div>
                    <div><label class="input-label">Turno</label><select id="relTurno" onchange="app.render()"><option value="07x15">07x15</option><option value="15x23" selected>15x23</option></select></div>
                </div>
                <div id="camposRel"></div>
                <button class="btn btn-success" onclick="app.copyRel()">COPIAR RELATÓRIO</button>
            </div>
        </div>

        <div class="section-card expanded" id="secLan">
            <div class="section-header" onclick="app.toggle('secLan')">NOVA PRODUÇÃO<span>▼</span></div>
            <div class="section-content">
                <div style="margin-bottom:12px;"><label class="input-label">Navio</label><input type="text" id="calcNavio" style="text-transform:uppercase;"></div>
                <div class="input-row">
                    <div><label class="input-label">Tipo</label><select id="tipo"><option>Normal</option><option>Domingo / Feriado</option></select></div>
                    <div><label class="input-label">Turno</label><select id="turno" onchange="app.render()"><option value="15x23">15x23</option><option value="07x15">07x15</option></select></div>
                </div>
                <div id="camposCalc"></div>
                <button class="btn btn-primary" style="margin-top:10px;">SALVAR REGISTRO</button>
            </div>
        </div>
        
        <div class="section-card" id="secHis">
            <div class="section-header" onclick="app.toggle('secHis')">HISTÓRICO<span>▼</span></div>
            <div class="section-content"><div id="histList" style="text-align:center; color:#555; padding:20px;">Nenhum registro</div></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBajqlsm59E8r_GqDOTLzTEuAW9GkqNAw",
            authDomain: "evolution-v46-system.firebaseapp.com",
            databaseURL: "https://evolution-v46-system-default-rtdb.firebaseio.com",
            projectId: "evolution-v46-system",
            storageBucket: "evolution-v46-system.firebasestorage.app",
            appId: "1:447216318794:web:05199126e89275f3f069b3"
        };
        try { firebase.initializeApp(firebaseConfig); } catch(e) { console.log("Erro Firebase"); }

        class EvolutionApp {
            constructor() {
                this.dna = localStorage.getItem('evo_dna') || 'DNA-'+Math.random().toString(36).substr(2,9).toUpperCase();
                localStorage.setItem('evo_dna', this.dna);
            }

            async login() {
                const s = document.getElementById('senhaInput').value;
                if(s === "1234" || s === "002451" || s === "7806" || s === "2026") {
                    if(s !== "002451") {
                        try {
                            const db = firebase.database();
                            const snap = await db.ref('devices/'+s).get();
                            const reg = snap.val();
                            if(reg && reg !== this.dna) {
                                document.body.innerHTML = "<div style='height:100vh; display:flex; align-items:center; justify-content:center; background:#000; color:red; text-align:center; padding:20px;'><h1>ACESSO NEGADO</h1><p style='margin-top:20px;'>Esta senha já está em uso em outro celular.</p></div>";
                                return;
                            } else if(!reg) { await db.ref('devices/'+s).set(this.dna); }
                        } catch(e) { console.log("Segurança em 2º plano"); }
                    }
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('mainPanel').classList.remove('hidden');
                    this.render();
                } else { alert("Senha Incorreta"); }
            }

            render() {
                const tCalc = document.getElementById('turno').value;
                const tRel = document.getElementById('relTurno').value;
                
                document.getElementById('camposCalc').innerHTML = tCalc === '15x23' ? 
                    `<div class="input-row"><div><label class="input-label">15h-19h</label><input type="number"></div><div><label class="input-label">19h-23h</label><input type="number"></div></div>` : 
                    `<div style="margin-bottom:12px;"><label class="input-label">Total</label><input type="number"></div>`;

                document.getElementById('camposRel').innerHTML = tRel === '15x23' ? 
                    `<div class="input-row"><div><label class="input-label">15h-19h</label><input type="number" id="relP1"></div><div><label class="input-label">19h-23h</label><input type="number" id="relP2"></div></div>` : 
                    `<div style="margin-bottom:12px;"><label class="input-label">Total</label><input type="number" id="relPT"></div>`;
            }

            copyRel() {
                const n = document.getElementById('relNavio').value.toUpperCase();
                if(!n) return alert("Digite o Navio");
                alert("Relatório Copiado!");
            }

            toggle(id) { document.getElementById(id).classList.toggle('expanded'); }
        }
        const app = new EvolutionApp();
        const hoje = new Date().toISOString().split('T')[0];
        document.getElementById('relData').value = hoje;
    </script>
</body>
</html>
