<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVOLUTION - V51 PREMIUM</title>
    <style>
        :root { 
            --primary: #00d1b2; --accent: #ffd700; --danger: #ff3860; --success: #48c774;
            --info: #209cee; --bg: #0a0a0e; --card: #16161d; --input: #202026;
            --text: #ffffff; --text-dim: #8e8e93; --border: rgba(255,255,255,0.08);
        }
        * { -webkit-user-select: none; user-select: none; box-sizing: border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
        input, select { user-select: text; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; }
        .container { max-width: 480px; width: 100%; padding: 20px; }
        
        /* LOGIN PREMIUM */
        .glass-card { background: rgba(255,255,255,0.03); backdrop-filter: blur(15px); border: 1px solid var(--border); border-radius: 30px; padding: 50px 25px; text-align: center; margin-top: 15vh; }
        .evolution-logo { font-size: 2.5rem; font-weight: 900; letter-spacing: 8px; background: linear-gradient(135deg, var(--primary), #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        input, select { width: 100%; padding: 16px; background: var(--input); border: 1px solid var(--border); border-radius: 15px; color: var(--text); font-size: 1rem; margin-top: 12px; }
        .btn-main { background: var(--primary); color: #000; width: 100%; margin-top: 20px; border-radius: 15px; font-weight: 800; padding: 18px; border:none; cursor:pointer; text-transform: uppercase; }

        /* DASHBOARD */
        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .dash-item { background: var(--card); padding: 18px; border-radius: 20px; border: 1px solid var(--border); }
        .dash-val { font-size: 1.1rem; font-weight: 800; display: block; margin-top: 5px; }

        /* SEÇÕES */
        .section-card { background: var(--card); padding: 22px; border-radius: 24px; margin-bottom: 15px; border: 1px solid var(--border); }
        h3 { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; }

        /* HISTÓRICO (ESTILO FOTO) */
        .hist-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border); }
        .val-liq { color: var(--accent); font-weight: 800; font-size: 1rem; }
        .val-bruto { color: var(--text-dim); font-size: 0.75rem; display: block; }

        .footer-rights { text-align: center; padding: 30px 0; font-size: 10px; color: var(--text-dim); letter-spacing: 2px; }
        .hidden { display: none !important; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: var(--card); padding: 30px; border-radius: 30px; width: 100%; max-width: 400px; text-align: center; border: 1px solid var(--border); }
    </style>
</head>
<body>

<div class="modal" id="modalConfig">
    <div class="modal-content">
        <h3 style="color:var(--primary);">Configurações</h3>
        <button class="btn-main" onclick="exportarExcel()" style="background:var(--success); color:#fff;">📊 Baixar Planilha Excel</button>
        <button class="btn-main" onclick="exportarJSON()">📤 Copiar Backup</button>
        <button class="btn-main" onclick="importarJSON()">📥 Restaurar Backup</button>
        <button onclick="fecharModal()" style="background:none; border:none; color:var(--danger); margin-top:20px; font-weight:bold;">FECHAR</button>
    </div>
</div>

<div class="container" id="login-screen">
    <div class="glass-card">
        <div class="evolution-logo">EVOLUTION</div>
        <p style="color: var(--text-dim); font-size: 0.7rem; margin-bottom: 40px; letter-spacing: 4px;">SISTEMA ADMINISTRATIVO</p>
        <input type="password" id="senhaInput" placeholder="DIGITE SUA SENHA">
        <button class="btn-main" onclick="login()">ENTRAR</button>
    </div>
    <div class="footer-rights">
        © 2026 ALL RIGHTS RESERVED TO<br>
        <span style="color:var(--primary); font-weight:bold;">FELIPE PRADO</span>
    </div>
</div>

<div class="container hidden" id="main-panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 25px;">
        <h2 id="userName" style="font-weight:900;">...</h2>
        <div style="background:var(--card); padding:10px; border-radius:12px; border:1px solid var(--border); cursor:pointer;" onclick="abrirModal()">⚙️</div>
    </div>

    <div class="dash-grid">
        <div class="dash-item"><span style="font-size:9px; color:var(--text-dim);">BRUTO</span><div id="dashTotalBruto" style="color:var(--info);" class="dash-val">R$ 0,00</div></div>
        <div class="dash-item"><span style="font-size:9px; color:var(--text-dim);">LÍQUIDO</span><div id="dashTotalLiquido" style="color:var(--accent);" class="dash-val">R$ 0,00</div></div>
    </div>

    <div class="section-card">
        <h3 onclick="toggleSection('rel-box')" style="cursor:pointer">📄 GERADOR DE RELATÓRIO <span>▼</span></h3>
        <div id="rel-box" class="hidden">
            <input type="date" id="dataRel">
            <input type="text" id="navioRel" placeholder="Nome do Navio">
            <select id="turnoRel" onchange="ajustarRel()">
                <option value="">Selecione o Turno</option>
                <option value="07x15">07x15</option>
                <option value="15x23">15x23</option>
                <option value="23x07">23x07</option>
            </select>
            <div id="camposRel"></div>
            <button class="btn-main" style="background:#25d366; color:#fff;" onclick="gerarRel()">Copiar p/ WhatsApp</button>
        </div>
    </div>

    <div class="section-card">
        <h3>💰 LANÇAR PRODUÇÃO</h3>
        <input type="date" id="dataCalc">
        <input type="text" id="navioCalc" placeholder="Navio">
        <select id="turnoCalc" onchange="ajustarCalc()"><option value="15x23">15x23</option><option value="07x15">07x15</option><option value="23x07">23x07</option></select>
        <div id="camposCalc"></div>
        <button class="btn-main" onclick="salvar()">SALVAR SERVIÇO</button>
    </div>

    <div class="section-card">
        <h3>📅 HISTÓRICO</h3>
        <div id="listaHist"></div>
    </div>
    
    <div class="footer-rights">EVOLUTION • FELIPE PRADO</div>
</div>

<script>
    const USERS = {"002451": "FELIPE PRADO", "7806": "EdilsonRj", "1980": "ANDERSON PRADO", "2026": "FABRICIO DIAS", "302466": "RODRIGO COSTA", "3373": "RICARDO PRADO", "2912": "JOHNY"};
    let logado = "", todosDados = [];
    const $ = id => document.getElementById(id);

    function login() {
        const key = $('senhaInput').value;
        if(USERS[key]) {
            logado = USERS[key];
            $('userName').textContent = logado;
            $('login-screen').classList.add('hidden');
            $('main-panel').classList.remove('hidden');
            carregar();
        } else alert("Senha incorreta!");
    }

    function carregar() {
        todosDados = JSON.parse(localStorage.getItem('hist_' + logado)) || [];
        render(); atualizarDash(); ajustarCalc();
        $('dataCalc').value = new Date().toISOString().split('T')[0];
    }

    function ajustarRel() {
        const t = $('turnoRel').value;
        $('camposRel').innerHTML = t === "15x23" ? '<input type="number" id="p1" placeholder="Prod 15-19h"><input type="number" id="p2" placeholder="Prod 20-23h">' : (t ? '<input type="number" id="pG" placeholder="Total">' : '');
    }

    function gerarRel() {
        const t = $('turnoRel').value;
        const navio = ($('navioRel').value || "S/N").toUpperCase();
        let prod = t === "15x23" ? (parseInt($('p1').value)||0) + (parseInt($('p2').value)||0) : (parseInt($('pG').value)||0);
        const msg = `*EVOLUTION REPORT*\n\nNavio: ${navio}\nTurno: ${t}\nProdução: ${prod}\nConferente: ${logado}`;
        navigator.clipboard.writeText(msg); alert("Relatório copiado!");
    }

    function ajustarCalc() {
        const t = $('turnoCalc').value;
        $('camposCalc').innerHTML = t === "15x23" ? '<input type="number" id="t1" placeholder="15-19h"><input type="number" id="t2" placeholder="20-23h">' : '<input type="number" id="tG" placeholder="Total">';
    }

    function salvar() {
        const t = $('turnoCalc').value;
        let b = t === "15x23" ? ((parseInt($('t1').value)||0)*5.73) + ((parseInt($('t2').value)||0)*6.88) : (parseInt($('tG').value)||0) * 5.73;
        todosDados.unshift({ id: Date.now(), data: $('dataCalc').value.split('-').reverse().join('/').substring(0,5), navio: ($('navioCalc').value||"S/N").toUpperCase(), bruto: b/3, liquido: (b/3)*0.82 });
        localStorage.setItem('hist_'+logado, JSON.stringify(todosDados));
        render(); atualizarDash();
    }

    function render() {
        const c = $('listaHist'); c.innerHTML = '';
        todosDados.forEach(i => {
            const d = document.createElement('div'); d.className='hist-item';
            d.innerHTML = `<div><b>${i.navio}</b><br><small>${i.data}</small></div><div style="text-align:right"><span class="val-liq">R$ ${i.liquido.toFixed(2).replace('.',',')}</span><span class="val-bruto">BRUTO R$ ${i.bruto.toFixed(2).replace('.',',')}</span></div><div onclick="remover(${i.id})" style="color:red; margin-left:15px; font-weight:bold;">×</div>`;
            c.appendChild(d);
        });
    }

    function remover(id) { if(confirm("Remover?")) { todosDados = todosDados.filter(x => x.id !== id); localStorage.setItem('hist_'+logado, JSON.stringify(todosDados)); render(); atualizarDash(); } }
    function atualizarDash() {
        const b = todosDados.reduce((a,x)=>a+x.bruto,0);
        const l = todosDados.reduce((a,x)=>a+x.liquido,0);
        $('dashTotalBruto').textContent = "R$ " + b.toFixed(2).replace('.',',');
        $('dashTotalLiquido').textContent = "R$ " + l.toFixed(2).replace('.',',');
    }

    function abrirModal() { $('modalConfig').style.display = 'flex'; }
    function fecharModal() { $('modalConfig').style.display = 'none'; }
    function toggleSection(id) { $(id).classList.toggle('hidden'); }
    function exportarJSON() { navigator.clipboard.writeText(JSON.stringify(todosDados)); alert("Backup copiado!"); }
    function importarJSON() { const c = prompt("Cole o backup:"); if(c) { todosDados = JSON.parse(c); localStorage.setItem('hist_'+logado, c); carregar(); } }
    function exportarExcel() {
        let csv = "Data;Navio;Bruto;Liquido\n";
        todosDados.forEach(i => { csv += `${i.data};${i.navio};${i.bruto.toFixed(2)};${i.liquido.toFixed(2)}\n`; });
        const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Evolution_${logado}.csv`;
        link.click();
    }
</script>
</body>
</html>
